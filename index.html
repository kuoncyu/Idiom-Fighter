<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#050510">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="apple-touch-icon" href="icon-192.png">
    <title>成語戰機：星際觸控版</title>
    <style>
        *, *::before, *::after, button, input, textarea, select { font-family: 'DFKai-SB','BiauKai','標楷體','KaiTi','Kaiti TC',serif !important; }
        :root {
            --neon-blue: #00f2ff;
            --neon-pink: #ff00ff;
            --neon-gold: #ffea00;
            --neon-purple: #b026ff;
            --neon-green: #00ffcc;
            --neon-orange: #ffaa00;
            --neon-red: #ff3366;
            --bg-dark: #050510;
        }
        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-dark);
            color: white;
            font-family: 'DFKai-SB', 'BiauKai', '標楷體', 'KaiTi', 'Kaiti TC', 'STKaiti', 'AR PL UKai TW', serif;
            overflow: hidden;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
        }
        #game-container {
            position: relative;
            width: var(--app-w, 100vw);
            height: var(--app-h, 100vh);
            display: flex;
            justify-content: center;
            align-items: center;
        }
        canvas {
            background: #020205;
            display: block;
            box-shadow: 0 0 20px rgba(0, 242, 255, 0.2);
            touch-action: none;
        }
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }
        .menu-overlay {
            background: rgba(5, 5, 16, 0.95);
            border: 2px solid var(--neon-blue);
            padding: 30px;
            border-radius: 15px;
            text-align: center;
            pointer-events: auto;
            min-width: 320px;
            box-shadow: 0 0 30px rgba(0, 242, 255, 0.3);
            max-height: 80vh;
            overflow-y: auto;
        }
        * { text-shadow: none !important; }
        h1, h2 { color: var(--neon-blue); text-shadow: 0 0 10px var(--neon-blue); margin-bottom: 20px; }
        .shop-title { color: var(--neon-purple); text-shadow: 0 0 10px var(--neon-purple); margin-top: 0; }
        .btn {
            background: rgba(0, 242, 255, 0.1); border: 1px solid var(--neon-blue);
            color: var(--neon-blue); padding: 12px 20px; margin: 10px auto; cursor: pointer;
            font-size: 1.1rem; transition: all 0.3s; border-radius: 5px; display: block;
            width: 90%; text-transform: uppercase; font-weight: bold;
        }
        .btn:hover:not(:disabled) { background: var(--neon-blue); color: black; box-shadow: 0 0 15px var(--neon-blue); }
        .btn:disabled { border-color: #555; color: #555; cursor: not-allowed; background: transparent; }
        .btn-shop { border-color: var(--neon-purple); color: var(--neon-purple); }
        .btn-shop.shop-row { display: flex; align-items: center; gap: 12px; text-align: left; width: min(92vw, 520px); }
        .shop-ic { flex: none; width: 64px; height: 64px; display: flex; align-items: center; justify-content: center; border-radius: 12px; background: radial-gradient(circle at 50% 40%, rgba(255,255,255,0.14), rgba(255,255,255,0.03) 70%); border: 1px solid rgba(255,255,255,0.18); }
        .shop-ic img, .shop-ic svg { max-width: 56px; max-height: 56px; width: auto; height: auto; object-fit: contain; }
        .shop-ic svg { width: 52px; height: 52px; }
        .shop-tx { flex: 1; min-width: 0; line-height: 1.5; }
        .btn-shop:disabled .shop-ic img { filter: grayscale(0.6) opacity(0.7); }
        .btn-shop:hover:not(:disabled) { background: var(--neon-purple); color: white; box-shadow: 0 0 15px var(--neon-purple); }
        .btn-start { background: rgba(0, 242, 255, 0.2); font-size: 1.3rem; padding: 15px; margin-top: 20px; }
        
        #hud {
            position: absolute; top: 10px; left: 10px; right: 10px; display: flex;
            justify-content: space-between; pointer-events: none; font-family: 'DFKai-SB', 'BiauKai', '標楷體', 'KaiTi', 'Kaiti TC', 'STKaiti', 'AR PL UKai TW', serif;
            font-size: 1rem; color: var(--neon-blue); background: rgba(0,0,0,0.6);
            padding: 10px 15px; border-radius: 10px; border: 1px solid rgba(0,242,255,0.3); z-index: 5;
        }
        .hud-item { margin: 0 5px; }
        .hud-dm { color: var(--neon-purple); font-weight: bold; text-shadow: 0 0 5px var(--neon-purple); }
        
        #stage-info {
            position: absolute; top: 60px; left: 50%; transform: translateX(-50%);
            color: var(--neon-gold); font-weight: bold; font-size: 1.2rem; text-shadow: 0 0 5px black;
        }
        .boss-hp-bar { position: absolute; top: 90px; left: 50%; transform: translateX(-50%); width: 80%; height: 10px; background: #333; border: 1px solid white; display: none; }
        .boss-hp-fill { width: 100%; height: 100%; background: linear-gradient(to right, #f00, #ff0); transition: width 0.2s; }
        
        .idiom-slots {
            position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
            display: flex; gap: 10px; align-items: flex-end; z-index: 20; flex-wrap: nowrap; justify-content: center; width: 98%; pointer-events: none;
        }
        .slot {
            flex: 1; max-width: 120px; height: 80px; border: 2px solid #444; background: rgba(0,0,0,0.8);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            border-radius: 8px; transition: all 0.3s; pointer-events: none; position: relative;
        }
        .slot.collecting { border-color: var(--neon-blue); box-shadow: 0 0 8px rgba(0, 242, 255, 0.3); }
        .slot.ready { 
            border-color: var(--neon-gold); box-shadow: 0 0 20px var(--neon-gold); 
            cursor: pointer; pointer-events: auto; animation: pulseReady 0.8s infinite alternate;
            background: rgba(255, 234, 0, 0.15);
        }
        
        .slot-title { font-size: 1.2rem; margin-bottom: 5px; white-space: nowrap; display: flex; gap: 2px; }
        .char { display: inline-block; transition: all 0.3s; font-weight: bold; }
        .char.collected { color: var(--neon-blue); text-shadow: 0 0 8px var(--neon-blue); transform: scale(1.1); }
        .char.uncollected { color: rgba(255,255,255,0.2); }
        
        .slot-subtitle { font-size: 0.7rem; color: #aaa; text-align: center; }
        .ready .char.collected { color: var(--neon-gold); text-shadow: 0 0 10px var(--neon-gold); }
        .ready .slot-subtitle { color: var(--neon-gold); font-weight: bold; font-size: 0.8rem; text-shadow: 0 0 5px var(--neon-gold); }
        
        @keyframes pulseReady { 
            from { box-shadow: 0 0 10px var(--neon-gold); border-color: var(--neon-gold); transform: scale(1); } 
            to { box-shadow: 0 0 30px var(--neon-gold), inset 0 0 15px var(--neon-gold); border-color: #fff; transform: scale(1.05); } 
        }
        .slot { overflow: visible; }
        .slot-key { position:absolute; top:-10px; left:-6px; width:22px; height:22px; line-height:22px; text-align:center;
            font: bold 0.85rem 'DFKai-SB','BiauKai','標楷體','KaiTi','Kaiti TC',serif; background:#050510; border:1px solid var(--neon-blue); color:var(--neon-blue); border-radius:5px; }
        .slot.ready .slot-key { background:var(--neon-gold); color:#000; border-color:var(--neon-gold); box-shadow:0 0 10px var(--neon-gold); }
        #idiom-popup { display:none; position:absolute; left:50%; top:42%; transform:translate(-50%,-50%); z-index:30; width:min(86vw,460px);
            padding:22px 26px; text-align:center; background:rgba(5,5,16,.94); border:2px solid var(--neon-gold); border-radius:14px;
            box-shadow:0 0 35px rgba(255,234,0,.45); pointer-events:none; }
        .ip-word { font-size:2.4rem; font-weight:bold; letter-spacing:.2em; color:var(--neon-gold); text-shadow:0 0 12px var(--neon-gold); }
        .ip-effect { color:var(--neon-purple); margin:6px 0 12px; font-weight:bold; }
        .ip-line { text-align:left; line-height:1.7; color:#e8f7ff; font-size:1.05rem; }
        .ip-line b { color:var(--neon-blue); }
        .ip-bar { height:6px; background:#333; border-radius:3px; margin-top:16px; overflow:hidden; }
        .ip-bar i { display:block; height:100%; background:var(--neon-gold); animation: ipCount 5s linear forwards; }
        @keyframes ipCount { from { width:0; } to { width:100%; } }
        .idm-b { font-weight:900; color:#fff; }
        #coop-casts { position:absolute; left:50%; top:96px; transform:translateX(-50%); z-index:30; width:min(88vw,430px); display:flex; flex-direction:column; gap:8px; pointer-events:none; }
        .cc-card { padding:10px 14px; text-align:center; background:rgba(5,5,16,.9); border:2px solid var(--neon-gold); border-radius:12px; box-shadow:0 0 22px rgba(255,234,0,.35); }
        .cc-name { font-size:.8rem; color:#9ff; } .cc-word { font-size:1.6rem; font-weight:bold; letter-spacing:.2em; color:var(--neon-gold); }
        .cc-eff { color:var(--neon-purple); font-size:.85rem; font-weight:bold; margin:2px 0 6px; } .cc-line { text-align:left; line-height:1.6; color:#e8f7ff; font-size:.95rem; } .cc-line > b { color:var(--neon-blue); }
        .cc-bar { height:4px; background:#333; border-radius:2px; margin-top:8px; overflow:hidden; } .cc-bar i { display:block; height:100%; background:var(--neon-gold); animation: ipCount 5s linear forwards; }
        .cards { display:flex; flex-wrap:wrap; gap:12px; justify-content:center; width:100%; margin:10px 0; }
        .card { width:262px; background:rgba(10,12,30,.92); border:2px solid #334; border-radius:12px; padding:10px; text-align:left; cursor:pointer; }
        .card.sel { border-color:var(--neon-blue); box-shadow:0 0 14px var(--neon-blue); }
        .card h3 { margin:4px 0; color:#fff; font-size:1.05rem; }
        .card.eq h3::after { content:' ✔出戰中'; color:var(--neon-gold); font-size:.8rem; }
        .card img { width:100%; height:90px; object-fit:contain; }
        .card.locked img { filter:grayscale(1) brightness(.5); }
        .card .st { display:flex; align-items:center; gap:6px; margin:5px 0; font-size:.8rem; }
        .card .st span { width:34px; } .card .st b { width:46px; text-align:right; color:var(--neon-gold); font-size:.78rem; }
        .card .bar { flex:1; height:8px; border-radius:4px; } .card .bar i { display:block; height:100%; border-radius:4px; background:var(--neon-blue); }
        .card .st em.lv { font-style:normal; width:38px; text-align:center; font-size:.72rem; color:#9fe8ff; white-space:nowrap; }
        .card .st em.lv.max { color:var(--neon-gold); }
        .card .st button { font-size:.7rem; padding:2px 5px; background:rgba(0,242,255,.15); border:1px solid var(--neon-blue); color:#fff; border-radius:4px; cursor:pointer; }
        .card .st button:disabled { opacity:.35; cursor:default; }
        .hbtn { pointer-events:auto; background:rgba(0,242,255,.12); border:1px solid var(--neon-blue); color:var(--neon-blue); border-radius:8px; padding:4px 10px; margin-right:6px; cursor:pointer; font-size:.9rem; font-family:inherit; }
        .hbtn:hover { background:rgba(0,242,255,.35); }
        #buff-bar { position:absolute; top:66px; left:12px; display:flex; flex-wrap:wrap; gap:6px; max-width:48%; z-index:6; pointer-events:none; }
        .buff { position:relative; overflow:hidden; min-width:96px; padding:3px 8px 6px; border-radius:8px; background:rgba(0,0,0,.65); border:1px solid var(--c); color:var(--c); font-size:.75rem; font-weight:bold; }
        .buff i { position:absolute; left:0; bottom:0; height:3px; background:var(--c); }
        .buff .by { display:block; font-size:.85em; line-height:1.15; opacity:.95; text-shadow:0 0 3px #000; white-space:nowrap; }
        .dlg { display:none; position:absolute; inset:0; z-index:60; background:rgba(0,0,10,.72); align-items:center; justify-content:center; }
        .dlg .box { max-height:90%; overflow-y:auto; background:#0a0a1a; border:2px solid var(--neon-blue); border-radius:14px; padding:20px 26px; min-width:270px; max-width:90vw; text-align:center; box-shadow:0 0 25px rgba(0,242,255,.4); color:#fff; }
        .dlg label { display:block; margin:12px 0; font-size:.9rem; text-align:left; } .dlg input[type=range] { width:100%; }
        .lob-title { margin:0; letter-spacing:.3em; text-shadow:0 0 18px var(--neon-blue); }
        .dmline { color:var(--neon-purple); margin:4px 0 8px; }
        .tiles { display:grid; grid-template-columns:repeat(4,1fr); gap:10px; width:100%; margin:6px auto; }
        .tile { position:relative; overflow:hidden; border-radius:14px; padding:12px; min-height:110px; color:#fff; text-align:left; cursor:pointer; border:1px solid rgba(255,255,255,.18);
            background:linear-gradient(135deg,var(--a),var(--b)); transition:transform .2s, box-shadow .2s; }   /* 靜態磚：不再有漸層流動與翻面動畫 */
        .tile:hover { transform:translateY(-4px) scale(1.03); box-shadow:0 8px 22px rgba(0,0,0,.5), 0 0 16px var(--a); }
        .tile.w2 { grid-column:span 2; } .tile.h2 { grid-row:span 2; min-height:230px; }
        .tile h4 { margin:0 0 4px; font-size:1.05rem; } .tile small { display:block; opacity:.9; line-height:1.45; }
        .tile .f1, .tile .f2 { position:absolute; inset:0; padding:12px; display:flex; flex-direction:column; justify-content:center; }
        .tile.live .f1 { animation:liveA 7s infinite; } .tile.live .f2 { animation:liveB 7s infinite; }
        .tile img { position:absolute; right:6px; bottom:4px; height:78%; max-width:55%; object-fit:contain; filter:drop-shadow(0 0 8px rgba(0,0,0,.7)); }
        .tile .ico { position:absolute; right:10px; bottom:4px; font-size:2.2rem; opacity:.35; }
        .tile.pic { animation:tileIn .55s var(--d,0s) both; background-size:cover; background-position:center; }
        .stg { display:flex; align-items:center; gap:12px; margin:6px 0; font-size:1.2rem; }
        .stg button { background:rgba(0,0,0,.5); border:1px solid #fff; color:#fff; border-radius:8px; padding:2px 12px; cursor:pointer; }
        .roster { color:#8aa; font-size:.8rem; }
        .menu-overlay.lobby { background:rgba(5,5,16,.22); border:3px solid var(--neon-blue); border-radius:18px; box-shadow:0 0 22px rgba(0,242,255,.55), inset 0 0 18px rgba(0,242,255,.25); }
        .tile.start { padding:0; } .tile.start .f1 { position:relative; inset:auto; min-height:230px; justify-content:center; z-index:1; text-shadow:0 1px 4px rgba(0,0,0,.85); }
        .tile.start img.bossimg { opacity:.26; height:88%; max-width:60%; filter:saturate(.7) blur(.4px); -webkit-mask-image:linear-gradient(to left,#000 25%,transparent 100%); mask-image:linear-gradient(to left,#000 25%,transparent 100%); pointer-events:none; }
        .mrow { display:flex; flex-wrap:wrap; gap:4px; align-items:center; margin:3px 0; } .mrow .ml { font-size:.74rem; font-weight:bold; padding:1px 7px; border-radius:6px; text-shadow:none; color:#041; background:#33ff88; } .mrow .ml.no { background:#ff6b6b; color:#200; }
        .mchip { display:inline-flex; align-items:center; gap:3px; background:rgba(0,0,0,.5); border:1px solid #aab; border-radius:999px; padding:1px 7px 1px 3px; font-size:.72rem; line-height:1.2; text-shadow:none; } .mchip.up { border-color:#33ff88; } .mchip.dn { border-color:#ff6b6b; } .mchip.lk { opacity:.55; } .mchip em { font-style:normal; opacity:.85; }
        .tile .mchip img, .mx img.sh { position:static; height:20px; width:20px; max-width:none; object-fit:contain; filter:none; opacity:1; -webkit-mask-image:none; mask-image:none; }
        .mx { width:min(88vw,560px); text-align:left; } .mx h3 { margin:0 0 4px; } .mx small { display:block; color:#9ab; line-height:1.4; }
        .mx-head { display:flex; gap:12px; align-items:center; } .mx-head img { height:96px; max-width:40%; object-fit:contain; filter:drop-shadow(0 0 10px rgba(255,80,120,.6)); }
        .mx-nav { display:flex; align-items:center; justify-content:center; gap:14px; margin:8px 0; } .mx-nav button { background:rgba(0,0,0,.5); border:1px solid #fff; color:#fff; border-radius:8px; padding:2px 12px; cursor:pointer; }
        .mx-chain { display:flex; align-items:center; justify-content:center; gap:8px; margin:8px 0; padding:8px; background:rgba(255,255,255,.05); border-radius:10px; flex-wrap:wrap; } .mx-chain .grp { display:flex; flex-direction:column; align-items:center; gap:3px; font-size:.75rem; } .mx-chain .grp div { display:flex; gap:4px; } .mx-chain img { height:42px; object-fit:contain; } .mx-chain .arr { font-size:1.4rem; color:#ffea00; } .mx-chain .bs img { height:54px; }
        .mx-sec { margin:10px 0 4px; font-weight:bold; padding-left:8px; border-left:4px solid; } .mx-card { display:flex; align-items:center; gap:10px; padding:6px 8px; margin:4px 0; border-radius:10px; background:rgba(255,255,255,.06); border:1px solid #334; } .mx-card.lk { opacity:.6; } .mx img.sh { height:54px; width:54px; flex:none; } .mx-card .tx { flex:1; min-width:0; } .mx-card b i { font-style:normal; font-size:.72rem; padding:1px 6px; border-radius:6px; margin-left:6px; } .mx-card .sm2 { flex:none; padding:3px 9px; border-radius:8px; border:1px solid #fff; background:rgba(0,0,0,.45); color:#fff; cursor:pointer; font-size:.78rem; }
        .tile .stg { margin:4px 0 6px; } .tile .sm2 { margin-top:6px; align-self:flex-start; padding:3px 10px; border-radius:8px; border:1px solid #fff; background:rgba(0,0,0,.45); color:#fff; cursor:pointer; font-family:inherit; font-size:.8rem; }
        @keyframes liveA { 0%,42% { opacity:1; transform:translateY(0); } 50%,92% { opacity:0; transform:translateY(-100%); } 100% { opacity:1; transform:translateY(0); } }
        @keyframes liveB { 0%,42% { opacity:0; transform:translateY(100%); } 50%,92% { opacity:1; transform:translateY(0); } 100% { opacity:0; transform:translateY(100%); } }
        @keyframes tileIn { from { opacity:0; transform:scale(.85) translateY(14px); } to { opacity:1; transform:none; } }
        @keyframes tileShift { 0%,100% { background-position:0% 50%; } 50% { background-position:100% 50%; } }
        @media (max-width:560px) { .tiles { grid-template-columns:repeat(2,1fr); } .tile.w2 { grid-column:span 2; } }
        .splash { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; pointer-events:auto; cursor:pointer; overflow:hidden; z-index:50; background:radial-gradient(ellipse at center,rgba(13,27,61,.32) 0%,rgba(5,5,16,.7) 78%); }
        .sp-title { font-size:clamp(2.6rem,10vw,5rem); letter-spacing:.25em; margin:0; color:#fff; animation:spGlow 3s ease-in-out infinite alternate; }
        @keyframes spGlow { from { text-shadow:0 0 10px var(--neon-blue); } to { text-shadow:0 0 30px var(--neon-blue),0 0 70px var(--neon-purple); } }
        .sp-sub { color:var(--neon-blue); letter-spacing:.6em; margin:6px 0 34px; }
        .sp-hint { color:#8aa; font-size:.85rem; animation:spBlink 1.6s infinite; } @keyframes spBlink { 50% { opacity:.3; } }
        #hud { font-size:clamp(.7rem,3.3vw,1rem); padding:clamp(4px,1.6vw,10px) clamp(6px,3vw,15px); top:max(6px,env(safe-area-inset-top)); left:clamp(4px,2vw,10px); right:clamp(4px,2vw,10px); }
        .hud-item { margin:0 clamp(2px,1vw,5px); }
        .hbtn { font-size:clamp(.62rem,3vw,.9rem); padding:3px clamp(5px,2vw,10px); margin-right:clamp(2px,1vw,6px); }
        #stage-info { top:clamp(42px,12vw,60px); font-size:clamp(.8rem,4vw,1.2rem); }
        #buff-bar { top:clamp(66px,18vw,70px); left:clamp(4px,2vw,12px); gap:clamp(3px,1vw,6px); max-width:62%; }
        .buff { min-width:clamp(62px,19vw,96px); font-size:clamp(.58rem,2.7vw,.75rem); padding:2px 6px 5px; }
        .boss-hp-bar { top:clamp(92px,24vw,96px); }
        .idiom-slots { bottom:max(8px,env(safe-area-inset-bottom)); gap:clamp(3px,1.2vw,10px); }
        .slot { min-width:0; height:clamp(52px,15vw,80px); }
        .slot-title { font-size:min(1.2rem,calc((96vw - (var(--n,6) - 1) * 6px) / var(--n,6) / 4.7)); margin-bottom:2px; gap:1px; }
        .slot-subtitle { font-size:clamp(.5rem,2.4vw,.7rem); line-height:1.15; padding:0 2px; }
        .ready .slot-subtitle { font-size:clamp(.54rem,2.6vw,.8rem); }
        .slot-key { width:clamp(15px,5vw,22px); height:clamp(15px,5vw,22px); line-height:clamp(15px,5vw,22px); font-size:clamp(.58rem,3vw,.85rem); top:-8px; left:-4px; }

<script>
"use strict";
const KAI_FONT = "'DFKai-SB','BiauKai','標楷體','KaiTi','Kaiti TC',serif";

class RetroAudio {
    constructor() { this.ctx = null; this.lastShootTime = 0; }
    init() {
        if(this.ctx) return;
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        this.ctx = new AudioContext();
        this.delayNode = this.ctx.createDelay(); this.delayNode.delayTime.value = 0.45; 
        this.feedbackNode = this.ctx.createGain(); this.feedbackNode.gain.value = 0.35; 
        this.delayNode.connect(this.feedbackNode); this.feedbackNode.connect(this.delayNode);
        this.mainGain = this.ctx.createGain(); this.mainGain.gain.value = 0.8;
        this.delayNode.connect(this.mainGain); this.mainGain.connect(this.ctx.destination);
        // 音樂專用匯流排（與音效分開調音量）
        this.bgmGain = this.ctx.createGain(); this.bgmGain.gain.value = 0.8; this.bgmGain.connect(this.ctx.destination);
        this.bgmDelay = this.ctx.createDelay(); this.bgmDelay.delayTime.value = 0.45; this.bgmFb = this.ctx.createGain(); this.bgmFb.gain.value = 0.35;
        this.bgmDelay.connect(this.bgmFb); this.bgmFb.connect(this.bgmDelay); this.bgmDelay.connect(this.bgmGain);
        this.startSpaceBGM();
    }
    _take() {   // 音效同時發聲數上限（多人闖關命中、爆炸很多時，避免音訊執行緒塞爆造成音樂與音效斷掉）；背景音樂不計入、不受限
        if (this._bgm) return 2;
        if (!this.ctx || this.ctx.state !== 'running') return 0;
        if ((this._live || 0) >= 36) return 0;
        this._live = (this._live || 0) + 1; return 1;
    }
    _done(node, tk) { if (tk === 1) node.onended = () => { this._live = Math.max(0, (this._live || 1) - 1); }; }
    _gate(key, gap) {   // 同一種音效的最短間隔（秒）；太密集就略過
        if (!this.ctx) return false;
        const t = this.ctx.currentTime, g = this._g || (this._g = {});
        if (t - (g[key] || -9) < gap) return false; g[key] = t; return true;
    }
    playTone(freq, type, duration, vol=0.1, useEcho=false) {
        if(!this.ctx) return;
        const tk = this._take(); if (!tk) return;
        const osc = this.ctx.createOscillator(); const gain = this.ctx.createGain();
        osc.type = type; osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
        const dst = this._bgm ? this.bgmGain : this.mainGain, dly = this._bgm ? this.bgmDelay : this.delayNode;
        osc.connect(gain); gain.connect(dst);
        if (useEcho) gain.connect(dly);
        gain.gain.setValueAtTime(0, this.ctx.currentTime);
        gain.gain.linearRampToValueAtTime(vol, this.ctx.currentTime + 0.05);
        gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + duration);
        osc.start(); osc.stop(this.ctx.currentTime + duration); this._done(osc, tk);
    }
    playNoise(duration, vol=0.1) {
        if(!this.ctx) return;
        const tk = this._take(); if (!tk) return;
        if (!this._nb) {   // 雜訊只產生一次、之後共用（以前每次命中都現場填滿一整段亂數，是多人闖關卡頓的主因之一）
            const n = Math.floor(this.ctx.sampleRate * 1.6), b = this.ctx.createBuffer(1, n, this.ctx.sampleRate), d = b.getChannelData(0);
            for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
            this._nb = b;
        }
        const dur = Math.min(duration, 1.5);
        const noise = this.ctx.createBufferSource(); noise.buffer = this._nb;
        const gain = this.ctx.createGain();
        gain.gain.setValueAtTime(vol, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + dur);
        noise.connect(gain); gain.connect(this.mainGain); noise.start(this.ctx.currentTime, Math.random() * 0.05, dur); this._done(noise, tk);
    }
    playShoot(kind = 0) {   // 0 普通 / 1 極速開火 / 2 超級散彈
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        if (now - this.lastShootTime < (kind ? 0.045 : 0.08)) return;
        this.lastShootTime = now;
        const tk = this._take(); if (!tk) return;
        const osc = this.ctx.createOscillator(), gain = this.ctx.createGain();
        osc.type = ['square', 'sawtooth', 'sawtooth'][kind];
        osc.frequency.setValueAtTime([900, 1100, 700][kind], now);
        osc.frequency.exponentialRampToValueAtTime([260, 400, 180][kind], now + 0.12);
        osc.connect(gain); gain.connect(this.mainGain);
        gain.gain.setValueAtTime(0.07, now); gain.gain.exponentialRampToValueAtTime(0.001, now + 0.12);

    sweep(type, f0, f1, dur, vol = 0.1, echo = false, swell = false) {
        if (!this.ctx) return;

        g.gain.setValueAtTime(0.0001, t);

        else { g.gain.linearRampToValueAtTime(vol, t + Math.min(0.05, dur / 4)); g.gain.exponentialRampToValueAtTime(0.0001, t + dur); }
        o.connect(g); g.connect(this.mainGain); if (echo) g.connect(this.delayNode);
        o.start(t); o.stop(t + dur + 0.02); this._done(o, tk);
    }
    playIdiomCast() {   // 3 秒蓄力：音高與音量逐漸上升
        this.sweep('sawtooth', 120, 900, 2.9, 0.07, true, true);

    }
    playIdiomFire(effect) {   // 依成語效果發出不同音效

            case 'INVINCIBLE': seq([523, 659, 784, 1047, 1319], 'sine', 70, 0.35, 0.09, true); break;

            case 'SPREAD_FIRE': this.playNoise(0.25, 0.2); seq([900, 700, 560, 420], 'square', 60, 0.1, 0.07); break;
            case 'HEAL': seq([659, 880, 1319], 'sine', 110, 0.5, 0.1, true); break;
            case 'SHIELD': seq([392, 523, 659, 784], 'triangle', 80, 0.4, 0.1, true); this.sweep('sine', 200, 600, 0.5, 0.1, true); break;
            case 'PIERCE': this.sweep('sawtooth', 300, 1500, 0.25, 0.12, true); this.playNoise(0.1, 0.1); break;
            case 'MISSILE': seq([500, 700, 900, 1200], 'triangle', 60, 0.15, 0.08); break;
            case 'ALLY': seq([392, 523, 659, 784, 1047], 'square', 70, 0.2, 0.07, true); break;

            case 'SLOW_TIME': this.sweep('sine', 900, 120, 1.1, 0.15, true); this.sweep('triangle', 450, 60, 1.1, 0.1, true); break;
        }
    }
    playEnemyShoot() { this.playTone(600, 'triangle', 0.1, 0.02); }
    playHit() { if (this._gate('hit', 0.05)) this.playNoise(0.1, 0.05); }
    playExplosion() { if (this._gate('boom', 0.09)) this.playNoise(0.5, 0.3); }
    playCollect() { if (!this._gate('col', 0.05)) return; this.playTone(800, 'sine', 0.1, 0.05); setTimeout(()=>this.playTone(1200, 'sine', 0.1, 0.05, true), 50); }
    playReady() { this.playTone(400, 'square', 0.1, 0.05); setTimeout(()=>this.playTone(600, 'square', 0.1, 0.05), 100); setTimeout(()=>this.playTone(800, 'square', 0.3, 0.08, true), 200); }
    playUpgradeOk() { [523, 659, 784, 1047, 1319].forEach((f, i) => setTimeout(() => this.playTone(f, 'triangle', 0.35, 0.09, true), i * 70)); this.sweep('sine', 400, 1600, 0.4, 0.05, true); }   // 戰機升級成功：上行琶音
    playBuy() { this.playTone(1320, 'square', 0.07, 0.06); setTimeout(() => this.playTone(1760, 'square', 0.16, 0.07, true), 70); this.playNoise(0.05, 0.03); }   // 購買物資：叮噹銅板聲
    playFeatureUp() { this.sweep('sawtooth', 200, 900, 0.3, 0.08, true); setTimeout(() => { this.playTone(880, 'sine', 0.2, 0.08, true); this.playTone(1108, 'sine', 0.3, 0.07, true); }, 220); }   // 升級功能：能量充填
    playPlayerHit() { if (!this._gate('ph', 0.12)) return; this.playNoise(0.28, 0.32); this.sweep('sawtooth', 220, 45, 0.3, 0.2); this.playTone(90, 'square', 0.2, 0.12); }   // 戰機被擊中：低沉爆裂
    playType() { if (!this.ctx) return; const f = 1500 + Math.random() * 500; this.playTone(f, 'square', 0.035, 0.025); this.playNoise(0.015, 0.02); }   // 打字：喀噠
    playSnipe() { this.sweep('sawtooth', 2400, 300, 0.25, 0.14, true); this.playNoise(0.12, 0.12); }
    playUse() { this.playTone(150, 'sawtooth', 0.6, 0.15, true); }
    playTransition() { this.playTone(300, 'sine', 1.5, 0.05, true); this.playTone(600, 'sine', 1.5, 0.03, true); }
    
    stopSpaceBGM() { if (this.bgmInterval) { clearInterval(this.bgmInterval); this.bgmInterval = null; } }
    startSpaceBGM() {
        if(this.bgmInterval) return;
        const chords = [[164.81, 196.00, 246.94, 293.66], [130.81, 164.81, 196.00, 246.94], [220.00, 261.63, 329.63, 392.00], [246.94, 293.66, 369.99, 440.00]];
        let step = 0; let chordIdx = 0;
        this.bgmInterval = setInterval(() => {
            if(!this.ctx || this.ctx.state !== 'running') return;
            this._bgm = true;
            if (step % 16 === 0) { chordIdx = Math.floor(step / 16) % chords.length; this.playTone(chords[chordIdx][0] / 2, 'triangle', 2.0, 0.12, true); }

            this.playTone(finalNote, 'sine', 0.25, 0.04, true);
            step++; this._bgm = false;
        }, 150);
    }

// 造句中「用到該成語」的部分顯示粗體（找不到完整成語時，退而找最長的連續片段）
const _escH = x => String(x == null ? '' : x).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const idiomRange = (text, word) => {
    text = String(text || ''); word = String(word || ''); if (!word) return null;
    const hit = p => { const k = text.indexOf(p); return k < 0 ? null : [[...text.slice(0, k)].length, [...text.slice(0, k)].length + [...p].length]; };
    let r = hit(word); if (r) return r;
    const w = [...word];
    for (let len = w.length - 1; len >= 2; len--) for (let st = 0; st + len <= w.length; st++) { r = hit(w.slice(st, st + len).join('')); if (r) return r; }
    return null;
};
const boldSlice = (chars, n, rng) => {   // 取前 n 個字，成語範圍內的字用粗體
    if (!rng) return _escH(chars.slice(0, n).join(''));
    const a = chars.slice(0, Math.min(n, rng[0])).join(''), b = chars.slice(rng[0], Math.min(n, rng[1])).join(''), c = chars.slice(rng[1], n).join('');
    return _escH(a) + (b ? '<strong class="idm-b">' + _escH(b) + '</strong>' : '') + _escH(c);
};
const boldIdiom = (text, word) => { const ch = [...String(text || '')]; return boldSlice(ch, ch.length, idiomRange(text, word)); };

class Vec2 { constructor(x, y) { this.x = x; this.y = y; } }

class ObjectPool {
    constructor(createFn, size = 150) {
        this.pool = []; this.createFn = createFn; this._h = 0;
        for (let i = 0; i < size; i++) this.pool.push(createFn());
    }
    get() {
        const pl = this.pool, n = pl.length; let obj = null;
        for (let k = 0; k < n; k++) { const i = (this._h + k) % n; if (!pl[i].active) { obj = pl[i]; this._h = i + 1; break; } }   // 從上次取用的位置往後找：子彈很多時不會每發都從頭掃描
        if (!obj) { obj = this.createFn(); pl.push(obj); }
        obj.active = true; obj.homing = false; obj.target = null; obj.pierce = false; obj.pk = false; obj.hits = 0; obj.big = false; obj.len = 0; obj.fromBoss = false; obj.dud = false; return obj;
    }
}

class Entity {
    constructor() { this.pos = new Vec2(0, 0); this.vel = new Vec2(0, 0); this.radius = 10; this.active = false; this.color = "#fff"; }
    update(dt) { this.pos.x += this.vel.x * dt; this.pos.y += this.vel.y * dt; }
    draw(ctx) {
        ctx.save(); ctx.shadowBlur = 10; ctx.shadowColor = this.color; ctx.fillStyle = this.color;
        ctx.beginPath(); ctx.arc(this.pos.x, this.pos.y, this.radius, 0, Math.PI * 2); ctx.fill(); ctx.restore();
    }
}

const BULLET_SPR = new Map(); let bulletSprSc = 0;
function bulletSprite(color, r) {   // 同顏色、同大小的子彈共用一張預先畫好的貼圖（光暈＋核心），畫面上子彈再多也只是 drawImage
    if (!(r > 0)) return null;
    const sc = Math.min(3, Math.max(1, Math.round((WORLD.dpr || 1) * (WORLD.s || 1) * 4) / 4));
    if (sc !== bulletSprSc) { BULLET_SPR.clear(); bulletSprSc = sc; }
    const rq = Math.max(0.5, Math.round(r * 2) / 2), key = color + '|' + rq;
    let e = BULLET_SPR.get(key); if (e) return e;
    if (BULLET_SPR.size > 240) BULLET_SPR.clear();
    const h = Math.ceil(rq * 1.45 + 4), c = document.createElement('canvas'); c.width = c.height = Math.ceil(h * 2 * sc);
    const x = c.getContext('2d'); if (!x) return null; x.scale(sc, sc);
    const g = x.createRadialGradient(h, h, rq * 0.6, h, h, rq * 1.45); g.addColorStop(0, 'rgba(255,255,255,0.55)'); g.addColorStop(0.5, 'rgba(255,255,255,0.18)'); g.addColorStop(1, 'rgba(255,255,255,0)');
    x.fillStyle = g; x.beginPath(); x.arc(h, h, rq * 1.45, 0, Math.PI * 2); x.fill();
    x.shadowBlur = 3; x.shadowColor = color; x.fillStyle = color; x.beginPath(); x.arc(h, h, rq, 0, Math.PI * 2); x.fill();
    x.shadowBlur = 0; x.fillStyle = 'rgba(255,255,255,0.75)'; x.beginPath(); x.arc(h, h, rq * 0.38, 0, Math.PI * 2); x.fill();
    e = { c, h }; BULLET_SPR.set(key, e); return e;
}
class Bullet extends Entity {
    constructor() { super(); this.isPlayer = false; this.damage = 1; this.sid = null; this.hits = 0; }
    draw(ctx) { if (this.dud) { ctx.globalAlpha = 0.28; this._draw(ctx); ctx.globalAlpha = 1; } else this._draw(ctx); }   // 通關後失效的敵彈：半透明、不再傷人
    _draw(ctx) {   // 外圈白色虛化光暈（任何背景都看得見）＋ 彩色核心
        const x = this.pos.x, y = this.pos.y, r = this.radius;
        if (this.len > 0) {   // 連射號射速突破：子彈變長（光束狀），尾巴在飛行方向的反側
            const bim = bulletImg(this.color, 'beam');
            if (bim) {   // 讀圖：圖片頭朝上，轉到飛行方向，高度＝彈長（頭尾各留一點光暈）
                const w = r * BULLET_IMG_SCALE;
                ctx.save(); ctx.translate(x, y); ctx.rotate(Math.atan2(this.vel.y, this.vel.x) + Math.PI / 2); ctx.globalCompositeOperation = BULLET_IMG_BLEND;
                ctx.drawImage(bim[0], bim[1], bim[2], bim[3], bim[4], -w / 2, -r * 1.4, w, this.len + r * 2.4); ctx.restore(); return;
            }
            const m = Math.hypot(this.vel.x, this.vel.y) || 1, tx = x - this.vel.x / m * this.len, ty = y - this.vel.y / m * this.len, line = (w, c, sb) => { ctx.lineWidth = w; ctx.strokeStyle = c; ctx.shadowBlur = sb; ctx.shadowColor = this.color; ctx.beginPath(); ctx.moveTo(tx, ty); ctx.lineTo(x, y); ctx.stroke(); };
            ctx.save(); ctx.lineCap = 'round'; line(r * 2.9, 'rgba(255,255,255,0.3)', 0); line(r * 2, this.color, 3); line(r * 0.76, 'rgba(255,255,255,0.8)', 0); ctx.restore(); return;
        }
        const oim = bulletImg(this.color, 'orb');
        if (oim) {
            const w = r * BULLET_IMG_SCALE; ctx.globalCompositeOperation = BULLET_IMG_BLEND;
            if (oim[5] && (this.vel.x || this.vel.y)) { ctx.save(); ctx.translate(x, y); ctx.rotate(Math.atan2(this.vel.y, this.vel.x)); ctx.drawImage(oim[0], oim[1], oim[2], oim[3], oim[4], -w / 2, -w / 2, w, w); ctx.restore(); }
            else ctx.drawImage(oim[0], oim[1], oim[2], oim[3], oim[4], x - w / 2, y - w / 2, w, w);
            ctx.globalCompositeOperation = 'source-over'; return;
        }   // 讀圖：不再即時產生貼圖
        const sp = bulletSprite(this.color, r); if (sp) { ctx.drawImage(sp.c, x - sp.h, y - sp.h, sp.h * 2, sp.h * 2); return; }
        ctx.save();
        const g = ctx.createRadialGradient(x, y, r * 0.6, x, y, r * 1.45); g.addColorStop(0, 'rgba(255,255,255,0.55)'); g.addColorStop(0.5, 'rgba(255,255,255,0.18)'); g.addColorStop(1, 'rgba(255,255,255,0)');
        ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r * 1.45, 0, Math.PI * 2); ctx.fill();
        ctx.shadowBlur = 3; ctx.shadowColor = this.color; ctx.fillStyle = this.color; ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
        ctx.shadowBlur = 0; ctx.fillStyle = 'rgba(255,255,255,0.75)'; ctx.beginPath(); ctx.arc(x, y, r * 0.38, 0, Math.PI * 2); ctx.fill();
        ctx.restore();
    }
}

class FloatingText {
    constructor() { this.active = false; this.pos = new Vec2(0,0); this.text = ""; this.life = 0; this.color = "#fff"; }
    update(dt) { this.pos.y -= 50 * dt; this.life -= dt; if(this.life <= 0) this.active = false; }
    draw(ctx) {
        ctx.save(); ctx.globalAlpha = Math.max(0, this.life); ctx.fillStyle = this.color;
        ctx.font = "bold 16px "+KAI_FONT; ctx.fillText(this.text, this.pos.x, this.pos.y); ctx.restore();

}

// Boss 程式碼保持一致
class Boss extends Entity {
    constructor(stage) {
        super();
        this.stage = stage;
        this.maxHp = stage === 9 ? 5000 : 150 + (stage - 1) * 350;
        this.hp = this.maxHp;
        this.radius = 45;
        this.color = stage === 9 ? "#ff00ff" : "#ff3333";
        this.pos = new Vec2(WORLD.w / 2, -100);
        this.targetY = 120;
        this.shootTimer = 0;
        this.meteorTimer = 0;
        this.pattern = stage % 4;
        this.angle = 0;
        this.dmReward = stage * 100; this.cfg = BOSS_CFG[stage] || BOSS_CFG[1]; this.volley = 0;
        const hasImg = !!(IMG['boss_' + stage] || IMG.boss);
        this.size = hasImg ? Math.min(260, WORLD.w * 0.55) : 110;
        if (hasImg) { this.radius = this.size * 0.28; this.targetY = this.size * 0.5 + 30; }
        this.type = BOSS_TYPES[stage] || 'TANK';
        const M = bossMods(stage, this.type);   // 依關卡縮放：[血量倍率, 子彈傷害倍率, 射擊間隔倍率]
        this.maxHp = Math.round(this.maxHp * M.hp); this.hp = this.maxHp; this.dmgMul = M.dmg; this.rateMul = M.rate;
    }

    move(dt, W, pp) {   // 「目標點 + 指數平滑」：不瞬移、不抖動，並限制最高速度
        if (this.noMove) { this.pos.x = W / 2; this.pos.y += (this.targetY - this.pos.y) * Math.min(1, dt * 3); return; }   // 巨艦：只會從上方降到定位，之後不動
        this.tm = (this.tm || 0) + dt * 1000;
        const t = this.tm, m = this.cfg.mv, cx = W / 2, margin = this.size * 0.35;
        let tx = cx, ty = this.targetY, k = 3;
        if (m === 'sweep') tx = cx + Math.sin(t / 1800) * W / 3;
        else if (m === 'hover') { tx = cx + Math.sin(t / 2600) * W / 7; ty += Math.sin(t / 950) * 25; }
        else if (m === 'orbit') { tx = cx + Math.cos(t / 1500) * W / 3; ty += 40 + Math.sin(t / 1500) * 55; }
        else if (m === 'chase') { tx = pp.x; k = 1.6; }
        else if (m === 'zigzag') { const ph = (t / 1500) % 2; tx = margin + (ph < 1 ? ph : 2 - ph) * (W - margin * 2); k = 4; }
        else if (m === 'dash') { this.dashT = (this.dashT || 0) - dt; if (this.dashT <= 0) { this.dashX = margin + Math.random() * (W - margin * 2); this.dashT = 2.4; } tx = this.dashX; k = 4; }
        tx = Math.max(margin, Math.min(W - margin, tx));
        // 期望速度 = 與目標的距離 × 增益；速度只能以固定加速度改變（起步與煞車都是漸進的）
        const vmax = 650, acc = 1500 * dt, cl = (v, m) => Math.max(-m, Math.min(m, v));
        this.vx = (this.vx || 0); this.vy = (this.vy || 0);
        this.vx += cl(cl((tx - this.pos.x) * k, vmax) - this.vx, acc);
        this.vy += cl(cl((ty - this.pos.y) * k, vmax) - this.vy, acc);
        this.pos.x += this.vx * dt; this.pos.y += this.vy * dt;
    }

    update(dt, playerPos, spawnBullet, spawnMeteor) {
        this.move(dt, WORLD.w, playerPos);

        this.shootTimer += dt;
        const fireRate = this.cfg.r * this.rateMul * (this.stage === 9 && this.hp < this.maxHp / 2 ? 0.7 : 1);
        if (this.shootTimer > fireRate) { this.shoot(spawnBullet, playerPos); this.shootTimer = 0; }

        this.meteorTimer += dt;
        if (this.meteorTimer > 4.0) { spawnMeteor(this.pos.x, this.pos.y); this.meteorTimer = 0; }
    }

    shoot(spawnBullet, pp) {
        this.angle += 0.15;
        const sp = 90 + this.stage * 18, sh = this.cfg.sh, pat = sh[this.volley++ % sh.length];
        const toP = Math.atan2(pp.y - this.pos.y, pp.x - this.pos.x), fa = this.faceA || 0, D = Math.PI / 2 + fa;   // fa：多人闖關「四機同體」的分身朝向（上 0、下 π、左 −π/2、右 π/2）

    demoExtra(d, dt) {
        const W = WORLD.w, H = WORLD.h, rnd = Math.random;
        const part = (x, y, c, n, sp, life) => { for (let k = 0; k < n; k++) { const a = rnd() * 6.283, v = 30 + rnd() * sp; d.parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: life * (0.5 + rnd()), c }); } };
        const kill = e => { const i = d.enemies.indexOf(e); if (i < 0) return; d.enemies.splice(i, 1); part(e.pos.x, e.pos.y, e.color || '#ff9a3c', 14, 220, 0.55); };
        if (!d.idiom) { d.idiom = CONFIG.IDIOMS[Math.floor(rnd() * CONFIG.IDIOMS.length)]; d.got = [...d.idiom.word].slice(0, 2); }

        }
        for (let i = d.blocks.length - 1; i >= 0; i--) {

            for (let j = d.bullets.length - 1; j >= 0; j--) { const b = d.bullets[j]; if (b.foe) continue; if (Math.abs(b.x - m.x) < m.r && Math.abs(b.y - m.y) < m.r) { d.bullets.splice(j, 1); m.hp -= 1; part(b.x, b.y, '#7ad7ff', 3, 120, 0.25); if (m.hp <= 0) break; } }
            if (m.hp <= 0) { d.chars.push({ x: m.x, y: m.y, ch: m.ch, vy: 70 }); part(m.x, m.y, '#00f2ff', 14, 200, 0.5); d.blocks.splice(i, 1); }
        }

        for (let i = d.chars.length - 1; i >= 0; i--) {

                }

        // 戰機優先去撿字，其次打方塊，否則打敵機（原邏輯）
        let tgt = null, td = 1e9;
        d.chars.forEach(c => { const v = Math.abs(c.x - d.pp.x) + Math.max(0, d.pp.y - c.y) * 0.05; if (v < td) { td = v; tgt = c; } });
        if (!tgt) d.blocks.forEach(m => { if (m.y > 10 && m.y < d.pp.y - 50 && (!tgt || m.y > tgt.y)) tgt = m; });
        d.want = tgt ? tgt.x : null;
        // 招式效果
        d.fx.forEach(f => { f.t += dt; }); d.fx = d.fx.filter(f => f.t < f.life);
        if (d.fx.some(f => f.type === 'LASER_BEAM')) d.enemies.slice().forEach(e => { if (e.pos.y < d.pp.y && Math.abs(e.pos.x - d.pp.x) < e.radius + 22) { e.hp -= 40 * dt; if (e.hp <= 0) kill(e); } });
        if (d.fx.some(f => f.type === 'HEAL') && rnd() < 0.6) d.parts.push({ x: d.pp.x + (rnd() - 0.5) * 70, y: d.pp.y + 20, vx: 0, vy: -90, life: 0.7, c: '#6bff9a' });
        if (d.pierceT > 0) { d.pierceT -= dt; d.bullets.forEach(b => { if (!b.foe && !b.big) { b.big = true; b.c = '#ffb347'; } }); }
        if (d.missileT > 0) { d.missileT -= dt; d.msT -= dt; if (d.msT <= 0) { d.msT = 0.22; d.bullets.push({ x: d.pp.x + (rnd() < 0.5 ? -14 : 14), y: d.pp.y - 20, vx: (rnd() - 0.5) * 260, vy: -520, c: '#ff6b6b', foe: false, home: true, big: true }); } }
        d.bullets.forEach(b => { if (!b.home) return; let t = null, bd = 1e9; d.enemies.forEach(e => { const dd = Math.hypot(e.pos.x - b.x, e.pos.y - b.y); if (dd < bd) { bd = dd; t = e; } }); if (t) { let a = Math.atan2(b.vy, b.vx), da = Math.atan2(t.pos.y - b.y, t.pos.x - b.x) - a; da = Math.atan2(Math.sin(da), Math.cos(da)); a += da * Math.min(1, 7 * dt); b.vx = Math.cos(a) * 640; b.vy = Math.sin(a) * 640; } });
        // 友軍：從下方進場、射擊、再從下方退場
        d.allies.forEach(a => {

            const ty = d.pp.y + 34, tx = Math.max(24, Math.min(W - 24, d.pp.x + a.off));

            a.x += (tx - a.x) * Math.min(1, 5 * dt); a.y += (ty - a.y) * Math.min(1, 5 * dt);
            a.cd -= dt; if (a.cd <= 0) { a.cd = 0.2; d.bullets.push({ x: a.x, y: a.y - 22, vx: 0, vy: -800, c: a.S.c, foe: false }); }
        });
        d.allies = d.allies.filter(a => !(a.leaving && a.y > H + 90));
        if (d.banner) { d.banner.t += dt; if (d.banner.t > 1.8) d.banner = null; }
    }

    // ===== 初始畫面的自動演示（隨機關卡、戰機、敵機，暗化處理）=====
    startDemo() {
        const stage = 1 + Math.floor(Math.random() * 9); loadBg(stage);
        return (this.demo = { t: 0, stage, enemies: [], bullets: [], parts: [], spawnT: 0.3, shootT: 0, switchT: 0, ship: SHIPS[Math.floor(Math.random() * SHIPS.length)],
            pp: new Vec2(WORLD.w / 2, WORLD.h * 0.78), boss: null, bossT: 9 + Math.random() * 6, fade: 0, blocks: [], chars: [], fx: [], allies: [], slowT: 0, pierceT: 0, missileT: 0, msT: 0, blockT: 0.6, idiom: null, got: [], want: null, banner: null });
    }
    updateDemo(dt) {
        const d = this.demo || this.startDemo(), W = WORLD.w, H = WORLD.h; d.t += dt; this.bgClock += dt;
        d.switchT += dt; if (d.slowT > 0) { d.slowT -= dt; dt *= 0.45; }
        if (d.switchT > 16) { d.switchT = 0; d.stage = 1 + Math.floor(Math.random() * 9); loadBg(d.stage); d.enemies = []; d.boss = null; d.bossT = 8 + Math.random() * 8; d.ship = SHIPS[Math.floor(Math.random() * SHIPS.length)]; d.fade = 1; }
        d.fade = Math.max(0, d.fade - dt * 1.2);
        // 借用真正的敵機邏輯來產生與移動敵機
        const keep = { en: this.enemies, pp: this.player.pos, st: this.currentStage, sub: this.currentSub };
        this.enemies = d.enemies; this.player.pos = d.pp; this.currentStage = d.stage; this.currentSub = 2;
        d.spawnT -= dt; if (d.spawnT <= 0 && d.enemies.length < 10) { this.spawnEnemy(); d.spawnT = 1.0 + Math.random() * 0.9; d.enemies.forEach(e => { if (e.life === undefined) { e.life = 9 + Math.random() * 6; e.age = 0; } }); }
        for (let i = d.enemies.length - 1; i >= 0; i--) {
            const e = d.enemies[i]; e.age += dt;
            if (e.age > e.life && !e.fleeing) { e.fleeing = true; e.mv = 'dive'; e.vel = new Vec2(0, -240); }

            if (e.type !== 'DART' && !e.fleeing && e.pos.y > 20 && e.pos.y < H * 0.6) {
                e.shootTimer += dt; if (e.shootTimer > e.shootInterval * 1.4) { e.shootTimer = 0; const a = Math.atan2(d.pp.y - e.pos.y, d.pp.x - e.pos.x); d.bullets.push({ x: e.pos.x, y: e.pos.y, vx: Math.cos(a) * 170, vy: Math.sin(a) * 170, c: e.color, foe: true }); }
            }

        if (d.boss) { d.boss.life -= dt; d.boss.move(dt, W, d.pp); if (d.boss.life <= 0) { d.boss.cfg = { mv: 'sweep' }; d.boss.targetY = -260; if (d.boss.pos.y < -200) d.boss = null; } }

        const tx = d.want != null ? d.want : near ? near.pos.x : W / 2 + Math.sin(d.t * 0.8) * W * 0.28;

        d.shootT -= dt; if (d.shootT <= 0) { d.shootT = 0.16; [-10, 10].forEach(o => d.bullets.push({ x: d.pp.x + o, y: d.pp.y - 24, vx: o * 1.2, vy: -820, c: d.ship.c, foe: false })); }
        for (let i = d.bullets.length - 1; i >= 0; i--) {

                    if (hit.hp <= 0) { d.enemies.splice(d.enemies.indexOf(hit), 1); for (let k = 0; k < 16; k++) { const a = Math.random() * 6.28, v = 60 + Math.random() * 200; d.parts.push({ x: hit.pos.x, y: hit.pos.y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: 0.6, c: ['#ffea00', '#ff8800', '#ff3366', '#fff'][k % 4] }); } } }

    dmgEnt(e, n, pf, hit, src, shockCrit) {   // shockCrit：烈焰號震波已擲出的爆擊倍率（只用來顯示爆擊數字；傷害已在呼叫端乘過）

    upgrade(id, k) {
        const S = this.ship(id), L = this.fleet[id], cost = upgradeCost(L[k]);
        if (L.own && L[k] >= S.cap[k]) {   // 已達上限：改用銀河幣「突破」（每項最多 +3 級）
            const X = (L.x = L.x || {}), n = X[k] || 0, c = xCost(n); if (n >= XMAX || this.galaxy < c) return;
            this.galaxy -= c; X[k] = n + 1; this.applyUpgrades(); sfx.playUpgradeOk(); this.save(); this.keepScroll(() => this.renderHangar());
            this.upToast(`${S.name}「${STAT_KEYS.find(x => x[0] === k)[1]}」突破成功！${S.cap[k]}+${X[k]}/${S.cap[k]}`); return;
        }
        if (!L.own || L[k] >= S.cap[k] || this.darkMatter < cost) return;
        this.darkMatter -= cost; L[k]++; this.applyUpgrades(); sfx.playUpgradeOk(); this.save(); this.keepScroll(() => this.renderHangar());
        this.upToast(`${S.name}「${STAT_KEYS.find(x => x[0] === k)[1]}」升級成功！Lv.${L[k]}`);
    }

    mxChip(x) {   // 一個機種小標籤（圖＋名＋倍率）；★＝出戰中，半透明＝尚未擁有
        const { S, v } = x, own = this.fleet[S.id] && this.fleet[S.id].own;
        return `<span class="mchip ${v > 1 ? 'up' : v < 1 ? 'dn' : ''} ${own ? '' : 'lk'}" title="${S.name}｜${own ? '已擁有' : '尚未擁有'}"><img src="${shipPic(S.id)}" onerror="this.style.display='none'">${S.id === this.shipId ? '★' : ''}${S.name}<em>×${+v.toFixed(2)}</em></span>`;
    }
    mxBrief(st) {   // 大廳「開始出擊」磚：全部機種分成「推薦」與「不推薦」兩份名單
        const L = matchupList(st), good = L.filter(x => x.v > 1), bad = L.filter(x => x.v < 1);
        if (!good.length && !bad.length) return `<small>本關沒有屬性相剋（所有機種 ×1）</small><button class="sm2" onclick="event.stopPropagation();game.showMatchup(${st})">更多：查看本關屬性 ▸</button>`;
        return `<div class="mrow"><span class="ml">推薦</span>${good.length ? good.map(x => this.mxChip(x)).join('') : '<small>無</small>'}</div>
            <div class="mrow"><span class="ml no">不推薦</span>${bad.length ? bad.map(x => this.mxChip(x)).join('') : '<small>無</small>'}</div>
            <button class="sm2" onclick="event.stopPropagation();game.showMatchup(${st})">更多：查看本關屬性相剋 ▸</button>`;
    }
    mxStage(d) { const n = Math.max(1, Math.min(this.bestStage, this.startStage + d)); if (n === this.startStage) return; this.startStage = n; this.renderLobby(); this.showMatchup(n); }
    mxEquip(id) { this.equip(id); this.showMatchup(this.startStage); }
    showMatchup(st) {   // 彈窗：本關 Boss 的屬性、相剋鏈與全部機種的剋制狀態（圖文）
        st = Math.max(1, Math.min(this.bestStage, st || this.startStage)); const bt = BOSS_TYPES[st], inf = BOSS_INFO[bt], L = matchupList(st), fin = bt === 'FINAL';
        const up = L.filter(x => x.v > 1), eq = L.filter(x => x.v === 1), dn = L.filter(x => x.v < 1);
        const imgs = a => a.map(x => `<img src="${shipPic(x.S.id)}" title="${x.S.name}" onerror="this.style.display='none'">`).join('') || '—';
        const names = a => a.map(x => x.S.name).join('、') || '—';
        const chain = fin ? '' : `<div class="mx-chain"><div class="grp"><div>${imgs(up)}</div><span style="color:#33ff88">剋制它</span><span>${names(up)}</span></div><span class="arr">➜</span>
            <div class="grp bs"><div><img src="assets/boss_${st}.png" onerror="this.style.display='none'"></div><b>${inf.name}</b></div><span class="arr">➜</span>
            <div class="grp"><div>${imgs(dn)}</div><span style="color:#ff6b6b">被它剋</span><span>${names(dn)}</span></div></div>`;
        const card = (x, col, tag) => { const S = x.S, own = this.fleet[S.id].own;
            return `<div class="mx-card ${own ? '' : 'lk'}"><img class="sh" src="${shipPic(S.id)}" onerror="this.style.visibility='hidden'"><div class="tx"><b style="color:${S.c}">${S.name}<i style="background:${col};color:#111">${tag} ×${+x.v.toFixed(2)}</i></b><small>${S.role}｜${S.id === this.shipId ? '出戰中' : own ? '已擁有' : '尚未擁有'}</small><small>${SHIP_WHY[S.id] || ''}</small></div>${own && S.id !== this.shipId ? `<button class="sm2" onclick="game.mxEquip('${S.id}')">出戰</button>` : ''}</div>`; };
        const sec = (title, col, a, tag) => a.length ? `<div class="mx-sec" style="border-color:${col};color:${col}">${title}（${a.length}）</div>${a.map(x => card(x, col, tag)).join('')}` : '';
        this.dialog(`<div class="mx"><div class="mx-head"><img src="assets/boss_${st}.png" onerror="this.style.display='none'"><div><h3 style="color:var(--neon-gold)">第 ${st} 關・${bossLabel(st)}</h3><small>屬性：<b style="color:#fff">${inf.name}</b>　${inf.desc}</small><small style="color:#ffea00">建議：${inf.tip}</small></div></div>
            <div class="mx-nav"><button onclick="game.mxStage(-1)">◀</button><b>第 ${st} 關</b><button onclick="game.mxStage(1)">▶</button></div>${chain}
            ${fin ? sec('全部機種（本關無相剋）', '#aab', eq, '普通') : sec('推薦・剋制本關 Boss', '#33ff88', up, '剋制') + sec('可用・無特殊關係', '#aab', eq, '普通') + sec('不推薦・被本關 Boss 剋制', '#ff6b6b', dn, '被剋')}
            <div style="text-align:center"><button class="btn btn-start" onclick="game.closeDlg()">關閉 [Esc]</button></div></div>`);
    }

    renderLobby() {
        const S = this.ship(), st = this.statsOf(S.id), rec = this.recommend(this.startStage), ok = rec.ship.id === S.id;
        const img = S.id === 'star' ? 'assets/player.png' : `assets/ship_${S.id}.png`;
        const im = src => `<img src="${src}" onerror="this.style.display='none'">`;
        this.uiLayer.innerHTML = `
            <div class="menu-overlay lobby" style="width:min(96vw,800px);max-width:none;">
                <h1 class="lob-title">成語戰機</h1>
                <div class="dmline">暗物質 <b>${this.darkMatter}</b> DM</div>
                <div class="tiles">
                    <div class="tile w2 h2 start" style="--a:#0aa5ff;--b:#7b2ff7" onclick="game.startNewGame()">
                        <img class="bossimg" src="assets/boss_${this.startStage}.png" onerror="this.style.display='none'">
                        <div class="f1"><h4>開始出擊 [Enter]</h4>
                            <div class="stg"><button onclick="event.stopPropagation();game.changeStart(-1)">◀</button><b>第 ${this.startStage} 關</b><button onclick="event.stopPropagation();game.changeStart(1)">▶</button></div>
                            <small>Boss：${bossLabel(this.startStage)}</small><small>${S.name}：${ok ? '很適合本關 Boss' : '建議改用 ' + rec.ship.name}｜對本關傷害 ×${+typeMul(S.id, BOSS_TYPES[this.startStage]).toFixed(2)}</small>
                            ${ok ? '' : `<button class="sm2" onclick="event.stopPropagation();game.equip('${rec.ship.id}')">換成 ${rec.ship.name} [R]</button>`}
                            ${this.mxBrief(this.startStage)}
                            <small style="opacity:.7">←／→ 切換關卡（最高解鎖第 ${this.bestStage} 關）</small></div>
                    </div>
                    <div class="tile w2" style="--a:#b026ff;--b:#ff3366" onclick="game.openHangar()">
                        ${im(img)}
                        <div class="f1"><h4>戰機管理 [H]</h4><small>${S.name}｜${S.role}</small><small>傷害 ${Math.round(st.dmg * SHOW)}　${S.pat === 'snipe' ? '鎖定 ' + this.snipeNeedOf(S.id).toFixed(1) + ' 秒' : '射速 ' + (1000 / st.iv).toFixed(1) + '/秒'}</small><small>血量 ${Math.round(st.hp * SHOW)}　移速 ${Math.round(st.spd)}</small><small>穿甲 ${st.pen}　爆擊 ${Math.round(st.crit * 100)}%</small></div>
                    </div>
                    <div class="tile" style="--a:#ffcc00;--b:#ff7a00" onclick="game.setState('SHOP')"><h4>軍械商店</h4><small>[S]</small><small>持有 ${this.darkMatter} DM</small><span class="ico">⚒</span></div>
                    <div class="tile" style="--a:#2b3a67;--b:#4b5b8f" onclick="game.openSettings()"><h4>設定</h4><small>[O]</small><small>音量・離線・關於</small><span class="ico">⚙</span></div>
                </div>
            </div>`;
    }

    renderHangar() {
        const KS = STAT_KEYS;
        const cards = SHIPS.map((S, i) => {
            const F = this.fleet[S.id], st = this.statsOf(S.id), own = F.own;
            const val = { dmg: Math.round(st.dmg * SHOW), rate: (1000 / st.iv).toFixed(1) + '/秒' + (st.len ? '・彈長+' + st.len : ''), hp: Math.round(st.hp * SHOW), spd: Math.round(st.spd), pen: st.pen, crit: Math.round(st.crit * 100) + '%', cov: covLabel(S, this.lvOf(S.id, 'cov')) };
            const rows = KS.map(([k, n], j) => {
                const lv = F[k], max = S.cap[k], cost = upgradeCost(lv), full = lv >= max, x = this.xOf(S.id, k), xmax = x >= XMAX, xc = xCost(x);
                const lab = x > 0 ? `${max}+${x}/${max}` : `${lv}/${max}`;   // 目前等級／等級上限；突破後為「上限＋突破級數／上限」
                const btn = !full ? `<button ${this.darkMatter < cost ? 'disabled' : ''} onclick="event.stopPropagation();game.upgrade('${S.id}','${k}')">${cost}</button>`
                    : xmax ? `<button disabled style="color:#ffd700">MAX+${XMAX}</button>`
                    : `<button ${this.galaxy < xc ? 'disabled' : ''} style="color:#ffd700;border-color:#ffd700" title="用銀河幣突破等級上限（${x + 1}/${XMAX}）" onclick="event.stopPropagation();game.upgrade('${S.id}','${k}')">突破 ${xc}</button>`;
                return `<div class="st"><span>${n}</span><div class="bar" style="background:linear-gradient(90deg,#2a2f4a ${max / 16 * 100}%,#0b0b14 0);"><i style="width:${lv / 16 * 100}%;${x ? 'background:#ffd700;' : ''}"></i></div><em class="lv ${full ? 'max' : ''}" style="${x ? 'color:#ffd700;' : ''}" title="目前等級／等級上限（金色＝已用銀河幣突破）">${lab}</em><b>${val[k]}</b>${own ? btn : ''}</div>`;
            }).join('');
            const img = S.id === 'star' ? 'assets/player.png' : `assets/ship_${S.id}.png`;
            return `<div class="card ${i === this.hIdx ? 'sel' : ''} ${S.id === this.shipId ? 'eq' : ''} ${own ? '' : 'locked'}" onclick="game.hSel(${i})">
                <img src="${img}" onerror="this.style.visibility='hidden'"><h3 style="color:${S.c};">${S.name}</h3><div style="font-size:0.8rem;color:#aaa;">${S.role}　等級上限 火${S.cap.dmg}/速${S.cap.rate}/甲${S.cap.hp}/動${S.cap.spd}/穿${S.cap.pen}/爆${S.cap.crit}/覆${S.cap.cov}</div>
                ${own ? rows : `<div class="st" style="color:var(--neon-gold);">尚未擁有・軍械商店 ${S.price} DM</div>${rows}`}</div>`;
        }).join('');
        this.uiLayer.innerHTML = `
            <div class="menu-overlay" style="width:min(96vw,1100px);max-width:none;">
                <h2 class="shop-title" style="margin-bottom:4px;">戰機管理</h2>
                <p style="color:var(--neon-purple); margin:4px 0;">持有暗物質: <b>${this.darkMatter} DM</b>　<span style="color:#ffd700">銀河幣: <b>${this.galaxy}</b></span>　<small style="color:#aaa;">←／→ 選卡　1~${KS.length} 升級　Enter 出戰　Esc 返回</small></p>
                <div style="display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:center;margin:6px 0;">${this.radarSvg(SHIPS[this.hIdx])}
                    <div style="text-align:left;font-size:.85rem;line-height:1.7;color:#ccd;"><b style="color:${SHIPS[this.hIdx].c};font-size:1.05rem;">${SHIPS[this.hIdx].name}</b>　${SHIPS[this.hIdx].role}<br>雷達圖滿格＝16 級<br><b>火力覆蓋：${COV_INFO[SHIPS[this.hIdx].pat][0]}</b><br><span style="color:#9ab;font-size:.8rem;display:inline-block;max-width:260px;line-height:1.5">${COV_INFO[SHIPS[this.hIdx].pat][1]}</span><br><span style="color:${SHIPS[this.hIdx].c}">■</span> 目前等級　<span style="color:#889">┅</span> 等級上限</div></div>
                <div class="cards">${cards}</div>
                <button class="btn btn-shop" onclick="game.hEquip()">設為出戰戰機 [Enter]</button>
                <button class="btn btn-start" style="margin-top:6px;" onclick="game.setState('LOBBY')">返回大廳 [Esc]</button>
            </div>`;
    }

    shopRows() {
        const rows = [];
        SHIPS.forEach(X => {
            const o = this.fleet[X.id].own, c = X.cap;
            rows.push({ t: `${X.name}｜${X.role}`, img: X.id === 'star' ? 'assets/player.png' : 'assets/ship_' + X.id + '.png', c: X.c, dis: o || this.darkMatter < X.price,
                sub: `${o ? '已擁有（到「戰機管理」升級／出戰）' : X.price + ' DM'}・上限 火${c.dmg} 速${c.rate} 甲${c.hp} 動${c.spd} 穿${c.pen} 爆${c.crit} 覆${c.cov}`,
                run: () => { this.darkMatter -= X.price; this.fleet[X.id].own = true; } });
        });
        [['成語列', '同時收集的成語數', this.maxSlots, 6, SLOT_COST[this.maxSlots - 1] || 0, () => { this.maxSlots++; this.fillEmptySlots(); }, 'slots'],
         ['磁吸字塊', '字塊自動吸附範圍（Lv1 只吸身邊約 1 格，Lv10 吸全螢幕）', this.magnetLvl, MAGNET_MAX, MAGNET_COST[this.magnetLvl] || 0, () => this.magnetLvl++, 'magnet'],
         ['暗物質回收', '暗物質獲得 +20%', this.dmLvl, 5, DMREC_COST[this.dmLvl] || 0, () => this.dmLvl++, 'dm']].forEach(([n, d, lv, max, cost, f, ic]) => {
            rows.push({ t: `${n} Lv.${lv}/${max}`, svg: SHOP_ICONS[ic], dis: lv >= max || this.darkMatter < cost, sub: lv >= max ? '已滿級' : `${d}・${cost} DM`, run: () => { this.darkMatter -= cost; f(); } });
        });
        return rows;
    }

    renderShop() {
        const heads = { 0: '戰機（購買後到「戰機管理」升級與出戰）', [SHIPS.length]: '全體升級' };
        const html = this.shopRows().map((r, i) => `${heads[i] ? `<div style="color:var(--neon-gold);margin-top:8px;font-size:0.9rem;">${heads[i]}</div>` : ''}<button class="btn btn-shop shop-row" style="font-size:0.85rem;padding:6px 8px;margin:4px auto;" ${r.dis ? 'disabled' : ''} onclick="game.buyItem(${i})"><span class="shop-ic">${r.img ? `<img src="${r.img}" alt="" style="filter:drop-shadow(0 0 6px ${r.c})">` : (r.svg || '')}</span><span class="shop-tx">[${i + 1}] ${r.t}<br><small>${r.sub}</small></span></button>`).join('');
        this.uiLayer.innerHTML = `
            <div class="menu-overlay">
                <h2 class="shop-title" style="margin-bottom:5px;">軍械商店</h2>
                <p style="font-size:1.1rem; color:var(--neon-purple); margin:4px 0;">持有暗物質: <b>${this.darkMatter} DM</b></p>
                ${html}
                <button class="btn btn-start" style="margin-top:10px;" onclick="game.setState('LOBBY')">返回大廳 [Esc]</button>
            </div>`;
    }

    buyItem(i) {
        const r = this.shopRows()[i];
        if (!r || r.dis) return;
        r.run(); this.applyUpgrades(); if (i < SHIPS.length) sfx.playBuy(); else sfx.playFeatureUp(); this.save(); this.keepScroll(() => this.renderShop());
        this.upToast(i < SHIPS.length ? `${SHIPS[i].name} 購買成功！` : `${this.shopRows()[i].t.replace(/ Lv\.(\d+)\/(\d+)/, '')} 升級成功！Lv.${this.shopRows()[i].t.replace(/.*Lv\.(\d+)\/.*/, '$1')}`);
    }

    save() {
        try { localStorage.setItem('idiomShooterSave', JSON.stringify({ dm:this.darkMatter, g:this.galaxy, s:this.maxSlots, m:this.magnetLvl, d:this.dmLvl, f:this.fleet, i:this.shipId, b:this.bestStage, t:this.startStage })); } catch (err) {}
    }
    load() {
        try {
            const v = JSON.parse(localStorage.getItem('idiomShooterSave') || 'null'); if (!v) return;
            this.darkMatter = v.dm || 0; this.galaxy = Math.max(0, v.g || 0); this.maxSlots = v.s || 1; this.magnetLvl = Math.min(MAGNET_MAX, v.m || 0); this.dmLvl = v.d || 0;
            this.bestStage = Math.min(9, v.b || 1); this.startStage = Math.min(v.t || 1, this.bestStage);
            if (v.f) { SHIPS.forEach(S => { if (v.f[S.id]) Object.assign(this.fleet[S.id], v.f[S.id]); }); if (this.fleet[v.i] && this.fleet[v.i].own) this.shipId = v.i; }
            else { const f = this.fleet.star; f.dmg = Math.min(v.w || 1, 8); f.hp = Math.min(v.h || 0, 8); f.spd = Math.min(v.e || 0, 8); }   // 舊版存檔轉入星藍號
            SHIPS.forEach(S => STAT_KEYS.forEach(([k]) => { this.fleet[S.id][k] = Math.min(this.fleet[S.id][k] || 0, S.cap[k]); if (this.fleet[S.id].x) this.fleet[S.id].x[k] = Math.max(0, Math.min(XMAX, this.fleet[S.id].x[k] | 0)); }));
        } catch (err) {}
    }

    startNewGame() {
        sfx.init(); this.tryFullscreen(); this.applyUpgrades(); this.shield = 0; this.waves = []; this.pierceTimer = 0; this.lifestealTimer = 0; this.missileTimer = 0; this.allies = []; this.allyTimer = 0; this.runDM = 0; this.runKills = 0; this.runCasts = 0; this.clearT = 0; this.snipe = { c: 0, t: [], fx: [] }; this.idleT = 0; this.idleGain = 0; this.idleAnchor = null; this.currentStage = Math.min(this.startStage, this.bestStage); this.currentSub = 1; this.score = 0; 
        this.hp = this.maxHp; this.slots = []; 
        this.fillEmptySlots(); // 遊戲開始時塞滿隨機成語任務
        this.resetStage(); this.setState('PLAYING');
    }

    fillEmptySlots() {
        while (this.slots.length < this.maxSlots) {
            const rand = this.pickIdiom();
            this.slots.push({ type: 'COLLECTING', word: rand.word, chars: [], effect: rand.effect, effectDesc: rand.desc });
        }
    }

    resetStage() {
        this.boss = null; this.clearT = 0; this.bossSumT = 0; if (this.currentSub === 1) { this.stageStart = this.runClock || 0; this.stageStartFor = this.currentStage; }
        this.enemies = []; this.idiomBlocks = []; this.charItems = [];
        this.player.pos = new Vec2(WORLD.w / 2, WORLD.h - 150);
        this.bullets.pool.forEach(b => b.active = false);
        this.pointerActive = false; 
        document.getElementById('boss-bar').style.display = 'none';
        
        if (this.currentSub < 3) {
            this.waveQuota = 3 + (this.currentStage - 1) * 3 + (this.currentSub - 1) * 2;
            this.enemiesSpawned = 0;
            this.enemySpawnTimer = 0;
        } else {
            this.waveQuota = 0;
        }
        this.idiomBlockTimer = 0;
        this.showFloatText(this.currentSub === 3 ? "WARNING: " + bossLabel(this.currentStage) : `區塊 ${this.currentStage}-${this.currentSub} 開始`, WORLD.w/2, WORLD.h/2, "#ffea00");
    }

    startTransition(isNextStage) {
        this.gameState = 'TRANSITION'; this.transitionTimer = 0; this.isNextStage = isNextStage; this.clearT = 0;
        this.bullets.pool.forEach(b => b.active = false); this.enemies = []; this.idiomBlocks = []; this.charItems = [];
        sfx.playTransition();
        this.showFloatText(isNextStage ? "STAGE CLEAR" : "WAVE CLEARED", WORLD.w/2, WORLD.h/2 - 50, "#00f2ff");
    }

    renderIdiomSlots() {
        if(this.gameState !== 'PLAYING' && this.gameState !== 'TRANSITION') return;
        const container = document.getElementById('idiom-ui'); container.innerHTML = ''; container.style.setProperty('--n', this.maxSlots); { const avail = Math.min(WORLD.rw, 720) * 0.98 - (this.maxSlots - 1) * 4; container.style.setProperty('--sw', Math.max(40, Math.min(120, avail / this.maxSlots)) + 'px'); }
        for (let i = 0; i < this.maxSlots; i++) {
            const slot = this.slots[i]; const div = document.createElement('div');
            if (slot) {
                // 產生每個字元的 HTML 結構
                let charsHTML = slot.word.split('').map(c => 
                    `<span class="char ${slot.chars.includes(c) ? 'collected' : 'uncollected'}">${c}</span>`
                ).join('');

                if (slot.type === 'READY') {
                    div.className = 'slot ready'; 
                    div.innerHTML = `<div class="slot-title">${charsHTML}</div><span class="slot-key">${i + 1}</span><div class="slot-subtitle">按 ${i + 1} 發動<br>(${slot.effectDesc})</div>`;
                    div.onclick = (e) => { e.stopPropagation(); this.useIdiom(i); };
                    div.ontouchstart = (e) => { e.stopPropagation(); e.preventDefault(); this.useIdiom(i); };
                } else if (slot.type === 'COLLECTING') {
                    div.className = 'slot collecting';
                    div.innerHTML = `<div class="slot-title">${charsHTML}</div><span class="slot-key">${i + 1}</span><div class="slot-subtitle">${slot.effectDesc}</div>`;
                }
            }
            container.appendChild(div);
        }
    }

    useIdiom(index) {
        if (this.coopMode) return coop.useSlot(index);   // 多人闖關：成語列共用，由主控端裁決誰先發動
        const idiom = this.slots[index];
        if (!idiom || idiom.type !== 'READY' || this.paused || this.casting || performance.now() < (this._swallowUntil || 0)) return;
        const r = this.pickIdiom();
        this.slots[index] = { type: 'COLLECTING', word: r.word, chars: [], effect: r.effect, effectDesc: r.desc };
        this.renderIdiomSlots();
        this.startCast({ word: idiom.word, effect: idiom.effect, desc: idiom.effectDesc });
    }

    startCast(idiom) {
        this.casting = { idiom, t: 5 }; sfx.playIdiomCast();
        const info = IDIOM_INFO[idiom.word] || ['', ''], useMeaning = Math.random() < 0.5, label = useMeaning ? '解釋' : '造句', text = info[useMeaning ? 0 : 1] || '';
        let p = document.getElementById('idiom-popup');
        if (!p) { p = document.createElement('div'); p.id = 'idiom-popup'; document.getElementById('game-container').appendChild(p); }
        p.innerHTML = `<div class="ip-word">${idiom.word}</div><div class="ip-effect">大招效果：${idiom.desc}</div><div class="ip-line"><b>${label}</b>　<span id="ip-text"></span><span class="ip-cur">▌</span></div><div class="ip-bar"><i></i></div>`;
        p.style.display = 'block'; this.typeText(text, useMeaning ? null : idiom.word);
    }
    typeText(text, word) {   // 像 AI 回覆一樣逐字浮現（造句時，用到成語的部分粗體）
        clearInterval(this._tw); const el = document.getElementById('ip-text'); if (!el) return;
        const ch = [...text], rng = word ? idiomRange(text, word) : null; let i = 0, step = Math.max(45, Math.min(130, 3200 / Math.max(1, ch.length)));
        this._tw = setInterval(() => { i++; el.innerHTML = boldSlice(ch, i, rng); if (i >= ch.length) { clearInterval(this._tw); const c = document.querySelector('#idiom-popup .ip-cur'); if (c) c.style.display = 'none'; } }, step);
    }

    endCast() { clearInterval(this._tw); this.casting = null; const p = document.getElementById('idiom-popup'); if (p) p.style.display = 'none'; }

    finishCast() { const idiom = this.casting.idiom; this.endCast(); this.runCasts = (this.runCasts || 0) + 1; this.applyIdiom(idiom); }
    applyIdiom(idiom) {
        sfx.playIdiomFire(idiom.effect);
        this.showFloatText(`發動！${idiom.word}！`, this.player.pos.x, this.player.pos.y - 40, '#ffea00');
        if (idiom.effect === 'BOMB_BOOST') this.triggerBomb();
        if (idiom.effect === 'INVINCIBLE') this.invincibleTimer = 10;
        
        if (idiom.effect === 'LASER_BEAM') this.triggerLaser();
        if (idiom.effect === 'SHIELD') { this.shield = Math.min(this.maxHp, this.shield + 50); this.showFloatText('護盾 +' + 50 * SHOW, this.player.pos.x, this.player.pos.y - 70, '#4dd2ff'); }
        if (idiom.effect === 'ALLY') this.summonAllies();
        if (idiom.effect === 'PIERCE') this.pierceTimer = 30;
        if (idiom.effect === 'LIFESTEAL') { this.lifestealTimer = LIFESTEAL_T; this._lsAcc = 0; this._lsTot = 0; this.showFloatText('吸血 ' + LIFESTEAL_T + ' 秒', this.player.pos.x, this.player.pos.y - 70, '#ff5c8a'); }
        if (idiom.effect === 'MISSILE') { this.missileTimer = 10; this.missileCd = 0; }
        if (idiom.effect === 'HEAL') { this.hp = Math.min(this.maxHp, this.hp + 30); this.updateHUD(); }
        if (idiom.effect === 'SLOW_TIME') this.slowTimer = 6;
    }

    triggerBomb() {
        this.bullets.pool.forEach(b => { if(!b.isPlayer) b.active = false; });
        if (this.boss) { const d = Math.min(300, this.boss.maxHp * 0.25); this.dmgEnt(this.boss, d); this.showFloatText(`Boss -${Math.round(d * SHOW)}`, this.boss.pos.x, this.boss.pos.y + 70, '#ff3366'); }
        this.shock = { t: 0, x: this.player.pos.x, y: this.player.pos.y };
        for (let i = 0; i < 24; i++) this.burst(Math.random() * WORLD.w, Math.random() * WORLD.h, 8);
        this.enemies.forEach(e => { this.dropDarkMatter(e.pos.x, e.pos.y, e.maxHp * 2); this.runKills = (this.runKills || 0) + 1; this.enemyDrop(e, 0.5); sfx.playExplosion(); });
        this.enemies = []; this.showFloatText("全螢幕爆破!", WORLD.w/2, WORLD.h/2, "#ff00ff");
    }
    triggerLaser() { this.laserTimer = 3.0; }
    pushWave(x, y, r, a) {   // 震波動畫（單機、主控端與客戶端共用）
        if (this.waves.length > 14) this.waves.shift();
        this.waves.push({ x, y, r, a, t: 0, life: BLAZE_WAVE_T });
        if (sfx.ctx && sfx._gate('wave', 0.1)) { sfx.playNoise(0.22, 0.08 + 0.08 * a); sfx.sweep('sine', 260, 50, 0.3, 0.1 + 0.06 * a); }
    }
    updWaves(dt) { if (this.waves && this.waves.length) this.waves = this.waves.filter(w => (w.t += dt) < w.life); }
    blazeShock(b, h) {   // 烈焰號震波：命中處爆炸。準度 a（0＝打在邊緣、1＝正中彈心）決定半徑；範圍內小型機種直接摧毀，其他敵機受震波傷害；Boss、字卡與敵彈不受影響
        const a = Math.max(0, Math.min(1, (h.mul - BLAZE_EDGE) / (BLAZE_CENTER - BLAZE_EDGE))), R = BLAZE_SHOCK_R0 + (BLAZE_SHOCK_R1 - BLAZE_SHOCK_R0) * a;
        this.pushWave(h.x, h.y, R, a);
        if (this.coopHost && window.coop && coop.evq.length < 80) coop.evq.push(['bw', Math.round(h.x), Math.round(h.y), Math.round(R), Math.round(a * 100) / 100]);
        this.burst(h.x, h.y, 4 + Math.round(8 * a));
        for (let i = this.enemies.length - 1; i >= 0; i--) {
            const e = this.enemies[i]; if (e === h.skip || e.type === 'BOSS') continue;
            const d = Math.hypot(e.pos.x - h.x, e.pos.y - h.y); if (d > R + e.radius) continue;
            let n, cr = 0;
            if (BLAZE_SMALL[e.type]) n = Math.max(0, e.hp) + Math.max(0, this.shieldOf(e) || 0) + 1;   // 小型機種：血量＋護盾一次吃滿
            else { n = b.damage * BLAZE_SHOCK_K * (0.5 + a) * (1 - 0.5 * Math.min(1, d / (R + e.radius))); cr = Math.random() < (b.crit || 0) ? 1.5 + Math.random() * 1.5 : 0; if (cr) n *= cr; n = Math.max(n * MIN_DMG_K, n - this.armorLv(e) * DEF_PER_LV); }   // 大型機種：越準、越靠近爆心傷害越高；震波傷害依爆擊率機率爆擊（1.5~3 倍），仍會被裝甲減傷
            this.dmgEnt(e, n, false, false, b, cr);
            if (e.hp <= 0) { this.dropDarkMatter(e.pos.x, e.pos.y, e.maxHp * 1.5); this.runKills = (this.runKills || 0) + 1; this.enemyDrop(e); sfx.playExplosion(); this.enemies.splice(i, 1); }
        }
    }
    lifesteal(dealt) {   // 吸血：我方子彈命中時回血＝傷害×LIFESTEAL_RATE，每發最多回自身最大血量的 LIFESTEAL_CAP；雷射與爆破不走這裡
        if (!(this.lifestealTimer > 0) || !(dealt > 0) || this.hp <= 0 || this.hp >= this.maxHp) return;
        let h = Math.min(this.maxHp - this.hp, dealt * LIFESTEAL_RATE, this.maxHp * LIFESTEAL_CAP);
        let ended = false;
        if (this.pkMode) {   // PK：單次吸血最多回復自身最大血量的 30%，回滿額度就提前結束吸血
            const room = this.maxHp * PK_LS_TOTAL - (this._lsTot || 0);
            if (room <= 0) { this.lifestealTimer = 0; return; }
            if (h >= room) { h = room; ended = true; }
            this._lsTot = (this._lsTot || 0) + h;
        }
        this.hp += h; this._lsAcc = (this._lsAcc || 0) + h;
        if (ended) { this.lifestealTimer = 0; this.showFloatText('+' + Math.max(1, Math.round(this._lsAcc * SHOW)) + ' 吸血結束', this.player.pos.x, this.player.pos.y - 52, '#7dff9a'); this._lsAcc = 0; this._lsT = this.bgClock; this.updateHUD(); return; }
        if (this.bgClock - (this._lsT === undefined ? -9 : this._lsT) >= 0.5) { this._lsT = this.bgClock; this.showFloatText('+' + Math.max(1, Math.round(this._lsAcc * SHOW)), this.player.pos.x, this.player.pos.y - 52, '#7dff9a'); this._lsAcc = 0; this.updateHUD(); }
    }

    showFloatText(text, x, y, color = "#fff") { const t = this.texts.get(); t.pos = new Vec2(x, y); t.text = text; t.color = color; t.life = 1.5; }
    dropDarkMatter(x, y, amount) { amount = Math.max(1, Math.round(amount * (1 + 0.2 * this.dmLvl) * (1 + 0.25 * (this.currentStage - 1)) * DM_RATE)); this.runDM = (this.runDM || 0) + amount; this.idleGain = (this.idleGain || 0) + amount; this.burst(x, y, amount >= 20 ? 18 : 4); this.darkMatter += amount; this.showFloatText(`+${amount} DM`, x, y, "#b026ff"); this.updateHUD(); }

    updateHUD() {
        if(this.gameState !== 'PLAYING' && this.gameState !== 'TRANSITION') return;
        if (this.coopMode) { document.getElementById('dm-val').innerText = Math.round(coop.pool || 0); document.getElementById('lvl-val').innerText = this.currentSub === 3 && this.currentStage === 9 ? 'FINAL BOSS' : `${this.currentStage + 9}-${this.currentSub}`; return; }   // 多人闖關：顯示團隊銀河幣與關卡（10~18 關）
        document.getElementById('dm-val').innerText = this.darkMatter;
        document.getElementById('lvl-val').innerText = this.currentStage === 9 ? "FINAL BOSS" : `${this.currentStage}-${this.currentSub}`;
    }

    loop(timestamp) {
        const dt = Math.min((timestamp - this.lastTime) / 1000, 0.1); this.lastTime = timestamp;
        if (this.coopMode) { if (!this.coopLocal) this.paused = false; if (this.casting) this.endCast(); }   // 連線多人闖關不能暫停；同機多人（同一台電腦）可以暫停（按 P／Esc、回首頁對話框、視窗失焦）。兩者都沒有 5 秒蓄力停格
        if (this.gameState === 'PLAYING') { if (!this.paused) { if (this.casting) { this.casting.t -= dt; if (this.casting.t <= 0) this.finishCast(); this.tickClear(dt); } else { this.tickClear(dt); this.bgClock += dt; this.runClock += dt; if (this.pkMode) this.pkTime += dt; this.update(dt); } } } else if (this.gameState === 'TRANSITION') { if (!(this.coopLocal && (this.dlgOpen || this.paused))) { this.bgClock += dt; this.runClock += dt; this.updateTransition(dt); } } else if (this.isMenu()) this.updateDemo(dt);
        this.draw(); requestAnimationFrame((t) => this.loop(t));
    }

    updateTransition(dt) {
        if (this.coopMode) return coop.transition(dt);
        this.transitionTimer += dt;
        if (this.transitionTimer > 1.0 && this.transitionTimer <= 2.0) this.player.pos.y -= 1000 * dt; 
        if (this.transitionTimer > 2.0) {
            if (this.isNextStage) {
                if (this.currentStage < CONFIG.MAX_STAGES) { this.currentStage++; this.currentSub = 1; } 
                else if (this.currentStage === 8) { this.currentStage = 9; this.currentSub = 1; } 
                else { this.setState('VICTORY'); return; }
            } else { this.currentSub++; }
            this.resetStage(); this.setState('PLAYING'); this.updateHUD();
        }
        this.texts.pool.forEach(t => { if(t.active) t.update(dt); });
    }

    enemyFire(e, dt) {   // 每種小怪各有專屬的攻擊樣式與頻率
        if (e.pos.y < 20) return;                   // 還沒進入畫面不開火
        const v = 70 + this.currentStage * 14, D = Math.PI / 2;
        const shot = (x, y, a, sp, r, dmg) => { const b = this.bullets.get(); b.pos = new Vec2(x, y); b.vel = new Vec2(Math.cos(a) * sp, Math.sin(a) * sp); b.color = e.color; b.isPlayer = false; b.radius = r; b.damage = dmg; };
        const aim = () => Math.atan2(this.player.pos.y - e.pos.y, this.player.pos.x - e.pos.x);
        if (e.snipe) {                              // 狙擊：瞄準線會追著玩家，線「不動」滿 2.5 秒才開槍；一直移動就打不到
            const sn = e.snipe, want = aim(); let d = want - sn.a; while (d > Math.PI) d -= Math.PI * 2; while (d < -Math.PI) d += Math.PI * 2;
            const step = Math.max(-8 * dt, Math.min(8 * dt, d)); sn.a += step; e.lockA = sn.a;
            if (Math.abs(step) / dt < 0.05) sn.still += dt; else sn.still = 0;
            e.charge = 1; e.snipeP = Math.min(1, sn.still / 2.5);
            if (sn.still >= 2.5) { e.snipe = null; e.charge = 0; e.snipeP = 0; shot(e.pos.x, e.pos.y + e.radius, sn.a, 1100, 8, 4); sfx.playSnipe && sfx.playSnipe(); }
            return;
        }
        if (e.q && e.q.length) {                    // 連發／蓄力／雙擊的後續動作
            e.q[0].t -= dt; if (e.type === 'SNIPER') e.charge = Math.max(0, e.q[0].t);
            if (e.q[0].t <= 0) e.q.shift().f();
            return;
        }
        e.shootTimer += dt; if (e.shootTimer <= e.shootInterval) return; e.shootTimer = 0;
        const x = e.pos.x, y0 = e.pos.y + e.radius, push = (t, f) => { (e.q = e.q || []).push({ t, f }); };
        switch (e.type) {
            case 'SCOUT': shot(x, y0, aim(), v * 0.8, 4, 1); break;                                                        // 單發慢彈
            case 'FIGHTER': for (let i = 0; i < 3; i++) push(i ? 0.14 : 0.01, () => { shot(e.pos.x, e.pos.y + e.radius, aim(), v * 1.1, 4, 1); sfx.playEnemyShoot(); }); return;   // 三連發
            case 'TANK': for (let i = -2; i <= 2; i++) shot(x, y0, D + i * 0.26, v * 0.8, 6, 2); break;                    // 重砲五向齊射
            case 'SWARM': { const k = e.form && e.form.kind;                                                              // 依隊形：直射／瞄準／向外放射
                if (k === 'ring') shot(x, e.pos.y, Math.atan2(e.pos.y - e.cy, e.pos.x - e.cx), v * 0.7, 3, 1);
                else if (k === 'v') shot(x, y0, aim(), v * 0.9, 3, 1); else shot(x, y0, D, v * 0.9, 3, 1); break; }
            case 'SNIPER': e.lockA = aim(); e.snipe = { a: e.lockA, still: 0 }; e.charge = 1; return;   // 開始瞄準（線不動 2.5 秒後射出高傷害極速子彈）
            case 'BOMBER': { const p = (e.pat = e.pat || 0) % 3; e.pat++;                                                 // 三向 → 五向 → 慢速大炸彈 輪替
                if (p === 0) [-0.35, 0, 0.35].forEach(o => shot(x, y0, D + o, v * 0.9, 5, 1));
                else if (p === 1) [-0.6, -0.3, 0, 0.3, 0.6].forEach(o => shot(x, y0, D + o, v * 0.85, 5, 1));
