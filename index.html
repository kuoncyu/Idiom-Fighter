<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>成語戰機：星際觸控版</title>
    <style>
        :root {
            --neon-blue: #00f2ff;
            --neon-pink: #ff00ff;
            --neon-gold: #ffea00;
            --neon-purple: #b026ff;
            --neon-green: #00ffcc;
            --neon-orange: #ffaa00;
            --neon-red: #ff3366;
            --bg-dark: #050510;
        }
        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-dark);
            color: white;
            font-family: 'Segoe UI', 'Microsoft JhengHei', sans-serif;
            overflow: hidden;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
        }
        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        canvas {
            background: #020205;
            display: block;
            box-shadow: 0 0 20px rgba(0, 242, 255, 0.2);
            touch-action: none;
        }
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }
        .menu-overlay {
            background: rgba(5, 5, 16, 0.95);
            border: 2px solid var(--neon-blue);
            padding: 30px;
            border-radius: 15px;
            text-align: center;
            pointer-events: auto;
            min-width: 320px;
            box-shadow: 0 0 30px rgba(0, 242, 255, 0.3);
            max-height: 80vh;
            overflow-y: auto;
        }
        h1, h2 { color: var(--neon-blue); text-shadow: 0 0 10px var(--neon-blue); margin-bottom: 20px; }
        .shop-title { color: var(--neon-purple); text-shadow: 0 0 10px var(--neon-purple); margin-top: 0; }
        .btn {
            background: rgba(0, 242, 255, 0.1); border: 1px solid var(--neon-blue);
            color: var(--neon-blue); padding: 12px 20px; margin: 10px auto; cursor: pointer;
            font-size: 1.1rem; transition: all 0.3s; border-radius: 5px; display: block;
            width: 90%; text-transform: uppercase; font-weight: bold;
        }
        .btn:hover:not(:disabled) { background: var(--neon-blue); color: black; box-shadow: 0 0 15px var(--neon-blue); }
        .btn:disabled { border-color: #555; color: #555; cursor: not-allowed; background: transparent; }
        .btn-shop { border-color: var(--neon-purple); color: var(--neon-purple); }
        .btn-shop:hover:not(:disabled) { background: var(--neon-purple); color: white; box-shadow: 0 0 15px var(--neon-purple); }
        .btn-start { background: rgba(0, 242, 255, 0.2); font-size: 1.3rem; padding: 15px; margin-top: 20px; }
        
        #hud {
            position: absolute; top: 10px; left: 10px; right: 10px; display: flex;
            justify-content: space-between; pointer-events: none; font-family: 'Courier New', monospace;
            font-size: 1rem; color: var(--neon-blue); background: rgba(0,0,0,0.6);
            padding: 10px 15px; border-radius: 10px; border: 1px solid rgba(0,242,255,0.3); z-index: 5;
        }
        .hud-item { margin: 0 5px; }
        .hud-dm { color: var(--neon-purple); font-weight: bold; text-shadow: 0 0 5px var(--neon-purple); }
        
        #stage-info {
            position: absolute; top: 60px; left: 50%; transform: translateX(-50%);
            color: var(--neon-gold); font-weight: bold; font-size: 1.2rem; text-shadow: 0 0 5px black;
        }
        .boss-hp-bar { position: absolute; top: 90px; left: 50%; transform: translateX(-50%); width: 80%; height: 10px; background: #333; border: 1px solid white; display: none; }
        .boss-hp-fill { width: 100%; height: 100%; background: linear-gradient(to right, #f00, #ff0); transition: width 0.2s; }
        
        .idiom-slots {
            position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
            display: flex; gap: 10px; align-items: flex-end; z-index: 20; flex-wrap: nowrap; justify-content: center; width: 98%; pointer-events: none;
        }
        .slot {
            flex: 1; max-width: 120px; height: 80px; border: 2px solid #444; background: rgba(0,0,0,0.8);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            border-radius: 8px; transition: all 0.3s; pointer-events: none; position: relative;
        }
        .slot.collecting { border-color: var(--neon-blue); box-shadow: 0 0 8px rgba(0, 242, 255, 0.3); }
        .slot.ready { 
            border-color: var(--neon-gold); box-shadow: 0 0 20px var(--neon-gold); 
            cursor: pointer; pointer-events: auto; animation: pulseReady 0.8s infinite alternate;
            background: rgba(255, 234, 0, 0.15);
        }
        
        .slot-title { font-size: 1.2rem; margin-bottom: 5px; white-space: nowrap; display: flex; gap: 2px; }
        .char { display: inline-block; transition: all 0.3s; font-weight: bold; }
        .char.collected { color: var(--neon-blue); text-shadow: 0 0 8px var(--neon-blue); transform: scale(1.1); }
        .char.uncollected { color: rgba(255,255,255,0.2); }
        
        .slot-subtitle { font-size: 0.7rem; color: #aaa; text-align: center; }
        .ready .char.collected { color: var(--neon-gold); text-shadow: 0 0 10px var(--neon-gold); }
        .ready .slot-subtitle { color: var(--neon-gold); font-weight: bold; font-size: 0.8rem; text-shadow: 0 0 5px var(--neon-gold); }
        
        @keyframes pulseReady { 
            from { box-shadow: 0 0 10px var(--neon-gold); border-color: var(--neon-gold); transform: scale(1); } 
            to { box-shadow: 0 0 30px var(--neon-gold), inset 0 0 15px var(--neon-gold); border-color: #fff; transform: scale(1.05); } 
        }
        .slot { overflow: visible; }
        .slot-key { position:absolute; top:-10px; left:-6px; width:22px; height:22px; line-height:22px; text-align:center;
            font: bold 0.85rem 'Courier New', monospace; background:#050510; border:1px solid var(--neon-blue); color:var(--neon-blue); border-radius:5px; }
        .slot.ready .slot-key { background:var(--neon-gold); color:#000; border-color:var(--neon-gold); box-shadow:0 0 10px var(--neon-gold); }
        #idiom-popup { display:none; position:absolute; left:50%; top:42%; transform:translate(-50%,-50%); z-index:30; width:min(86vw,460px);
            padding:22px 26px; text-align:center; background:rgba(5,5,16,.94); border:2px solid var(--neon-gold); border-radius:14px;
            box-shadow:0 0 35px rgba(255,234,0,.45); pointer-events:none; }
        .ip-word { font-size:2.4rem; font-weight:bold; letter-spacing:.2em; color:var(--neon-gold); text-shadow:0 0 12px var(--neon-gold); }
        .ip-effect { color:var(--neon-purple); margin:6px 0 12px; font-weight:bold; }
        .ip-line { text-align:left; line-height:1.7; color:#e8f7ff; font-size:1.05rem; }
        .ip-line b { color:var(--neon-blue); }
        .ip-bar { height:6px; background:#333; border-radius:3px; margin-top:16px; overflow:hidden; }
        .ip-bar i { display:block; height:100%; background:var(--neon-gold); animation: ipCount 3s linear forwards; }
        @keyframes ipCount { from { width:100%; } to { width:0; } }
        .cards { display:flex; flex-wrap:wrap; gap:12px; justify-content:center; width:100%; margin:10px 0; }
        .card { width:230px; background:rgba(10,12,30,.92); border:2px solid #334; border-radius:12px; padding:10px; text-align:left; cursor:pointer; }
        .card.sel { border-color:var(--neon-blue); box-shadow:0 0 14px var(--neon-blue); }
        .card h3 { margin:4px 0; color:#fff; font-size:1.05rem; }
        .card.eq h3::after { content:' ✔出戰中'; color:var(--neon-gold); font-size:.8rem; }
        .card img { width:100%; height:90px; object-fit:contain; }
        .card.locked img { filter:grayscale(1) brightness(.5); }
        .card .st { display:flex; align-items:center; gap:6px; margin:5px 0; font-size:.8rem; }
        .card .st span { width:34px; } .card .st b { width:46px; text-align:right; color:var(--neon-gold); font-size:.78rem; }
        .card .bar { flex:1; height:8px; border-radius:4px; } .card .bar i { display:block; height:100%; border-radius:4px; background:var(--neon-blue); }
        .card .st button { font-size:.7rem; padding:2px 5px; background:rgba(0,242,255,.15); border:1px solid var(--neon-blue); color:#fff; border-radius:4px; cursor:pointer; }
        .card .st button:disabled { opacity:.35; cursor:default; }
        .hbtn { pointer-events:auto; background:rgba(0,242,255,.12); border:1px solid var(--neon-blue); color:var(--neon-blue); border-radius:8px; padding:4px 10px; margin-right:6px; cursor:pointer; font-size:.9rem; font-family:inherit; }
        .hbtn:hover { background:rgba(0,242,255,.35); }
        #buff-bar { position:absolute; top:66px; left:12px; display:flex; flex-wrap:wrap; gap:6px; max-width:48%; z-index:6; pointer-events:none; }
        .buff { position:relative; overflow:hidden; min-width:96px; padding:3px 8px 6px; border-radius:8px; background:rgba(0,0,0,.65); border:1px solid var(--c); color:var(--c); font-size:.75rem; font-weight:bold; }
        .buff i { position:absolute; left:0; bottom:0; height:3px; background:var(--c); }
        .dlg { display:none; position:absolute; inset:0; z-index:60; background:rgba(0,0,10,.72); align-items:center; justify-content:center; }
        .dlg .box { background:#0a0a1a; border:2px solid var(--neon-blue); border-radius:14px; padding:20px 26px; min-width:270px; max-width:90vw; text-align:center; box-shadow:0 0 25px rgba(0,242,255,.4); color:#fff; }
        .dlg label { display:block; margin:12px 0; font-size:.9rem; text-align:left; } .dlg input[type=range] { width:100%; }
        .lob-title { margin:0; letter-spacing:.3em; text-shadow:0 0 18px var(--neon-blue); }
        .dmline { color:var(--neon-purple); margin:4px 0 8px; }
        .tiles { display:grid; grid-template-columns:repeat(4,1fr); gap:10px; width:100%; margin:6px auto; }
        .tile { position:relative; overflow:hidden; border-radius:14px; padding:12px; min-height:110px; color:#fff; text-align:left; cursor:pointer; border:1px solid rgba(255,255,255,.18);
            background:linear-gradient(135deg,var(--a),var(--b)); background-size:200% 200%; animation:tileIn .55s var(--d,0s) both, tileShift 8s ease-in-out infinite; transition:transform .2s, box-shadow .2s; }
        .tile:hover { transform:translateY(-4px) scale(1.03); box-shadow:0 8px 22px rgba(0,0,0,.5), 0 0 16px var(--a); }
        .tile.w2 { grid-column:span 2; } .tile.h2 { grid-row:span 2; min-height:230px; }
        .tile h4 { margin:0 0 4px; font-size:1.05rem; } .tile small { display:block; opacity:.9; line-height:1.45; }
        .tile .f1, .tile .f2 { position:absolute; inset:0; padding:12px; display:flex; flex-direction:column; justify-content:center; }
        .tile.live .f1 { animation:liveA 7s infinite; } .tile.live .f2 { animation:liveB 7s infinite; }
        .tile img { position:absolute; right:6px; bottom:4px; height:78%; max-width:55%; object-fit:contain; filter:drop-shadow(0 0 8px rgba(0,0,0,.7)); }
        .tile .ico { position:absolute; right:10px; bottom:4px; font-size:2.2rem; opacity:.35; }
        .tile.pic { animation:tileIn .55s var(--d,0s) both; background-size:cover; background-position:center; }
        .stg { display:flex; align-items:center; gap:12px; margin:6px 0; font-size:1.2rem; }
        .stg button { background:rgba(0,0,0,.5); border:1px solid #fff; color:#fff; border-radius:8px; padding:2px 12px; cursor:pointer; }
        .roster { color:#8aa; font-size:.8rem; }
        @keyframes liveA { 0%,42% { opacity:1; transform:translateY(0); } 50%,92% { opacity:0; transform:translateY(-100%); } 100% { opacity:1; transform:translateY(0); } }
        @keyframes liveB { 0%,42% { opacity:0; transform:translateY(100%); } 50%,92% { opacity:1; transform:translateY(0); } 100% { opacity:0; transform:translateY(100%); } }
        @keyframes tileIn { from { opacity:0; transform:scale(.85) translateY(14px); } to { opacity:1; transform:none; } }
        @keyframes tileShift { 0%,100% { background-position:0% 50%; } 50% { background-position:100% 50%; } }
        @media (max-width:560px) { .tiles { grid-template-columns:repeat(2,1fr); } .tile.w2 { grid-column:span 2; } }
        .splash { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; pointer-events:auto; cursor:pointer; overflow:hidden; z-index:50; background:radial-gradient(ellipse at center,#0d1b3d 0%,#050510 70%); }
        .sp-tiles i { position:absolute; bottom:-80px; border:1px solid rgba(0,242,255,.4); background:rgba(0,242,255,.07); animation:spFloat linear infinite; }
        @keyframes spFloat { from { transform:translateY(0) rotate(0); opacity:0; } 10% { opacity:1; } to { transform:translateY(-120vh) rotate(200deg); opacity:0; } }
        .sp-title { font-size:clamp(2.6rem,10vw,5rem); letter-spacing:.25em; margin:0; color:#fff; animation:spGlow 3s ease-in-out infinite alternate; }
        @keyframes spGlow { from { text-shadow:0 0 10px var(--neon-blue); } to { text-shadow:0 0 30px var(--neon-blue),0 0 70px var(--neon-purple); } }
        .sp-sub { color:var(--neon-blue); letter-spacing:.6em; margin:6px 0 34px; }
        .sp-hint { color:#8aa; font-size:.85rem; animation:spBlink 1.6s infinite; } @keyframes spBlink { 50% { opacity:.3; } }
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="gameCanvas"></canvas>
    <div id="ui-layer"></div>
    <div id="hud" style="display:none;">
        <div class="hud-item hud-btns"><button class="hbtn" onclick="game.goHome()" title="回首頁 [H]">⌂ 首頁</button><button class="hbtn" onclick="game.openSettings()" title="設定 [O]">⚙ 設定</button></div>
        <div class="hud-item hud-dm">暗物質: <span id="dm-val">0</span></div>
        <div class="hud-item">LVL: <span id="lvl-val">1-1</span></div>
    </div>
    <div id="stage-info"></div>
    <div id="buff-bar"></div>
    <div class="boss-hp-bar" id="boss-bar"><div class="boss-hp-fill" id="boss-hp-fill"></div></div>
    <div class="idiom-slots" id="idiom-ui" style="display:none;"></div>
</div>

<script>
"use strict";

class RetroAudio {
    constructor() { this.ctx = null; this.lastShootTime = 0; }
    init() {
        if(this.ctx) return;
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        this.ctx = new AudioContext();
        this.delayNode = this.ctx.createDelay(); this.delayNode.delayTime.value = 0.45; 
        this.feedbackNode = this.ctx.createGain(); this.feedbackNode.gain.value = 0.35; 
        this.delayNode.connect(this.feedbackNode); this.feedbackNode.connect(this.delayNode);
        this.mainGain = this.ctx.createGain(); this.mainGain.gain.value = 0.8;
        this.delayNode.connect(this.mainGain); this.mainGain.connect(this.ctx.destination);
        this.startSpaceBGM();
    }
    playTone(freq, type, duration, vol=0.1, useEcho=false) {
        if(!this.ctx) return;
        const osc = this.ctx.createOscillator(); const gain = this.ctx.createGain();
        osc.type = type; osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
        osc.connect(gain); gain.connect(this.mainGain);
        if (useEcho) gain.connect(this.delayNode);
        gain.gain.setValueAtTime(0, this.ctx.currentTime);
        gain.gain.linearRampToValueAtTime(vol, this.ctx.currentTime + 0.05);
        gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + duration);
        osc.start(); osc.stop(this.ctx.currentTime + duration);
    }
    playNoise(duration, vol=0.1) {
        if(!this.ctx) return;
        const bufferSize = this.ctx.sampleRate * duration;
        const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
        const data = buffer.getChannelData(0);
        for(let i=0; i<bufferSize; i++) data[i] = Math.random() * 2 - 1;
        const noise = this.ctx.createBufferSource(); noise.buffer = buffer;
        const gain = this.ctx.createGain();
        gain.gain.setValueAtTime(vol, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + duration);
        noise.connect(gain); gain.connect(this.mainGain); noise.start();
    }
    playShoot(kind = 0) {   // 0 普通 / 1 極速開火 / 2 超級散彈
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        if (now - this.lastShootTime < (kind ? 0.045 : 0.08)) return;
        this.lastShootTime = now;
        const osc = this.ctx.createOscillator(), gain = this.ctx.createGain();
        osc.type = ['square', 'sawtooth', 'sawtooth'][kind];
        osc.frequency.setValueAtTime([900, 1100, 700][kind], now);
        osc.frequency.exponentialRampToValueAtTime([260, 400, 180][kind], now + 0.12);
        osc.connect(gain); gain.connect(this.mainGain);
        gain.gain.setValueAtTime(0.07, now); gain.gain.exponentialRampToValueAtTime(0.001, now + 0.12);
        osc.start(now); osc.stop(now + 0.12);
        if (kind === 2) this.playNoise(0.05, 0.04);
    }
    sweep(type, f0, f1, dur, vol = 0.1, echo = false, swell = false) {
        if (!this.ctx) return;
        const t = this.ctx.currentTime, o = this.ctx.createOscillator(), g = this.ctx.createGain();
        o.type = type; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(f1, t + dur);
        g.gain.setValueAtTime(0.0001, t);
        if (swell) { g.gain.linearRampToValueAtTime(vol, t + dur * 0.92); g.gain.linearRampToValueAtTime(0.0001, t + dur); }
        else { g.gain.linearRampToValueAtTime(vol, t + Math.min(0.05, dur / 4)); g.gain.exponentialRampToValueAtTime(0.0001, t + dur); }
        o.connect(g); g.connect(this.mainGain); if (echo) g.connect(this.delayNode);
        o.start(t); o.stop(t + dur + 0.02);
    }
    playIdiomCast() {   // 3 秒蓄力：音高與音量逐漸上升
        this.sweep('sawtooth', 120, 900, 2.9, 0.07, true, true);
        this.sweep('sine', 240, 1800, 2.9, 0.06, true, true);
    }
    playIdiomFire(effect) {   // 依成語效果發出不同音效
        if (!this.ctx) return;
        const seq = (notes, type, gap, dur, vol, echo) => notes.forEach((f, i) => setTimeout(() => this.playTone(f, type, dur, vol, echo), i * gap));
        switch (effect) {
            case 'BOMB_BOOST': this.playNoise(1.0, 0.35); this.sweep('sine', 160, 30, 0.9, 0.3); break;
            case 'INVINCIBLE': seq([523, 659, 784, 1047, 1319], 'sine', 70, 0.35, 0.09, true); break;
            case 'RAPID_FIRE': seq([400, 480, 560, 640, 720, 800, 900, 1000], 'square', 45, 0.08, 0.05); break;
            case 'LASER_BEAM': this.sweep('sawtooth', 1400, 180, 1.0, 0.14, true); this.playNoise(0.6, 0.08); break;
            case 'SPREAD_FIRE': this.playNoise(0.25, 0.2); seq([900, 700, 560, 420], 'square', 60, 0.1, 0.07); break;
            case 'HEAL': seq([659, 880, 1319], 'sine', 110, 0.5, 0.1, true); break;
            case 'SHIELD': seq([392, 523, 659, 784], 'triangle', 80, 0.4, 0.1, true); this.sweep('sine', 200, 600, 0.5, 0.1, true); break;
            case 'PIERCE': this.sweep('sawtooth', 300, 1500, 0.25, 0.12, true); this.playNoise(0.1, 0.1); break;
            case 'MISSILE': seq([500, 700, 900, 1200], 'triangle', 60, 0.15, 0.08); break;
            case 'SLOW_TIME': this.sweep('sine', 900, 120, 1.1, 0.15, true); this.sweep('triangle', 450, 60, 1.1, 0.1, true); break;
        }
    }
    playEnemyShoot() { this.playTone(600, 'triangle', 0.1, 0.02); }
    playHit() { this.playNoise(0.1, 0.05); }
    playExplosion() { this.playNoise(0.5, 0.3); }
    playCollect() { this.playTone(800, 'sine', 0.1, 0.05); setTimeout(()=>this.playTone(1200, 'sine', 0.1, 0.05, true), 50); }
    playReady() { this.playTone(400, 'square', 0.1, 0.05); setTimeout(()=>this.playTone(600, 'square', 0.1, 0.05), 100); setTimeout(()=>this.playTone(800, 'square', 0.3, 0.08, true), 200); }
    playUse() { this.playTone(150, 'sawtooth', 0.6, 0.15, true); }
    playTransition() { this.playTone(300, 'sine', 1.5, 0.05, true); this.playTone(600, 'sine', 1.5, 0.03, true); }
    
    stopSpaceBGM() { if (this.bgmInterval) { clearInterval(this.bgmInterval); this.bgmInterval = null; } }
    startSpaceBGM() {
        if(this.bgmInterval) return;
        const chords = [[164.81, 196.00, 246.94, 293.66], [130.81, 164.81, 196.00, 246.94], [220.00, 261.63, 329.63, 392.00], [246.94, 293.66, 369.99, 440.00]];
        let step = 0; let chordIdx = 0;
        this.bgmInterval = setInterval(() => {
            if(!this.ctx || this.ctx.state !== 'running') return;
            if (step % 16 === 0) { chordIdx = Math.floor(step / 16) % chords.length; this.playTone(chords[chordIdx][0] / 2, 'triangle', 2.0, 0.12, true); }
            const note = chords[chordIdx][step % 4]; const finalNote = (step % 8 >= 4) ? note * 2 : note;
            this.playTone(finalNote, 'sine', 0.25, 0.04, true);
            step++;
        }, 150);
    }
}
const sfx = new RetroAudio();

// ===== AI 圖片素材：放在 index.html 旁的 assets/ 資料夾，缺檔時自動使用內建向量圖 =====
const ASSET_FILES = { player:'assets/player.png', scout:'assets/enemy_scout.png', fighter:'assets/enemy_fighter.png',
    tank:'assets/enemy_tank.png', boss:'assets/boss.png', block:'assets/idiom_block.png',
    ship_wind:'assets/ship_wind.png', ship_bastion:'assets/ship_bastion.png', ship_blaze:'assets/ship_blaze.png', ship_storm:'assets/ship_storm.png' };

// 讓圖片上下可無縫接續：把最底部一段漸變疊到最頂部，並裁掉該段
function makeSeamless(im) {
    const W = im.width, H = im.height, b = Math.round(H * 0.15), h2 = H - b;
    const c = document.createElement('canvas'); c.width = W; c.height = h2; const x = c.getContext('2d');
    x.drawImage(im, 0, 0, W, h2, 0, 0, W, h2);
    const t = document.createElement('canvas'); t.width = W; t.height = b; const tx = t.getContext('2d');
    tx.drawImage(im, 0, 0, W, b, 0, 0, W, b);
    tx.globalCompositeOperation = 'destination-in';
    const g = tx.createLinearGradient(0, 0, 0, b); g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(0,0,0,1)');
    tx.fillStyle = g; tx.fillRect(0, 0, W, b);
    x.drawImage(im, 0, h2, W, b, 0, 0, W, b); x.drawImage(t, 0, 0);
    return c;
}
const BG = {};   // assets/bg/stage1.jpg ~ stage9.jpg，缺檔則使用純色星空
function loadBg(stage) {
    if (stage > 9 || BG[stage] !== undefined) return;
    BG[stage] = null; const im = new Image(); im.onload = () => { BG[stage] = makeSeamless(im); }; im.src = `assets/bg/stage${stage}.jpg`;
}
function fitDraw(ctx, img, box) {
    const k = Math.min(box / img.width, box / img.height), w = img.width * k, h = img.height * k;
    ctx.drawImage(img, -w / 2, -h / 2, w, h);
}

// 大廳／商店／結算維持原本的合成神秘音樂；某一關缺檔時，該關也會自動退回合成音樂。
const STAGE_MUSIC = {};
for (let i = 1; i <= 9; i++) STAGE_MUSIC[i] = `assets/music/stage${i}.mp3`;
const music = {
    cur: null, curStage: 0, vol: 0.4, cache: {},
    fade(a, to, done) {
        clearInterval(a._f);
        a._f = setInterval(() => {
            const d = to - a.volume;
            if (Math.abs(d) < 0.03) { a.volume = to; clearInterval(a._f); if (done) done(); }
            else a.volume = Math.min(1, Math.max(0, a.volume + Math.sign(d) * 0.03));
        }, 40);
    },
    stopFile() { const a = this.cur; this.cur = null; this.curStage = 0; if (a) this.fade(a, 0, () => a.pause()); },
    play(stage) {
        if (this.curStage === stage) return;           // 同一關的子關卡不重播
        this.stopFile(); this.curStage = stage; sfx.stopSpaceBGM();
        let a = this.cache[stage];
        if (!a) { a = new Audio(STAGE_MUSIC[stage]); a.loop = true; a.preload = 'auto'; this.cache[stage] = a; }
        const fallback = () => { if (this.cur === a) { this.cur = null; sfx.startSpaceBGM(); } };
        a.onerror = fallback;
        this.cur = a; a.currentTime = 0; a.volume = 0;
        a.play().then(() => this.fade(a, this.vol)).catch(fallback);
    },
    toLobby() { if (this.curStage === 0) return; this.stopFile(); sfx.startSpaceBGM(); },
    pause(b) { if (!this.cur) return; if (b) this.cur.pause(); else this.cur.play().catch(() => {}); }
};

class Vec2 { constructor(x, y) { this.x = x; this.y = y; } }

class ObjectPool {
    constructor(createFn, size = 150) {
        this.pool = []; this.createFn = createFn;
        for (let i = 0; i < size; i++) this.pool.push(createFn());
    }
    get() {
        let obj = this.pool.find(o => !o.active);
        if (!obj) { obj = this.createFn(); this.pool.push(obj); }
        obj.active = true; obj.homing = false; return obj;
    }
}

class Entity {
    constructor() { this.pos = new Vec2(0, 0); this.vel = new Vec2(0, 0); this.radius = 10; this.active = false; this.color = "#fff"; }
    update(dt) { this.pos.x += this.vel.x * dt; this.pos.y += this.vel.y * dt; }
    draw(ctx) {
        ctx.save(); ctx.shadowBlur = 10; ctx.shadowColor = this.color; ctx.fillStyle = this.color;
        ctx.beginPath(); ctx.arc(this.pos.x, this.pos.y, this.radius, 0, Math.PI * 2); ctx.fill(); ctx.restore();
    }
}

class Bullet extends Entity { constructor() { super(); this.isPlayer = false; this.damage = 1; } }

class FloatingText {
    constructor() { this.active = false; this.pos = new Vec2(0,0); this.text = ""; this.life = 0; this.color = "#fff"; }
    update(dt) { this.pos.y -= 50 * dt; this.life -= dt; if(this.life <= 0) this.active = false; }
    draw(ctx) {
        ctx.save(); ctx.globalAlpha = Math.max(0, this.life); ctx.fillStyle = this.color;
        ctx.font = "bold 16px Arial"; ctx.fillText(this.text, this.pos.x, this.pos.y); ctx.restore();
    }
}

// Boss 程式碼保持一致
class Boss extends Entity {
    constructor(stage) {
        super();
        this.stage = stage;
        this.maxHp = stage === 9 ? 5000 : 150 + (stage - 1) * 350;
        this.hp = this.maxHp;
        this.radius = 45;
        this.color = stage === 9 ? "#ff00ff" : "#ff3333";
        this.pos = new Vec2(window.innerWidth / 2, -100);
        this.targetY = 120;
        this.shootTimer = 0;
        this.meteorTimer = 0;
        this.pattern = stage % 4;
        this.angle = 0;
        this.dmReward = stage * 100; this.cfg = BOSS_CFG[stage] || BOSS_CFG[1]; this.volley = 0;
        const hasImg = !!(IMG['boss_' + stage] || IMG.boss);
        this.size = hasImg ? Math.min(260, window.innerWidth * 0.55) : 110;
        if (hasImg) { this.radius = this.size * 0.28; this.targetY = this.size * 0.5 + 30; }
        this.type = BOSS_TYPES[stage] || 'TANK';
        const M = { GLASS:[0.45, 2.2, 1.4], TANK:[1.5, 1.0, 1.0], BARRAGE:[1.0, 1.0, 0.55], FINAL:[1.0, 1.3, 0.9] }[this.type];   // [血量倍率, 子彈傷害倍率, 射擊間隔倍率]
        this.maxHp = Math.round(this.maxHp * M[0]); this.hp = this.maxHp; this.dmgMul = M[1]; this.rateMul = M[2];
    }

    move(dt, W, t, pp) {
        const m = this.cfg.mv, cx = W / 2, sp = 90 + this.stage * 18;
        if (m === 'sweep') this.pos.x = cx + Math.sin(t / 1500) * W / 3;
        else if (m === 'hover') { this.pos.x = cx + Math.sin(t / 2500) * W / 7; this.pos.y = this.targetY + Math.sin(t / 900) * 25; }
        else if (m === 'orbit') { this.pos.x = cx + Math.cos(t / 1300) * W / 3; this.pos.y = this.targetY + 40 + Math.sin(t / 1300) * 55; }
        else if (m === 'chase') this.pos.x += Math.sign(pp.x - this.pos.x) * Math.min(Math.abs(pp.x - this.pos.x), sp * 1.1 * dt);
        else if (m === 'zigzag') { this.zz = this.zz || 1; this.pos.x += this.zz * sp * 2.2 * dt; if (this.pos.x > W - 80) this.zz = -1; if (this.pos.x < 80) this.zz = 1; }
        else if (m === 'dash') {
            this.dashT = (this.dashT || 0) - dt;
            if (this.dashT <= 0) { this.dashX = 80 + Math.random() * (W - 160); this.dashT = 2.2; }

    }

            case 'burst':  for (let i = -2; i <= 2; i++) fire(D + i * 0.28, sp, '#ff6666'); break;
            case 'ring':   for (let i = 0; i < 8; i++) fire(i / 8 * Math.PI * 2 + this.angle, sp * 0.9, '#ff33aa'); break;

                }

            }
        }
    }

    draw(ctx) {
        ctx.save(); ctx.translate(this.pos.x, this.pos.y); ctx.rotate(this.angle * 0.5);

            const a = (i / sides) * Math.PI * 2 + (Math.PI / sides);

            if(i===0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
        }
        ctx.closePath(); ctx.fill(); ctx.restore();
        ctx.save(); ctx.fillStyle = "#ffffff"; ctx.shadowBlur = 10; ctx.shadowColor = this.color;
        ctx.textAlign = "center"; ctx.font = "bold 20px Arial"; ctx.fillText("BOSS・" + BOSS_INFO[this.type].name, this.pos.x, this.pos.y + this.radius + 30);
        ctx.restore();
    }
}

                    </div>
                    <div class="tile" style="--a:#2b3a67;--b:#4b5b8f;--d:.24s" onclick="game.openSettings()"><h4>設定</h4><small>[O]</small><span class="ico">⚙</span></div>
                    <div class="tile pic w2" style="--d:.32s;background-image:linear-gradient(rgba(0,0,10,.55),rgba(0,0,10,.55)),url(assets/bg/stage${this.startStage}.jpg);">
                        <h4>起始關卡</h4>
                        <div class="stg"><button onclick="event.stopPropagation();game.changeStart(-1)">◀</button><b>第 ${this.startStage} 關</b><button onclick="event.stopPropagation();game.changeStart(1)">▶</button></div>
                        <small>←／→ 切換（最高解鎖第 ${this.bestStage} 關）</small>
                    </div>
                    <div class="tile live w2" style="--a:#ff3366;--b:#7a0f2a;--d:.4s" onclick="game.equip('${rec.ship.id}')">
                        <div class="f1"><h4>Boss：${info.name}型</h4><small>${info.desc}</small></div>
                        <div class="f2"><h4>推薦：${rec.ship.name}</h4><small>${ok ? '目前戰機很適合' : '點此或按 [R] 一鍵換裝'}</small>${rec.ideal ? `<small>商店有更合適的 ${rec.ideal.name}</small>` : ''}</div>
                    </div>
                </div>
                <div class="roster">各關 Boss：${roster}</div>
            </div>`;
    }

    renderHangar() {
        const KS = [['dmg', '火力'], ['rate', '射速'], ['hp', '裝甲'], ['spd', '機動']];
        const cards = SHIPS.map((S, i) => {
            const F = this.fleet[S.id], st = this.statsOf(S.id), own = F.own;
            const val = { dmg: st.dmg.toFixed(1), rate: (1000 / st.iv).toFixed(1) + '/秒', hp: Math.round(st.hp), spd: Math.round(st.spd) };
            const rows = KS.map(([k, n], j) => {
                const lv = F[k], max = S.cap[k], cost = (lv + 1) * 80, full = lv >= max;
                return `<div class="st"><span>${n}</span><div class="bar" style="background:linear-gradient(90deg,#2a2f4a ${max / 16 * 100}%,#0b0b14 0);"><i style="width:${lv / 16 * 100}%;"></i></div><b>${val[k]}</b>${own ? `<button ${full || this.darkMatter < cost ? 'disabled' : ''} onclick="event.stopPropagation();game.upgrade('${S.id}','${k}')">[${j + 1}] ${full ? 'MAX' : cost}</button>` : ''}</div>`;
            }).join('');
            const img = S.id === 'star' ? 'assets/player.png' : `assets/ship_${S.id}.png`;
            return `<div class="card ${i === this.hIdx ? 'sel' : ''} ${S.id === this.shipId ? 'eq' : ''} ${own ? '' : 'locked'}" onclick="game.hSel(${i})">
                <img src="${img}" onerror="this.style.visibility='hidden'"><h3 style="color:${S.c};">${S.name}</h3><div style="font-size:0.8rem;color:#aaa;">${S.role}　等級上限 火${S.cap.dmg}/速${S.cap.rate}/甲${S.cap.hp}/動${S.cap.spd}</div>
                ${own ? rows : `<div class="st" style="color:var(--neon-gold);">尚未擁有・商店 ${S.price} DM</div>${rows}`}</div>`;
        }).join('');
        this.uiLayer.innerHTML = `
            <div class="menu-overlay" style="width:min(96vw,1100px);max-width:none;">
                <h2 class="shop-title" style="margin-bottom:4px;">戰機管理</h2>
                <p style="color:var(--neon-purple); margin:4px 0;">持有暗物質: <b>${this.darkMatter} DM</b>　<small style="color:#aaa;">←／→ 選卡　1~4 升級　Enter 出戰　Esc 返回</small></p>
                <div class="cards">${cards}</div>
                <button class="btn btn-shop" onclick="game.hEquip()">設為出戰戰機 [Enter]</button>
                <button class="btn btn-start" style="margin-top:6px;" onclick="game.setState('LOBBY')">返回大廳 [Esc]</button>
            </div>`;
    }

    shopRows() {
        const rows = [];
        SHIPS.forEach(X => {
            const o = this.fleet[X.id].own, c = X.cap;
            rows.push({ t: `${X.name}｜${X.role}`, dis: o || this.darkMatter < X.price,
                sub: `${o ? '已擁有（到「戰機管理」升級／出戰）' : X.price + ' DM'}・上限 火${c.dmg} 速${c.rate} 甲${c.hp} 動${c.spd}`,
                run: () => { this.darkMatter -= X.price; this.fleet[X.id].own = true; } });
        });
        [['成語列', '同時收集的成語數', this.maxSlots, 6, this.maxSlots * 50, () => { this.maxSlots++; this.fillEmptySlots(); }],
         ['磁吸字塊', '字塊自動吸附範圍', this.magnetLvl, 5, (this.magnetLvl + 1) * 200, () => this.magnetLvl++],
         ['暗物質回收', '暗物質獲得 +20%', this.dmLvl, 5, (this.dmLvl + 1) * 250, () => this.dmLvl++]].forEach(([n, d, lv, max, cost, f]) => {
            rows.push({ t: `${n} Lv.${lv}/${max}`, dis: lv >= max || this.darkMatter < cost, sub: lv >= max ? '已滿級' : `${d}・${cost} DM`, run: () => { this.darkMatter -= cost; f(); } });
        });
        return rows;
    }

    renderShop() {
        const heads = { 0: '戰機（購買後到「戰機管理」升級與出戰）', 5: '全體升級' };
        const html = this.shopRows().map((r, i) => `${heads[i] ? `<div style="color:var(--neon-gold);margin-top:8px;font-size:0.9rem;">${heads[i]}</div>` : ''}<button class="btn btn-shop" style="font-size:0.85rem;padding:5px;margin:4px auto;" ${r.dis ? 'disabled' : ''} onclick="game.buyItem(${i})">[${i + 1}] ${r.t}<br><small>${r.sub}</small></button>`).join('');
        this.uiLayer.innerHTML = `
            <div class="menu-overlay">
                <h2 class="shop-title" style="margin-bottom:5px;">暗物質軍械庫</h2>
                <p style="font-size:1.1rem; color:var(--neon-purple); margin:4px 0;">持有暗物質: <b>${this.darkMatter} DM</b></p>
                ${html}
                <button class="btn btn-start" style="margin-top:10px;" onclick="game.setState('LOBBY')">返回大廳 [Esc]</button>
            </div>`;
    }

    buyItem(i) {
        const r = this.shopRows()[i];
        if (!r || r.dis) return;
        r.run(); this.applyUpgrades(); sfx.playReady(); this.save(); this.renderShop();
    }

    save() {
        try { localStorage.setItem('idiomShooterSave', JSON.stringify({ dm:this.darkMatter, s:this.maxSlots, m:this.magnetLvl, d:this.dmLvl, f:this.fleet, i:this.shipId, b:this.bestStage, t:this.startStage })); } catch (err) {}
    }
    load() {
        try {
            const v = JSON.parse(localStorage.getItem('idiomShooterSave') || 'null'); if (!v) return;
            this.darkMatter = v.dm || 0; this.maxSlots = v.s || 3; this.magnetLvl = v.m || 0; this.dmLvl = v.d || 0;
            this.bestStage = Math.min(9, v.b || 1); this.startStage = Math.min(v.t || 1, this.bestStage);
            if (v.f) { SHIPS.forEach(S => { if (v.f[S.id]) Object.assign(this.fleet[S.id], v.f[S.id]); }); if (this.fleet[v.i] && this.fleet[v.i].own) this.shipId = v.i; }
            else { const f = this.fleet.star; f.dmg = Math.min(v.w || 1, 8); f.hp = Math.min(v.h || 0, 8); f.spd = Math.min(v.e || 0, 8); }   // 舊版存檔轉入星藍號
            SHIPS.forEach(S => ['dmg', 'rate', 'hp', 'spd'].forEach(k => { this.fleet[S.id][k] = Math.min(this.fleet[S.id][k], S.cap[k]); }));
        } catch (err) {}
    }

    startNewGame() {
        sfx.init(); this.applyUpgrades(); this.shield = 0; this.pierceTimer = 0; this.missileTimer = 0; this.currentStage = Math.min(this.startStage, this.bestStage); this.currentSub = 1; this.score = 0; 
        this.hp = this.maxHp; this.slots = []; 
        this.fillEmptySlots(); // 遊戲開始時塞滿隨機成語任務
        this.resetStage(); this.setState('PLAYING');
    }

    fillEmptySlots() {
        while (this.slots.length < this.maxSlots) {
            const rand = this.pickIdiom();
            this.slots.push({ type: 'COLLECTING', word: rand.word, chars: [], effect: rand.effect, effectDesc: rand.desc });
        }
    }

    resetStage() {
        this.boss = null;
        this.enemies = []; this.idiomBlocks = []; this.charItems = [];
        this.player.pos = new Vec2(window.innerWidth / 2, window.innerHeight - 150);
        this.bullets.pool.forEach(b => b.active = false);
        this.pointerActive = false; 
        document.getElementById('boss-bar').style.display = 'none';
        
        if (this.currentSub < 3) {
            this.waveQuota = 3 + (this.currentStage - 1) * 3 + (this.currentSub - 1) * 2;
            this.enemiesSpawned = 0;
            this.enemySpawnTimer = 0;
        } else {
            this.waveQuota = 0;
        }
        this.idiomBlockTimer = 0;
        this.showFloatText(this.currentSub === 3 ? "WARNING: " + BOSS_INFO[BOSS_TYPES[this.currentStage] || "TANK"].name + " BOSS" : `區塊 ${this.currentStage}-${this.currentSub} 開始`, window.innerWidth/2, window.innerHeight/2, "#ffea00");
    }

    startTransition(isNextStage) {
        this.gameState = 'TRANSITION'; this.transitionTimer = 0; this.isNextStage = isNextStage;
        this.bullets.pool.forEach(b => b.active = false); this.enemies = []; this.idiomBlocks = []; this.charItems = [];
        sfx.playTransition();
        this.showFloatText(isNextStage ? "STAGE CLEAR" : "WAVE CLEARED", window.innerWidth/2, window.innerHeight/2 - 50, "#00f2ff");
    }

    renderIdiomSlots() {
        if(this.gameState !== 'PLAYING' && this.gameState !== 'TRANSITION') return;
        const container = document.getElementById('idiom-ui'); container.innerHTML = '';
        for (let i = 0; i < this.maxSlots; i++) {
            const slot = this.slots[i]; const div = document.createElement('div');
            if (slot) {
                // 產生每個字元的 HTML 結構
                let charsHTML = slot.word.split('').map(c => 
                    `<span class="char ${slot.chars.includes(c) ? 'collected' : 'uncollected'}">${c}</span>`
                ).join('');

                if (slot.type === 'READY') {
                    div.className = 'slot ready'; 
                    div.innerHTML = `<div class="slot-title">${charsHTML}</div><span class="slot-key">${i + 1}</span><div class="slot-subtitle">按 ${i + 1} 發動<br>(${slot.effectDesc})</div>`;
                    div.onclick = (e) => { e.stopPropagation(); this.useIdiom(i); };
                    div.ontouchstart = (e) => { e.stopPropagation(); e.preventDefault(); this.useIdiom(i); };
                } else if (slot.type === 'COLLECTING') {
                    div.className = 'slot collecting';
                    div.innerHTML = `<div class="slot-title">${charsHTML}</div><span class="slot-key">${i + 1}</span><div class="slot-subtitle">${slot.effectDesc}</div>`;
                }
            }
            container.appendChild(div);
        }
    }

    useIdiom(index) {
        const idiom = this.slots[index];
        if (!idiom || idiom.type !== 'READY' || this.paused || this.casting) return;
        const r = this.pickIdiom();
        this.slots[index] = { type: 'COLLECTING', word: r.word, chars: [], effect: r.effect, effectDesc: r.desc };
        this.renderIdiomSlots();
        this.startCast({ word: idiom.word, effect: idiom.effect, desc: idiom.effectDesc });
    }

    startCast(idiom) {
        this.casting = { idiom, t: 3 }; sfx.playIdiomCast();
        const info = IDIOM_INFO[idiom.word] || ['', ''];
        let p = document.getElementById('idiom-popup');
        if (!p) { p = document.createElement('div'); p.id = 'idiom-popup'; document.getElementById('game-container').appendChild(p); }
        p.innerHTML = `<div class="ip-word">${idiom.word}</div><div class="ip-effect">大招效果：${idiom.desc}</div><div class="ip-line"><b>意思</b>　${info[0]}</div><div class="ip-line"><b>造句</b>　${info[1]}</div><div class="ip-bar"><i></i></div>`;
        p.style.display = 'block';
    }

    endCast() { this.casting = null; const p = document.getElementById('idiom-popup'); if (p) p.style.display = 'none'; }

    finishCast() {
        const idiom = this.casting.idiom; this.endCast();
        sfx.playIdiomFire(idiom.effect);
        this.showFloatText(`發動！${idiom.word}！`, this.player.pos.x, this.player.pos.y - 40, '#ffea00');
        if (idiom.effect === 'BOMB_BOOST') this.triggerBomb();
        if (idiom.effect === 'INVINCIBLE') this.invincibleTimer = 10;
        
        if (idiom.effect === 'LASER_BEAM') this.triggerLaser();
        if (idiom.effect === 'SHIELD') { this.shield = Math.min(this.maxHp, this.shield + 50); this.showFloatText('護盾 +50', this.player.pos.x, this.player.pos.y - 70, '#4dd2ff'); }
        if (idiom.effect === 'PIERCE') this.pierceTimer = 30;
        if (idiom.effect === 'MISSILE') { this.missileTimer = 10; this.missileCd = 0; }
        if (idiom.effect === 'HEAL') { this.hp = Math.min(this.maxHp, this.hp + 30); this.updateHUD(); }
        if (idiom.effect === 'SLOW_TIME') this.slowTimer = 6;
    }

    triggerBomb() {
        this.bullets.pool.forEach(b => { if(!b.isPlayer) b.active = false; });
        if (this.boss) { const d = Math.min(300, this.boss.maxHp * 0.25); this.dmgEnt(this.boss, d); this.showFloatText(`Boss -${Math.round(d)}`, this.boss.pos.x, this.boss.pos.y + 70, '#ff3366'); }
        this.shock = { t: 0, x: this.player.pos.x, y: this.player.pos.y };
        for (let i = 0; i < 24; i++) this.burst(Math.random() * window.innerWidth, Math.random() * window.innerHeight, 8);
        this.enemies.forEach(e => { this.dropDarkMatter(e.pos.x, e.pos.y, e.maxHp * 2); sfx.playExplosion(); });
        this.enemies = []; this.showFloatText("全螢幕爆破!", window.innerWidth/2, window.innerHeight/2, "#ff00ff");
    }
    triggerLaser() { this.laserTimer = 3.0; }

    showFloatText(text, x, y, color = "#fff") { const t = this.texts.get(); t.pos = new Vec2(x, y); t.text = text; t.color = color; t.life = 1.5; }
    dropDarkMatter(x, y, amount) { amount = Math.round(amount * (1 + 0.2 * this.dmLvl) * (1 + 0.25 * (this.currentStage - 1))); this.burst(x, y, amount >= 20 ? 18 : 4); this.darkMatter += amount; this.showFloatText(`+${amount} DM`, x, y, "#b026ff"); this.updateHUD(); }

    updateHUD() {
        if(this.gameState !== 'PLAYING' && this.gameState !== 'TRANSITION') return;
        document.getElementById('dm-val').innerText = this.darkMatter;
        document.getElementById('lvl-val').innerText = this.currentStage === 9 ? "FINAL BOSS" : `${this.currentStage}-${this.currentSub}`;
    }

    loop(timestamp) {
        const dt = Math.min((timestamp - this.lastTime) / 1000, 0.1); this.lastTime = timestamp;
        if (this.gameState === 'PLAYING') { if (!this.paused) { if (this.casting) { this.casting.t -= dt; if (this.casting.t <= 0) this.finishCast(); } else this.update(dt); } } else if (this.gameState === 'TRANSITION') this.updateTransition(dt);
        this.draw(); requestAnimationFrame((t) => this.loop(t));
    }

    updateTransition(dt) {
        this.transitionTimer += dt;
        if (this.transitionTimer > 1.0 && this.transitionTimer <= 2.0) this.player.pos.y -= 1000 * dt; 
        if (this.transitionTimer > 2.0) {
            if (this.isNextStage) {
                if (this.currentStage < CONFIG.MAX_STAGES) { this.currentStage++; this.currentSub = 1; } 
                else if (this.currentStage === 8) { this.currentStage = 9; this.currentSub = 1; } 
                else { this.setState('VICTORY'); return; }
            } else { this.currentSub++; }
            this.resetStage(); this.setState('PLAYING'); this.updateHUD();
        }
        this.texts.pool.forEach(t => { if(t.active) t.update(dt); });
    }

    spawnEnemy() {
        const diff = this.currentStage + this.currentSub;
        const t = (this.currentStage - 1) + (this.currentSub - 1) * 0.3;
        const angle = Math.random() * Math.PI * 2; 
        let eType = 'SCOUT'; 
        let r = Math.random();
        
        if (this.currentStage > 2) { if (r > 0.8) eType = 'TANK'; else if (r > 0.4) eType = 'FIGHTER'; } 
        else if (this.currentStage > 1) { if (r > 0.6) eType = 'FIGHTER'; } 
        else if (this.currentSub > 1 && r > 0.85) eType = 'FIGHTER';

        let speed, maxHp, radius, color, shootInterval;
        if (eType === 'SCOUT') { speed = 50 + t * 28; maxHp = 1.5 + t * 1.4; radius = 14; color = "#00ffcc"; shootInterval = Math.max(2.5, 6.0 - t * 0.45); } 
        else if (eType === 'FIGHTER') { speed = 40 + t * 18; maxHp = 3 + t * 3.2; radius = 20; color = "#ffaa00"; shootInterval = Math.max(1.2, 4.0 - t * 0.35); } 
        else if (eType === 'TANK') { speed = 25 + t * 8; maxHp = 10 + t * 7; radius = 30; color = "#ff3366"; shootInterval = Math.max(0.8, 3.0 - t * 0.25); }

        this.enemies.push({ 
            type: eType, pos: new Vec2(Math.random() * (window.innerWidth - 60) + 30, -30), 
            vel: new Vec2(Math.cos(angle)*speed, Math.sin(angle)*speed), 
            hp: maxHp, maxHp: maxHp, radius: radius, color: color, diff: diff,
            shootTimer: Math.random() * shootInterval, shootInterval: shootInterval 
        });
    }

    update(dt) {
        const spd = this.player.speed * ((this.keys['ShiftLeft'] || this.keys['ShiftRight']) ? 0.45 : 1);
        // 鍵盤（斜向也不會變快）與拖曳使用同一個移動速度
        const kx = ((this.keys['KeyD'] || this.keys['ArrowRight']) ? 1 : 0) - ((this.keys['KeyA'] || this.keys['ArrowLeft']) ? 1 : 0);
        const ky = ((this.keys['KeyS'] || this.keys['ArrowDown']) ? 1 : 0) - ((this.keys['KeyW'] || this.keys['ArrowUp']) ? 1 : 0);
        const kl = Math.hypot(kx, ky) || 1;
        this.player.pos.x += kx / kl * spd * dt; this.player.pos.y += ky / kl * spd * dt;
        if (!this.pointerActive) this.dragTarget = null;
        if (this.dragTarget) {
            const ex = this.dragTarget.x - this.player.pos.x, ey = this.dragTarget.y - this.player.pos.y, d = Math.hypot(ex, ey), step = spd * dt;
            if (d <= step) { this.player.pos.x = this.dragTarget.x; this.player.pos.y = this.dragTarget.y; }
            else { this.player.pos.x += ex / d * step; this.player.pos.y += ey / d * step; }
        }
        
        this.player.pos.x = Math.max(20, Math.min(window.innerWidth - 20, this.player.pos.x));
        this.player.pos.y = Math.max(20, Math.min(window.innerHeight - 20, this.player.pos.y));

        const fireRate = this.player.rapidFire > 0 ? Math.min(50, this.st.interval) : this.st.interval;
        if (Date.now() - this.player.lastShoot > fireRate) {
            const dmg = this.st.dmg;
            const shootBullet = (offset, angle) => {
                const b = this.bullets.get(); b.pos = new Vec2(this.player.pos.x + offset, this.player.pos.y - 25);
                b.vel = new Vec2(Math.sin(angle)*800, -Math.cos(angle)*800);
                b.color = SKINS[this.skin].c; b.isPlayer = true; b.radius = 4 + (this.weaponLvl * 0.5); b.damage = dmg;
            };
            shootBullet(0, 0); 
            if (this.weaponLvl >= 3 || this.player.spreadFire > 0) { shootBullet(-15, -0.15); shootBullet(15, 0.15); }
            if (this.weaponLvl >= 6 || this.player.spreadFire > 0) { shootBullet(-25, -0.3); shootBullet(25, 0.3); }
            if (this.player.spreadFire > 0) { shootBullet(-35, -0.45); shootBullet(35, 0.45); }
            this.player.lastShoot = Date.now(); sfx.playShoot(this.player.spreadFire > 0 ? 2 : this.player.rapidFire > 0 ? 1 : 0);
        }

        if (!this.boss) {
            if (this.currentSub < 3) {
                if (this.enemiesSpawned < this.waveQuota) {
                    this.enemySpawnTimer -= dt;
                    const maxOnScreen = Math.min(8, 2 + Math.floor(this.currentStage * 0.6));
                    if (this.enemySpawnTimer <= 0 && this.enemies.length < maxOnScreen) {
                        this.spawnEnemy(); this.enemiesSpawned++; this.enemySpawnTimer = Math.max(0.5, 2.0 - this.currentStage * 0.15); 
                    }
                } else if (this.enemies.length === 0) { this.startTransition(false); }
            } else {
                this.boss = new Boss(this.currentStage); document.getElementById('boss-bar').style.display = 'block'; sfx.playReady();
            }
        }

        // 掉落成語字塊：分析當前需要哪些字，提高掉落機率
        this.idiomBlockTimer += dt;
        if (this.idiomBlockTimer > 2.0) { // 稍微加快掉落速度
            if (Math.random() < 0.7) this.spawnIdiomBlock(Math.random() * (window.innerWidth-60) + 30, -50);
            this.idiomBlockTimer = 0;
        }

        if (this.boss) {
            this.boss.update(dt, this.player.pos, () => { const b = this.bullets.get(); b.damage = this.boss.dmgMul; b.radius = 6; return b; }, (x,y) => this.spawnIdiomBlock(x,y));
            document.getElementById('boss-hp-fill').style.width = (this.boss.hp / this.boss.maxHp * 100) + "%";
            if (this.boss.hp <= 0) {
                this.dropDarkMatter(this.boss.pos.x, this.boss.pos.y, this.boss.dmReward);
                sfx.playExplosion(); this.boss = null; this.startTransition(true);
            }
        }

        this.enemies.forEach((e, i) => {
            const sdt = this.slowTimer > 0 ? dt * 0.4 : dt; e.pos.x += e.vel.x * sdt; e.pos.y += e.vel.y * sdt;
            if (e.pos.x < e.radius) { e.pos.x = e.radius; e.vel.x = Math.abs(e.vel.x); }
            if (e.pos.x > window.innerWidth - e.radius) { e.pos.x = window.innerWidth - e.radius; e.vel.x = -Math.abs(e.vel.x); }
            if (e.pos.y < e.radius) { e.pos.y = e.radius; e.vel.y = Math.abs(e.vel.y); }
            if (e.pos.y > window.innerHeight - e.radius) { e.pos.y = window.innerHeight - e.radius; e.vel.y = -Math.abs(e.vel.y); }

            e.shootTimer += dt;
            if (e.shootTimer > e.shootInterval) {
                e.shootTimer = 0; const b = this.bullets.get(); b.pos = new Vec2(e.pos.x, e.pos.y + e.radius);
                const angleToPlayer = Math.atan2(this.player.pos.y - e.pos.y, this.player.pos.x - e.pos.x);
                const bulletSpeed = 70 + this.currentStage * 14;
                
                if (e.type === 'TANK') {
                    const b2 = this.bullets.get(); b2.pos = new Vec2(e.pos.x - 10, e.pos.y + e.radius); b.pos.x += 10;
                    b.vel = new Vec2(Math.cos(angleToPlayer) * bulletSpeed, Math.sin(angleToPlayer) * bulletSpeed); 
                    b2.vel = new Vec2(Math.cos(angleToPlayer) * bulletSpeed, Math.sin(angleToPlayer) * bulletSpeed); 
                    b.color = b2.color = e.color; b.isPlayer = b2.isPlayer = false; b.radius = b2.radius = 6; b.damage = b2.damage = 2;
                } else {
                    b.vel = new Vec2(Math.cos(angleToPlayer) * bulletSpeed, Math.sin(angleToPlayer) * bulletSpeed); 
                    b.color = e.color; b.isPlayer = false; b.radius = 4; b.damage = 1;
                }
                sfx.playEnemyShoot();
            }

            if (Math.hypot(e.pos.x - this.player.pos.x, e.pos.y - this.player.pos.y) < e.radius + this.player.radius && this.invincibleTimer <= 0) {
                this.hurt(e.type === 'TANK' ? 25 : 15); this.invincibleTimer = 1.0; sfx.playHit(); this.updateHUD(); if(this.hp<=0) this.setState('GAMEOVER');
            }
        });

        this.bullets.pool.forEach(b => {
            if (b.active) {
                if (b.homing) this.steer(b, dt);
                b.update(!b.isPlayer && this.slowTimer > 0 ? dt * 0.4 : dt);
                if (b.pos.y < -50 || b.pos.y > window.innerHeight + 50 || b.pos.x < -50 || b.pos.x > window.innerWidth+50) b.active = false;
                
                if (b.isPlayer) {
                    if (this.boss && Math.hypot(b.pos.x - this.boss.pos.x, b.pos.y - this.boss.pos.y) < this.boss.radius) {
                        this.dmgEnt(this.boss, b.damage); b.active = false; sfx.playHit();
                    }
                    this.enemies.forEach((e, i) => {
                        if (Math.hypot(b.pos.x - e.pos.x, b.pos.y - e.pos.y) < e.radius) {
                            this.dmgEnt(e, b.damage); b.active = false; sfx.playHit();
                            if(e.hp<=0) { this.dropDarkMatter(e.pos.x, e.pos.y, e.maxHp * 1.5); sfx.playExplosion(); this.enemies.splice(i, 1); }
                        }
                    });
                    this.idiomBlocks.forEach((m, i) => {
                        if (Math.hypot(b.pos.x - m.pos.x, b.pos.y - m.pos.y) < m.radius) {
                            m.hp -= b.damage; b.active = false; sfx.playHit();
                            if(m.hp<=0) {
                                this.charItems.push({ pos: new Vec2(m.pos.x, m.pos.y), char: m.char });
                                sfx.playExplosion(); this.idiomBlocks.splice(i, 1);
                            }
                        }
                    });
                } else {
                    if (Math.hypot(b.pos.x - this.player.pos.x, b.pos.y - this.player.pos.y) < this.player.radius && this.invincibleTimer <= 0) {
                        this.hurt(b.damage * 10); b.active = false; this.invincibleTimer = 0.5; sfx.playHit(); this.updateHUD(); if(this.hp<=0) this.setState('GAMEOVER');
                    }
                }
            }
        });

        this.idiomBlocks.forEach((m, i) => {
            m.pos.y += 60 * dt; 
            if (m.pos.y > window.innerHeight + m.radius) this.idiomBlocks.splice(i, 1);
        });

        this.charItems.forEach((c, i) => {
            c.pos.y += 120 * dt; 
            const cd = Math.hypot(c.pos.x - this.player.pos.x, c.pos.y - this.player.pos.y);
            if (this.magnetLvl > 0 && cd > 1 && cd < 100 + this.magnetLvl * 40) { c.pos.x += (this.player.pos.x - c.pos.x) / cd * 300 * dt; c.pos.y += (this.player.pos.y - c.pos.y) / cd * 300 * dt; }
            if (cd < 40 + this.magnetLvl * 10) {
                this.collectChar(c.char); this.charItems.splice(i, 1);
            }
        });

        if (this.laserTimer > 0) {
            if (this.boss && Math.abs(this.boss.pos.x - this.player.pos.x) < this.boss.radius + 25) this.dmgEnt(this.boss, 70 * dt);
            this.enemies.forEach((e, i) => {
                if (Math.abs(e.pos.x - this.player.pos.x) < 25 && e.pos.y < this.player.pos.y) {
                    this.dmgEnt(e, 50 * dt); if(e.hp<=0) { this.dropDarkMatter(e.pos.x, e.pos.y, e.maxHp*1.5); sfx.playExplosion(); this.enemies.splice(i, 1); }
                }
            });
            this.idiomBlocks.forEach((m, i) => {
                if (Math.abs(m.pos.x - this.player.pos.x) < 25 && m.pos.y < this.player.pos.y) {
                    m.hp -= 100 * dt; 
                    if(m.hp<=0) { this.charItems.push({ pos: new Vec2(m.pos.x, m.pos.y), char: m.char }); sfx.playExplosion(); this.idiomBlocks.splice(i, 1); }
                }
            });
        }

        this.texts.pool.forEach(t => { if(t.active) t.update(dt); });

        if (this.invincibleTimer > 0) this.invincibleTimer -= dt;
        if (this.slowTimer > 0) this.slowTimer -= dt;
        if (this.shock) { this.shock.t += dt; if (this.shock.t > 1.2) this.shock = null; }
        this.particles = this.particles.filter(p => (p.life -= dt) > 0);
        this.particles.forEach(p => { p.x += p.vx * dt; p.y += p.vy * dt; });
        if (this.player.rapidFire > 0) this.player.rapidFire -= dt;
        if (this.player.spreadFire > 0) this.player.spreadFire -= dt;
        if (this.laserTimer > 0) this.laserTimer -= dt;
        if (this.pierceTimer > 0) this.pierceTimer -= dt;
        if (this.missileTimer > 0) {   // 追蹤導彈：每 0.5 秒左右各一發，優先鎖定敵機／Boss，沒有敵機才打字卡
            this.missileTimer -= dt; this.missileCd -= dt;
            if (this.missileCd <= 0) {
                this.missileCd = 0.5;
                [-14, 14].forEach(ox => {
                    const b = this.bullets.get(); b.pos = new Vec2(this.player.pos.x + ox, this.player.pos.y - 10); b.vel = new Vec2(ox * 8, -260);
                    b.color = '#ff8844'; b.isPlayer = true; b.radius = 6; b.damage = this.st.dmg * 3 + 2; b.homing = true;
                });
                sfx.sweep('triangle', 500, 1300, 0.18, 0.05);
            }
        }
        this.updateBuffs();
    }

    handleKey(e) {
        const st = this.gameState;
        if (this.dlgOpen) { if (e.code === 'Escape' || e.code === 'KeyO') this.closeDlg(); else if ((e.code === 'Enter' || e.code === 'NumpadEnter') && this.dlgConfirm) this.dlgConfirm(); return; }
        if (st !== 'INIT' && e.code === 'KeyO') { this.openSettings(); return; }
        if (st === 'PLAYING' && e.code === 'KeyH') { this.goHome(); return; }
        const enter = e.code === 'Enter' || e.code === 'NumpadEnter' || e.code === 'Space';
        const m = /^(Digit|Numpad)(\d)$/.exec(e.code); const num = m ? parseInt(m[2]) : 0;
        if (st === 'INIT') { if (!/^(Shift|Control|Alt|Meta)/.test(e.code)) document.getElementById('boot-btn').click(); }
        else if (st === 'LOBBY') {
            if (enter) this.startNewGame();
            else if (e.code === 'KeyS') this.setState('SHOP');
            else if (e.code === 'KeyH') this.openHangar();
            else if (e.code === 'ArrowLeft' || e.code === 'KeyA') this.changeStart(-1);
            else if (e.code === 'ArrowRight' || e.code === 'KeyD') this.changeStart(1);
            else if (e.code === 'KeyR') this.equip(this.recommend(this.startStage).ship.id);
        }
        else if (st === 'HANGAR') {
            if (e.code === 'ArrowLeft' || e.code === 'KeyA') this.hSel((this.hIdx + SHIPS.length - 1) % SHIPS.length);
            else if (e.code === 'ArrowRight' || e.code === 'KeyD') this.hSel((this.hIdx + 1) % SHIPS.length);
            else if (num >= 1 && num <= 4) this.upgrade(SHIPS[this.hIdx].id, ['dmg', 'rate', 'hp', 'spd'][num - 1]);
            else if (enter || e.code === 'KeyE') this.hEquip();
            else if (e.code === 'Escape' || e.code === 'KeyB') this.setState('LOBBY');
        }
        else if (st === 'SHOP') { if (num >= 1) this.buyItem(num - 1); else if (e.code === 'Escape' || e.code === 'KeyB' || enter) this.setState('LOBBY'); } else if (st === 'GAMEOVER' || st === 'VICTORY') { if (enter) this.setState('LOBBY'); }
        else if (st === 'PLAYING') {
            if (this.casting) return;
            if (e.code === 'KeyP' || e.code === 'Escape' || (this.paused && enter)) { this.paused = !this.paused; music.pause(this.paused); }
            else if (!this.paused) {
                if (num >= 1) this.useIdiom(num - 1);
                else if (e.code === 'Space') { const i = this.slots.findIndex(x => x.type === 'READY'); if (i >= 0) this.useIdiom(i); }
            }
        }
    }

    pickIdiom() {
        const used = this.slots.map(x => x.word);
        const pool = CONFIG.IDIOMS.filter(i => !used.includes(i.word));
        return pool[Math.floor(Math.random() * pool.length)];
    }

    burst(x, y, n) {
        for (let i = 0; i < n; i++) {
            const a = Math.random() * Math.PI * 2, v = 60 + Math.random() * 200;
            this.particles.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: 0.6 + Math.random() * 0.4, color: ['#ffea00','#ffaa00','#ff3366','#ffffff'][i % 4] });
        }
    }

    // 智能掉落：高機率掉落目前需要的字元
    spawnIdiomBlock(x, y) {
        let neededChars = [];
        this.slots.forEach(slot => {
            if (slot.type === 'COLLECTING') {
                for (let char of slot.word) {
                    if (!slot.chars.includes(char)) neededChars.push(char);
                }
            }
        });

        let dropChar;
        if (neededChars.length > 0 && Math.random() < 0.8) {
            dropChar = neededChars[Math.floor(Math.random() * neededChars.length)];
        } else {
            const randomIdiom = CONFIG.IDIOMS[Math.floor(Math.random() * CONFIG.IDIOMS.length)];
            dropChar = randomIdiom.word[Math.floor(Math.random() * 4)];
        }

        this.idiomBlocks.push({ pos: new Vec2(x, y), radius: 25, hp: 6 + this.currentStage*2, char: dropChar, maxHp: 6 + this.currentStage*2 });
    }

    // 無序收集判定
    collectChar(char) {
        let collected = false;
        for (let slot of this.slots) {
            if (slot.type === 'COLLECTING' && slot.word.includes(char) && !slot.chars.includes(char)) {
                slot.chars.push(char);
                collected = true;
                sfx.playCollect();
                this.showFloatText(char, this.player.pos.x, this.player.pos.y - 20, '#00f2ff');

                if (slot.chars.length === 4) {
                    slot.type = 'READY';
                    sfx.playReady();
                    this.showFloatText(`${slot.word} 完成!`, this.player.pos.x, this.player.pos.y - 40, '#ffea00');
                }
                break; // 只要有一個槽位吸收了這個字就跳出
            }
        }

        if (!collected) {
            // 如果吸收的字目前不需要，轉換為暗物質
            this.dropDarkMatter(this.player.pos.x, this.player.pos.y, 10);
            this.showFloatText("轉換DM", this.player.pos.x, this.player.pos.y - 20, '#b026ff');
            sfx.playHit();
        }
        this.renderIdiomSlots();
    }

    draw() {
        const ctx = this.ctx;
        ctx.fillStyle = "#050510"; ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);
        const bg = BG[this.currentStage];
        if (bg && this.gameState !== 'LOBBY') {
            const W = this.canvas.width, H = this.canvas.height, h = Math.ceil(bg.height * W / bg.width);
            const off = (Date.now() / (this.gameState === 'TRANSITION' && this.transitionTimer > 1.0 ? 5 : 18)) % h;
            for (let y = off - h; y < H; y += h) ctx.drawImage(bg, 0, Math.floor(y), W, h + 1);
            ctx.fillStyle = 'rgba(0,0,8,0.22)'; ctx.fillRect(0, 0, W, H);
        }

        const starSpeed = this.gameState === 'TRANSITION' && this.transitionTimer > 1.0 ? 200 : 20;
        ctx.fillStyle = "rgba(255,255,255,0.5)";
        for(let i=0; i<40; i++) {
            const x = (Math.sin(i*99) + 1) / 2 * this.canvas.width;
            const y = (Date.now() / (1000/starSpeed) + i * 200) % this.canvas.height;
            ctx.fillRect(x, y, 2, 2);
        }

        if (this.gameState === 'PLAYING' || this.gameState === 'TRANSITION') {
            if (this.laserTimer > 0) {
                const laserWidth = 40 + Math.random() * 10;
                ctx.fillStyle = "rgba(255, 234, 0, 0.8)"; ctx.shadowBlur = 25; ctx.shadowColor = "#ffea00";
                ctx.fillRect(this.player.pos.x - laserWidth/2, 0, laserWidth, this.player.pos.y); ctx.shadowBlur = 0;
                ctx.fillStyle = "#ffffff"; ctx.fillRect(this.player.pos.x - laserWidth/4, 0, laserWidth/2, this.player.pos.y);
            }

            // 【全新：華麗星際戰機繪製】
            ctx.save();
            ctx.translate(this.player.pos.x, this.player.pos.y);
            ctx.scale(SKINS[this.skin].s, SKINS[this.skin].s);
            
            const isInv = this.invincibleTimer > 0;
            const shipImg = IMG['ship_' + SKINS[this.skin].id] || IMG.player;
            if (shipImg) {
                if (isInv) ctx.globalAlpha = 0.6 + 0.4 * Math.sin(Date.now() / 40);
                ctx.shadowColor = SKINS[this.skin].c; ctx.shadowBlur = 18; if (!IMG['ship_' + SKINS[this.skin].id]) ctx.filter = `hue-rotate(${SKINS[this.skin].h}deg)`; fitDraw(ctx, shipImg, shipImg.width / shipImg.height > 1.3 ? 118 : 96); ctx.restore();
            } else {
            const mainColor = isInv ? "#ffea00" : SKINS[this.skin].c;
            const hullColor = "#0f172a"; // 金屬暗灰
            
            ctx.shadowBlur = isInv ? 20 : 10;
            ctx.shadowColor = mainColor;

            // 引擎噴射火焰
            if (isInv || Math.floor(Date.now() / 50) % 2 === 0) {
                const flameLen = (this.gameState === 'TRANSITION' && this.transitionTimer > 1.0) ? 60 : 25 + Math.random() * 15;
                ctx.fillStyle = isInv ? "#ffffff" : "#ffaa00";
                ctx.shadowBlur = 20; ctx.shadowColor = "#ffaa00";
                
                // 左引擎
                ctx.beginPath(); ctx.moveTo(-12, 12); ctx.lineTo(-6, 12); ctx.lineTo(-9, 12 + flameLen); ctx.fill();
                // 右引擎
                ctx.beginPath(); ctx.moveTo(6, 12); ctx.lineTo(12, 12); ctx.lineTo(9, 12 + flameLen); ctx.fill();
            }

            ctx.shadowBlur = isInv ? 15 : 5;
            
            // 主機翼 (外展後掠翼)
            ctx.fillStyle = hullColor;
            ctx.strokeStyle = mainColor;
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(0, -10);
            ctx.lineTo(-30, 15); // 左翼尖
            ctx.lineTo(-30, 20);
            ctx.lineTo(-10, 10);
            ctx.lineTo(10, 10);
            ctx.lineTo(30, 20); // 右翼尖
            ctx.lineTo(30, 15);
            ctx.closePath();
            ctx.fill(); ctx.stroke();

            // 內側輔助翼
            ctx.beginPath();
            ctx.moveTo(0, -15);
            ctx.lineTo(-15, 5);
            ctx.lineTo(15, 5);
            ctx.closePath();
            ctx.fillStyle = "#1e293b";
            ctx.fill(); ctx.stroke();

            // 戰機機身 (流線型)
            ctx.beginPath();
            ctx.moveTo(0, -32); // 機鼻
            ctx.lineTo(-8, -5);
            ctx.lineTo(-8, 15); // 機尾
            ctx.lineTo(0, 18);
            ctx.lineTo(8, 15);
            ctx.lineTo(8, -5);
            ctx.closePath();
            ctx.fillStyle = hullColor;
            ctx.fill(); ctx.stroke();

            // 發光駕駛艙
            ctx.fillStyle = isInv ? "rgba(255, 234, 0, 0.9)" : mainColor;
            ctx.shadowBlur = 15;
            ctx.beginPath();
            ctx.moveTo(0, -18);
            ctx.lineTo(-4, -5);
            ctx.lineTo(0, 2);
            ctx.lineTo(4, -5);
            ctx.closePath();
            ctx.fill();
            
            ctx.restore();

            }
            if (this.boss) {
                const bimg = IMG['boss_' + this.boss.stage] || IMG.boss;
                if (bimg) { const R = this.boss.radius * 2; ctx.save(); ctx.shadowBlur = 25; ctx.shadowColor = this.boss.color; ctx.translate(this.boss.pos.x, this.boss.pos.y); fitDraw(ctx, bimg, this.boss.size);
                    ctx.fillStyle = '#fff'; ctx.font = "bold 18px 'Microsoft JhengHei'"; ctx.textAlign = 'center'; ctx.fillText('BOSS・' + BOSS_INFO[this.boss.type].name, 0, this.boss.size * 0.5 + 18); ctx.restore(); }
                else this.boss.draw(ctx);
            }
            this.bullets.pool.forEach(b => { if(b.active) b.draw(ctx); });
            
            const time = Date.now();
            this.enemies.forEach(e => {
                ctx.save();
                ctx.translate(e.pos.x, e.pos.y);
                const eimg = IMG[e.type.toLowerCase()];
                if (eimg) {
                    ctx.shadowBlur = 12; ctx.shadowColor = e.color; fitDraw(ctx, eimg, e.radius * 3.2);
                    
                    ctx.restore(); return;
                }
                const pulse = (Math.sin(time / 80) + 1) / 2;
                ctx.shadowBlur = 10 + pulse * 15; 
                ctx.shadowColor = e.color;
                ctx.strokeStyle = e.color; 
                ctx.fillStyle = "#111"; 
                
                ctx.beginPath();
                if (e.type === 'SCOUT') {
                    ctx.lineWidth = 2;
                    ctx.moveTo(0, e.radius); ctx.lineTo(e.radius, -e.radius); ctx.lineTo(0, -e.radius*0.5); ctx.lineTo(-e.radius, -e.radius);
                } else if (e.type === 'FIGHTER') {
                    ctx.lineWidth = 2;
                    ctx.moveTo(0, e.radius); ctx.lineTo(e.radius*0.8, e.radius*0.2); ctx.lineTo(e.radius*1.2, -e.radius*0.4); 
                    ctx.lineTo(e.radius*0.3, -e.radius*0.2); ctx.lineTo(e.radius*0.2, -e.radius*0.8); ctx.lineTo(-e.radius*0.2, -e.radius*0.8); 
                    ctx.lineTo(-e.radius*0.3, -e.radius*0.2); ctx.lineTo(-e.radius*1.2, -e.radius*0.4); ctx.lineTo(-e.radius*0.8, e.radius*0.2);
                } else if (e.type === 'TANK') {
                    ctx.lineWidth = 3 + pulse;
                    for(let i=0; i<=6; i++) {
                        const a = (i / 6) * Math.PI * 2 + (Math.PI/6);
                        const r = e.radius * (i%2===0 ? 1 : 0.8);
                        if(i===0) ctx.moveTo(Math.cos(a)*r, Math.sin(a)*r); else ctx.lineTo(Math.cos(a)*r, Math.sin(a)*r);
                    }
                    ctx.fillStyle = e.color; ctx.fillRect(-e.radius, -e.radius - 10, (e.hp/e.maxHp)*e.radius*2, 4); ctx.fillStyle = "#111";
                }
                ctx.closePath(); ctx.fill(); ctx.stroke();
                
                ctx.fillStyle = "#fff"; ctx.shadowBlur = 20 * pulse;
                ctx.beginPath(); ctx.arc(0, e.type==='TANK'?0:e.radius*0.3, e.radius*0.25, 0, Math.PI*2); ctx.fill();
                ctx.restore();
            });

            this.idiomBlocks.forEach(m => {
                ctx.save(); ctx.translate(m.pos.x, m.pos.y);
                const blockPulse = (Math.sin(time / 150) + 1) / 2;
                ctx.fillStyle = `rgba(0, 242, 255, ${0.1 + blockPulse * 0.2})`; ctx.strokeStyle = "#00f2ff";
                ctx.lineWidth = 2; ctx.shadowBlur = 15; ctx.shadowColor = "#00f2ff";
                if (IMG.block) { ctx.fillStyle = 'rgba(5,12,30,0.6)'; ctx.fillRect(-m.radius, -m.radius, m.radius * 2, m.radius * 2); fitDraw(ctx, IMG.block, m.radius * 2.7); }
                else { ctx.beginPath(); ctx.rect(-m.radius, -m.radius, m.radius*2, m.radius*2); ctx.fill(); ctx.stroke(); }
                
                ctx.fillStyle = "#ffffff"; ctx.shadowBlur = 5; ctx.font = `bold ${m.radius}px 'Microsoft JhengHei'`;
                ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.fillText(m.char, 0, 0);

                ctx.fillStyle = "rgba(0, 242, 255, 0.8)"; ctx.fillRect(-m.radius, m.radius + 5, (m.hp/m.maxHp)*m.radius*2, 3);
                ctx.restore();
            });

            this.charItems.forEach(c => { 
                ctx.save();
                ctx.fillStyle = "#ffea00"; ctx.shadowBlur = 15; ctx.shadowColor = "#ffea00";
                ctx.font = "bold 28px 'Microsoft JhengHei'"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
                ctx.fillText(c.char, c.pos.x, c.pos.y); 
                
                ctx.strokeStyle = "rgba(255, 234, 0, 0.5)"; ctx.lineWidth = 2; ctx.beginPath();
                ctx.arc(c.pos.x, c.pos.y, 20 + Math.sin(time/100)*5, 0, Math.PI*2); ctx.stroke();
                ctx.restore();
            });

            this.texts.pool.forEach(t => { if(t.active) t.draw(ctx); });
            ctx.save();
            this.enemies.forEach(e => { this.shieldOf(e); this.drawBars(ctx, e.pos.x, e.pos.y - e.radius * 1.7 - 6, e.radius * 2.4, e.hp, e.maxHp, e.shield, e.maxShield, e.color); });
            if (this.boss) { this.shieldOf(this.boss); this.drawBars(ctx, this.boss.pos.x, this.boss.pos.y - this.boss.size * 0.5 - 14, 150, this.boss.hp, this.boss.maxHp, this.boss.shield, this.boss.maxShield, '#ff3333'); }
            this.drawBars(ctx, this.player.pos.x, this.player.pos.y + 54 * SKINS[this.skin].s, 64, this.hp, this.maxHp, this.shield, this.maxHp, '#33ff88');
            this.particles.forEach(p => { ctx.globalAlpha = Math.max(0, p.life * 2); ctx.fillStyle = p.color; ctx.fillRect(p.x, p.y, 3, 3); });
            ctx.globalAlpha = 1;
            if (this.shock) {
                const k = this.shock.t / 1.2, M = Math.hypot(this.canvas.width, this.canvas.height);
                for (let i = 0; i < 3; i++) {
                    const kk = k - i * 0.12; if (kk <= 0) continue;
                    ctx.strokeStyle = ['#ffea00', '#ff8800', '#ff3366'][i]; ctx.globalAlpha = Math.max(0, 1 - kk); ctx.lineWidth = 14 - kk * 10;
                    ctx.shadowBlur = 30; ctx.shadowColor = ctx.strokeStyle; ctx.beginPath(); ctx.arc(this.shock.x, this.shock.y, kk * M, 0, 7); ctx.stroke();
                }
                ctx.globalAlpha = Math.max(0, 0.7 - k * 2.5); ctx.fillStyle = '#fff3c4'; ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);
                ctx.globalAlpha = 1; ctx.shadowBlur = 0;
            }
            if (this.keys['ShiftLeft'] || this.keys['ShiftRight']) { ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(this.player.pos.x, this.player.pos.y, 4, 0, 7); ctx.fill(); }
            if (this.casting) { ctx.fillStyle = 'rgba(0,0,0,0.45)'; ctx.fillRect(0, 0, this.canvas.width, this.canvas.height); }
            if (this.paused) {
                const W = this.canvas.width, H = this.canvas.height;
                ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.fillRect(0, 0, W, H);
                ctx.fillStyle = '#00f2ff'; ctx.textAlign = 'center'; ctx.font = "bold 48px 'Microsoft JhengHei'"; ctx.fillText('暫停中', W / 2, H / 2);
                ctx.font = "20px 'Microsoft JhengHei'"; ctx.fillText('按 P / Esc / Enter 繼續', W / 2, H / 2 + 50);
            }
            ctx.restore();
        }
    }
}

const game = new Game();
</script>
