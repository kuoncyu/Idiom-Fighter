        const f = Math.max(0, Math.min(1, hp / max)); ctx.shadowBlur = 0;
        ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.fillRect(x - w / 2 - 1, y - 1, w + 2, 6);
        ctx.fillStyle = f > 0.3 ? col : '#ff3344'; ctx.fillRect(x - w / 2, y, w * f, 4);
        if (maxSh > 0 && sh > 0) { ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.fillRect(x - w / 2 - 1, y + 6, w + 2, 5); ctx.fillStyle = '#4dd2ff'; ctx.fillRect(x - w / 2, y + 7, w * Math.min(1, sh / maxSh), 3); }
    }

    // 依 Boss 類型推薦「已擁有」中最合適的戰機（適性分 + 少量等級加成）
    recommend(stage) {
        const T = BOSS_TYPES[stage]; let best = null, bs = -1;
        SHIPS.forEach(S => {
            if (!this.fleet[S.id].own) return;
            const lv = Object.values(this.fleet[S.id]).reduce((x, v) => x + (typeof v === 'number' ? v : 0), 0);
            const sc = Math.round(typeMul(S.id, T) * 1000) / 1000 + 0.02 * lv;
            if (sc > bs) { bs = sc; best = S; }
        });
        const fit = S => Math.round(typeMul(S.id, T) * 1000);
        const ideal = SHIPS.reduce((m, S) => fit(S) > fit(m) ? S : m, SHIPS[0]);
        return { ship: best, ideal: this.fleet[ideal.id].own ? null : ideal };
    }

    equip(id) { if (this.fleet[id] && this.fleet[id].own) { this.shipId = id; this.applyUpgrades(); this.save(); this.renderLobby(); } }
    changeStart(d) { this.startStage = Math.max(1, Math.min(this.bestStage, this.startStage + d)); this.renderLobby(); }

    openHangar() { this.hIdx = SHIPS.findIndex(x => x.id === this.shipId); this.setState('HANGAR'); }
    keepScroll(fn) { const o = document.querySelector('#ui-layer .menu-overlay'), y = o ? o.scrollTop : 0; fn(); const n = document.querySelector('#ui-layer .menu-overlay'); if (n) n.scrollTop = y; }
    upToast(msg) {   // 升級／購買成功彈窗：3 秒後淡出
        let t = document.getElementById('up-toast');
        if (!t) { t = document.createElement('div'); t.id = 'up-toast'; t.style.cssText = 'position:fixed;left:50%;top:18%;transform:translateX(-50%);z-index:9999;background:rgba(5,5,16,.96);color:#fff;border:2px solid #ffea00;border-radius:12px;padding:14px 26px;font-size:1.1rem;font-weight:bold;box-shadow:0 0 24px rgba(255,234,0,.5);pointer-events:none;text-align:center;transition:opacity .6s;opacity:0'; document.body.appendChild(t); }
        t.innerHTML = '✔ ' + msg; t.style.opacity = '1'; clearTimeout(t._a); clearTimeout(t._b);
        t._a = setTimeout(() => { t.style.opacity = '0'; }, 3000);
    }
    radarSvg(S) {   // 戰機雷達圖：實線＝目前等級，虛線＝等級上限
        const KS = STAT_KEYS, F = this.fleet[S.id], R = 82, C = 110, n = KS.length;
        const pt = (i, r) => { const a = -Math.PI / 2 + i * 2 * Math.PI / n; return [C + Math.cos(a) * R * r, C + Math.sin(a) * R * r]; };
        const poly = f => KS.map(([k], i) => pt(i, Math.max(0.03, Math.min(1, f(k) / 16))).map(v => v.toFixed(1)).join(',')).join(' ');
        const rings = [0.25, 0.5, 0.75, 1].map(r => `<polygon points="${KS.map((_, i) => pt(i, r).map(v => v.toFixed(1)).join(',')).join(' ')}" fill="none" stroke="#334" stroke-width="1"/>`).join('');
        const axes = KS.map((_, i) => { const [x, y] = pt(i, 1); return `<line x1="${C}" y1="${C}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="#334"/>`; }).join('');
        const labels = KS.map(([k, nm], i) => { const [x, y] = pt(i, 1.22); return `<text x="${x.toFixed(1)}" y="${y.toFixed(1)}" fill="#ccd" font-size="12" text-anchor="middle" dominant-baseline="middle">${nm} ${F[k]}/${S.cap[k]}</text>`; }).join('');
        return `<svg viewBox="-30 0 280 220" width="300" height="236" style="flex:none">${rings}${axes}
            <polygon points="${poly(k => S.cap[k])}" fill="none" stroke="#889" stroke-width="1.5" stroke-dasharray="4 3"/>
            <polygon points="${poly(k => F[k])}" fill="${S.c}" fill-opacity=".35" stroke="${S.c}" stroke-width="2"/>${labels}</svg>`;
    }
    hSel(i) { this.hIdx = i; this.keepScroll(() => this.renderHangar()); }
    hEquip() { const S = SHIPS[this.hIdx]; if (this.fleet[S.id].own) { this.shipId = S.id; this.applyUpgrades(); this.save(); this.keepScroll(() => this.renderHangar()); } }
    upgrade(id, k) {
        const S = this.ship(id), L = this.fleet[id], cost = upgradeCost(L[k]);
        if (!L.own || L[k] >= S.cap[k] || this.darkMatter < cost) return;
        this.darkMatter -= cost; L[k]++; this.applyUpgrades(); sfx.playUpgradeOk(); this.save(); this.keepScroll(() => this.renderHangar());
        this.upToast(`${S.name}「${STAT_KEYS.find(x => x[0] === k)[1]}」升級成功！Lv.${L[k]}`);
    }

    renderLobby() {
        const S = this.ship(), st = this.statsOf(S.id), rec = this.recommend(this.startStage), ok = rec.ship.id === S.id;
        const img = S.id === 'star' ? 'assets/player.png' : `assets/ship_${S.id}.png`;
        const im = src => `<img src="${src}" onerror="this.style.display='none'">`;
        this.uiLayer.innerHTML = `
            <div class="menu-overlay lobby" style="width:min(96vw,800px);max-width:none;">
                <h1 class="lob-title">成語戰機</h1>
                <div class="dmline">暗物質 <b>${this.darkMatter}</b> DM</div>
                <div class="tiles">
                    <div class="tile w2 h2" style="--a:#0aa5ff;--b:#7b2ff7" onclick="game.startNewGame()">
                        ${im(`assets/boss_${this.startStage}.png`)}
                        <div class="f1"><h4>開始出擊 [Enter]</h4>
                            <div class="stg"><button onclick="event.stopPropagation();game.changeStart(-1)">◀</button><b>第 ${this.startStage} 關</b><button onclick="event.stopPropagation();game.changeStart(1)">▶</button></div>
                            <small>Boss：${bossLabel(this.startStage)}</small><small>${S.name}：${ok ? '很適合本關 Boss' : '建議改用 ' + rec.ship.name}｜對本關傷害 ×${+typeMul(S.id, BOSS_TYPES[this.startStage]).toFixed(2)}</small>
                            ${ok ? '' : `<button class="sm2" onclick="event.stopPropagation();game.equip('${rec.ship.id}')">換成 ${rec.ship.name} [R]</button>`}
                            <small style="opacity:.7">←／→ 切換關卡（最高解鎖第 ${this.bestStage} 關）</small></div>
                    </div>
                    <div class="tile w2" style="--a:#b026ff;--b:#ff3366" onclick="game.openHangar()">
                        ${im(img)}
                        <div class="f1"><h4>戰機管理 [H]</h4><small>${S.name}｜${S.role}</small><small>傷害 ${Math.round(st.dmg * SHOW)}　${S.pat === 'snipe' ? '鎖定 ' + this.snipeNeedOf(S.id).toFixed(1) + ' 秒' : '射速 ' + (1000 / st.iv).toFixed(1) + '/秒'}</small><small>血量 ${Math.round(st.hp * SHOW)}　移速 ${Math.round(st.spd)}</small><small>穿甲 ${st.pen}　爆擊 ${Math.round(st.crit * 100)}%</small></div>
                    </div>
                    <div class="tile" style="--a:#ffcc00;--b:#ff7a00" onclick="game.setState('SHOP')"><h4>軍械商店</h4><small>[S]</small><small>持有 ${this.darkMatter} DM</small><span class="ico">⚒</span></div>
                    <div class="tile" style="--a:#2b3a67;--b:#4b5b8f" onclick="game.openSettings()"><h4>設定</h4><small>[O]</small><small>音量・離線・關於</small><span class="ico">⚙</span></div>
                </div>
            </div>`;
    }

    renderHangar() {
        const KS = STAT_KEYS;
        const cards = SHIPS.map((S, i) => {
            const F = this.fleet[S.id], st = this.statsOf(S.id), own = F.own;
            const val = { dmg: Math.round(st.dmg * SHOW), rate: (1000 / st.iv).toFixed(1) + '/秒', hp: Math.round(st.hp * SHOW), spd: Math.round(st.spd), pen: st.pen, crit: Math.round(st.crit * 100) + '%', cov: covLabel(S, F.cov) };
            const rows = KS.map(([k, n], j) => {
                const lv = F[k], max = S.cap[k], cost = upgradeCost(lv), full = lv >= max;
                return `<div class="st"><span>${n}</span><div class="bar" style="background:linear-gradient(90deg,#2a2f4a ${max / 16 * 100}%,#0b0b14 0);"><i style="width:${lv / 16 * 100}%;"></i></div><em class="lv ${full ? 'max' : ''}" title="目前等級／等級上限">${lv}/${max}</em><b>${val[k]}</b>${own ? `<button ${full || this.darkMatter < cost ? 'disabled' : ''} onclick="event.stopPropagation();game.upgrade('${S.id}','${k}')">${full ? 'MAX' : cost}</button>` : ''}</div>`;
            }).join('');
            const img = S.id === 'star' ? 'assets/player.png' : `assets/ship_${S.id}.png`;
            return `<div class="card ${i === this.hIdx ? 'sel' : ''} ${S.id === this.shipId ? 'eq' : ''} ${own ? '' : 'locked'}" onclick="game.hSel(${i})">
                <img src="${img}" onerror="this.style.visibility='hidden'"><h3 style="color:${S.c};">${S.name}</h3><div style="font-size:0.8rem;color:#aaa;">${S.role}　等級上限 火${S.cap.dmg}/速${S.cap.rate}/甲${S.cap.hp}/動${S.cap.spd}/穿${S.cap.pen}/爆${S.cap.crit}/覆${S.cap.cov}</div>
                ${own ? rows : `<div class="st" style="color:var(--neon-gold);">尚未擁有・軍械商店 ${S.price} DM</div>${rows}`}</div>`;
        }).join('');
        this.uiLayer.innerHTML = `
            <div class="menu-overlay" style="width:min(96vw,1100px);max-width:none;">
                <h2 class="shop-title" style="margin-bottom:4px;">戰機管理</h2>
                <p style="color:var(--neon-purple); margin:4px 0;">持有暗物質: <b>${this.darkMatter} DM</b>　<small style="color:#aaa;">←／→ 選卡　1~${KS.length} 升級　Enter 出戰　Esc 返回</small></p>
                <div style="display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:center;margin:6px 0;">${this.radarSvg(SHIPS[this.hIdx])}
                    <div style="text-align:left;font-size:.85rem;line-height:1.7;color:#ccd;"><b style="color:${SHIPS[this.hIdx].c};font-size:1.05rem;">${SHIPS[this.hIdx].name}</b>　${SHIPS[this.hIdx].role}<br>雷達圖滿格＝16 級<br><b>火力覆蓋：${COV_INFO[SHIPS[this.hIdx].pat][0]}</b><br><span style="color:#9ab;font-size:.8rem;display:inline-block;max-width:260px;line-height:1.5">${COV_INFO[SHIPS[this.hIdx].pat][1]}</span><br><span style="color:${SHIPS[this.hIdx].c}">■</span> 目前等級　<span style="color:#889">┅</span> 等級上限</div></div>
                <div class="cards">${cards}</div>
                <button class="btn btn-shop" onclick="game.hEquip()">設為出戰戰機 [Enter]</button>
                <button class="btn btn-start" style="margin-top:6px;" onclick="game.setState('LOBBY')">返回大廳 [Esc]</button>
            </div>`;
    }

    shopRows() {
        const rows = [];
        SHIPS.forEach(X => {
            const o = this.fleet[X.id].own, c = X.cap;
            rows.push({ t: `${X.name}｜${X.role}`, img: X.id === 'star' ? 'assets/player.png' : 'assets/ship_' + X.id + '.png', c: X.c, dis: o || this.darkMatter < X.price,
                sub: `${o ? '已擁有（到「戰機管理」升級／出戰）' : X.price + ' DM'}・上限 火${c.dmg} 速${c.rate} 甲${c.hp} 動${c.spd} 穿${c.pen} 爆${c.crit} 覆${c.cov}`,
                run: () => { this.darkMatter -= X.price; this.fleet[X.id].own = true; } });
        });
        [['成語列', '同時收集的成語數', this.maxSlots, 6, SLOT_COST[this.maxSlots - 1] || 0, () => { this.maxSlots++; this.fillEmptySlots(); }, 'slots'],
         ['磁吸字塊', '字塊自動吸附範圍（Lv1 只吸身邊約 1 格，Lv5 吸全螢幕）', this.magnetLvl, 5, MAGNET_COST[this.magnetLvl] || 0, () => this.magnetLvl++, 'magnet'],
         ['暗物質回收', '暗物質獲得 +20%', this.dmLvl, 5, DMREC_COST[this.dmLvl] || 0, () => this.dmLvl++, 'dm']].forEach(([n, d, lv, max, cost, f, ic]) => {
            rows.push({ t: `${n} Lv.${lv}/${max}`, svg: SHOP_ICONS[ic], dis: lv >= max || this.darkMatter < cost, sub: lv >= max ? '已滿級' : `${d}・${cost} DM`, run: () => { this.darkMatter -= cost; f(); } });
        });
        return rows;
    }

    renderShop() {
        const heads = { 0: '戰機（購買後到「戰機管理」升級與出戰）', [SHIPS.length]: '全體升級' };
        const html = this.shopRows().map((r, i) => `${heads[i] ? `<div style="color:var(--neon-gold);margin-top:8px;font-size:0.9rem;">${heads[i]}</div>` : ''}<button class="btn btn-shop shop-row" style="font-size:0.85rem;padding:6px 8px;margin:4px auto;" ${r.dis ? 'disabled' : ''} onclick="game.buyItem(${i})"><span class="shop-ic">${r.img ? `<img src="${r.img}" alt="" style="filter:drop-shadow(0 0 6px ${r.c})">` : (r.svg || '')}</span><span class="shop-tx">[${i + 1}] ${r.t}<br><small>${r.sub}</small></span></button>`).join('');
        this.uiLayer.innerHTML = `
            <div class="menu-overlay">
                <h2 class="shop-title" style="margin-bottom:5px;">軍械商店</h2>
                <p style="font-size:1.1rem; color:var(--neon-purple); margin:4px 0;">持有暗物質: <b>${this.darkMatter} DM</b></p>
                ${html}
                <button class="btn btn-start" style="margin-top:10px;" onclick="game.setState('LOBBY')">返回大廳 [Esc]</button>
            </div>`;
    }

    buyItem(i) {
        const r = this.shopRows()[i];
        if (!r || r.dis) return;
        r.run(); this.applyUpgrades(); if (i < SHIPS.length) sfx.playBuy(); else sfx.playFeatureUp(); this.save(); this.keepScroll(() => this.renderShop());
        this.upToast(i < SHIPS.length ? `${SHIPS[i].name} 購買成功！` : `${this.shopRows()[i].t.replace(/ Lv\.(\d+)\/(\d+)/, '')} 升級成功！Lv.${this.shopRows()[i].t.replace(/.*Lv\.(\d+)\/.*/, '$1')}`);
    }

    save() {
        try { localStorage.setItem('idiomShooterSave', JSON.stringify({ dm:this.darkMatter, s:this.maxSlots, m:this.magnetLvl, d:this.dmLvl, f:this.fleet, i:this.shipId, b:this.bestStage, t:this.startStage })); } catch (err) {}
    }
    load() {
        try {
            const v = JSON.parse(localStorage.getItem('idiomShooterSave') || 'null'); if (!v) return;
            this.darkMatter = v.dm || 0; this.maxSlots = v.s || 1; this.magnetLvl = v.m || 0; this.dmLvl = v.d || 0;
            this.bestStage = Math.min(9, v.b || 1); this.startStage = Math.min(v.t || 1, this.bestStage);
            if (v.f) { SHIPS.forEach(S => { if (v.f[S.id]) Object.assign(this.fleet[S.id], v.f[S.id]); }); if (this.fleet[v.i] && this.fleet[v.i].own) this.shipId = v.i; }
            else { const f = this.fleet.star; f.dmg = Math.min(v.w || 1, 8); f.hp = Math.min(v.h || 0, 8); f.spd = Math.min(v.e || 0, 8); }   // 舊版存檔轉入星藍號
            SHIPS.forEach(S => STAT_KEYS.forEach(([k]) => { this.fleet[S.id][k] = Math.min(this.fleet[S.id][k] || 0, S.cap[k]); }));
        } catch (err) {}
    }

    startNewGame() {
        sfx.init(); this.tryFullscreen(); this.applyUpgrades(); this.shield = 0; this.pierceTimer = 0; this.missileTimer = 0; this.allies = []; this.allyTimer = 0; this.runDM = 0; this.runKills = 0; this.runCasts = 0; this.clearT = 0; this.snipe = { c: 0, t: [], fx: [] }; this.idleT = 0; this.idleGain = 0; this.idleAnchor = null; this.currentStage = Math.min(this.startStage, this.bestStage); this.currentSub = 1; this.score = 0; 
        this.hp = this.maxHp; this.slots = []; 
        this.fillEmptySlots(); // 遊戲開始時塞滿隨機成語任務
        this.resetStage(); this.setState('PLAYING');
    }

    fillEmptySlots() {
        while (this.slots.length < this.maxSlots) {
            const rand = this.pickIdiom();
            this.slots.push({ type: 'COLLECTING', word: rand.word, chars: [], effect: rand.effect, effectDesc: rand.desc });
        }
    }

    resetStage() {
        this.boss = null; this.clearT = 0; this.bossSumT = 0; if (this.currentSub === 1) { this.stageStart = this.runClock || 0; this.stageStartFor = this.currentStage; }
        this.enemies = []; this.idiomBlocks = []; this.charItems = [];
        this.player.pos = new Vec2(WORLD.w / 2, WORLD.h - 150);
        this.bullets.pool.forEach(b => b.active = false);
        this.pointerActive = false; 
        document.getElementById('boss-bar').style.display = 'none';
        
        if (this.currentSub < 3) {
            this.waveQuota = 3 + (this.currentStage - 1) * 3 + (this.currentSub - 1) * 2;
            this.enemiesSpawned = 0;
            this.enemySpawnTimer = 0;
        } else {
            this.waveQuota = 0;
        }
        this.idiomBlockTimer = 0;
        this.showFloatText(this.currentSub === 3 ? "WARNING: " + bossLabel(this.currentStage) : `區塊 ${this.currentStage}-${this.currentSub} 開始`, WORLD.w/2, WORLD.h/2, "#ffea00");
    }

    startTransition(isNextStage) {
        this.gameState = 'TRANSITION'; this.transitionTimer = 0; this.isNextStage = isNextStage; this.clearT = 0;
        this.bullets.pool.forEach(b => b.active = false); this.enemies = []; this.idiomBlocks = []; this.charItems = [];
        sfx.playTransition();
        this.showFloatText(isNextStage ? "STAGE CLEAR" : "WAVE CLEARED", WORLD.w/2, WORLD.h/2 - 50, "#00f2ff");
    }

    renderIdiomSlots() {
        if(this.gameState !== 'PLAYING' && this.gameState !== 'TRANSITION') return;
        const container = document.getElementById('idiom-ui'); container.innerHTML = ''; container.style.setProperty('--n', this.maxSlots); { const avail = Math.min(WORLD.rw, 720) * 0.98 - (this.maxSlots - 1) * 4; container.style.setProperty('--sw', Math.max(40, Math.min(120, avail / this.maxSlots)) + 'px'); }
        for (let i = 0; i < this.maxSlots; i++) {
            const slot = this.slots[i]; const div = document.createElement('div');
            if (slot) {
                // 產生每個字元的 HTML 結構
                let charsHTML = slot.word.split('').map(c => 
                    `<span class="char ${slot.chars.includes(c) ? 'collected' : 'uncollected'}">${c}</span>`
                ).join('');

                if (slot.type === 'READY') {
                    div.className = 'slot ready'; 
                    div.innerHTML = `<div class="slot-title">${charsHTML}</div><span class="slot-key">${i + 1}</span><div class="slot-subtitle">按 ${i + 1} 發動<br>(${slot.effectDesc})</div>`;
                    div.onclick = (e) => { e.stopPropagation(); this.useIdiom(i); };
                    div.ontouchstart = (e) => { e.stopPropagation(); e.preventDefault(); this.useIdiom(i); };
                } else if (slot.type === 'COLLECTING') {
                    div.className = 'slot collecting';
                    div.innerHTML = `<div class="slot-title">${charsHTML}</div><span class="slot-key">${i + 1}</span><div class="slot-subtitle">${slot.effectDesc}</div>`;
                }
            }
            container.appendChild(div);
        }
    }

    useIdiom(index) {
        const idiom = this.slots[index];
        if (!idiom || idiom.type !== 'READY' || this.paused || this.casting || performance.now() < (this._swallowUntil || 0)) return;
        const r = this.pickIdiom();
        this.slots[index] = { type: 'COLLECTING', word: r.word, chars: [], effect: r.effect, effectDesc: r.desc };
        this.renderIdiomSlots();
        this.startCast({ word: idiom.word, effect: idiom.effect, desc: idiom.effectDesc });
    }

    startCast(idiom) {
        this.casting = { idiom, t: 5 }; sfx.playIdiomCast();
        const info = IDIOM_INFO[idiom.word] || ['', ''], useMeaning = Math.random() < 0.5, label = useMeaning ? '解釋' : '造句', text = info[useMeaning ? 0 : 1] || '';
        let p = document.getElementById('idiom-popup');
        if (!p) { p = document.createElement('div'); p.id = 'idiom-popup'; document.getElementById('game-container').appendChild(p); }
        p.innerHTML = `<div class="ip-word">${idiom.word}</div><div class="ip-effect">大招效果：${idiom.desc}</div><div class="ip-line"><b>${label}</b>　<span id="ip-text"></span><span class="ip-cur">▌</span></div><div class="ip-bar"><i></i></div>`;
        p.style.display = 'block'; this.typeText(text);
    }
    typeText(text) {   // 像 AI 回覆一樣逐字浮現
        clearInterval(this._tw); const el = document.getElementById('ip-text'); if (!el) return;
        const ch = [...text]; let i = 0, step = Math.max(45, Math.min(130, 3200 / Math.max(1, ch.length)));
        this._tw = setInterval(() => { i++; el.textContent = ch.slice(0, i).join(''); if (i >= ch.length) { clearInterval(this._tw); const c = document.querySelector('#idiom-popup .ip-cur'); if (c) c.style.display = 'none'; } }, step);
    }

    endCast() { clearInterval(this._tw); this.casting = null; const p = document.getElementById('idiom-popup'); if (p) p.style.display = 'none'; }

    finishCast() {
        const idiom = this.casting.idiom; this.endCast(); this.runCasts = (this.runCasts || 0) + 1;
        sfx.playIdiomFire(idiom.effect);
        this.showFloatText(`發動！${idiom.word}！`, this.player.pos.x, this.player.pos.y - 40, '#ffea00');
        if (idiom.effect === 'BOMB_BOOST') this.triggerBomb();
        if (idiom.effect === 'INVINCIBLE') this.invincibleTimer = 10;
        
        if (idiom.effect === 'LASER_BEAM') this.triggerLaser();
        if (idiom.effect === 'SHIELD') { this.shield = Math.min(this.maxHp, this.shield + 50); this.showFloatText('護盾 +' + 50 * SHOW, this.player.pos.x, this.player.pos.y - 70, '#4dd2ff'); }
        if (idiom.effect === 'ALLY') this.summonAllies();
        if (idiom.effect === 'PIERCE') this.pierceTimer = 30;
        if (idiom.effect === 'MISSILE') { this.missileTimer = 10; this.missileCd = 0; }
        if (idiom.effect === 'HEAL') { this.hp = Math.min(this.maxHp, this.hp + 30); this.updateHUD(); }
        if (idiom.effect === 'SLOW_TIME') this.slowTimer = 6;
    }

    triggerBomb() {
        this.bullets.pool.forEach(b => { if(!b.isPlayer) b.active = false; });
        if (this.boss) { const d = Math.min(300, this.boss.maxHp * 0.25); this.dmgEnt(this.boss, d); this.showFloatText(`Boss -${Math.round(d * SHOW)}`, this.boss.pos.x, this.boss.pos.y + 70, '#ff3366'); }
        this.shock = { t: 0, x: this.player.pos.x, y: this.player.pos.y };
        for (let i = 0; i < 24; i++) this.burst(Math.random() * WORLD.w, Math.random() * WORLD.h, 8);
        this.enemies.forEach(e => { this.dropDarkMatter(e.pos.x, e.pos.y, e.maxHp * 2); this.runKills = (this.runKills || 0) + 1; this.enemyDrop(e, 0.5); sfx.playExplosion(); });
        this.enemies = []; this.showFloatText("全螢幕爆破!", WORLD.w/2, WORLD.h/2, "#ff00ff");
    }
    triggerLaser() { this.laserTimer = 3.0; }

    showFloatText(text, x, y, color = "#fff") { const t = this.texts.get(); t.pos = new Vec2(x, y); t.text = text; t.color = color; t.life = 1.5; }
    dropDarkMatter(x, y, amount) { amount = Math.max(1, Math.round(amount * (1 + 0.2 * this.dmLvl) * (1 + 0.25 * (this.currentStage - 1)) * DM_RATE)); this.runDM = (this.runDM || 0) + amount; this.idleGain = (this.idleGain || 0) + amount; this.burst(x, y, amount >= 20 ? 18 : 4); this.darkMatter += amount; this.showFloatText(`+${amount} DM`, x, y, "#b026ff"); this.updateHUD(); }

    updateHUD() {
        if(this.gameState !== 'PLAYING' && this.gameState !== 'TRANSITION') return;
        document.getElementById('dm-val').innerText = this.darkMatter;
        document.getElementById('lvl-val').innerText = this.currentStage === 9 ? "FINAL BOSS" : `${this.currentStage}-${this.currentSub}`;
    }

    loop(timestamp) {
        const dt = Math.min((timestamp - this.lastTime) / 1000, 0.1); this.lastTime = timestamp;
        if (this.gameState === 'PLAYING') { if (!this.paused) { if (this.casting) { this.casting.t -= dt; if (this.casting.t <= 0) this.finishCast(); this.tickClear(dt); } else { this.tickClear(dt); this.bgClock += dt; this.runClock += dt; if (this.pkMode) this.pkTime += dt; this.update(dt); } } } else if (this.gameState === 'TRANSITION') { this.bgClock += dt; this.runClock += dt; this.updateTransition(dt); } else if (this.isMenu()) this.updateDemo(dt);
        this.draw(); requestAnimationFrame((t) => this.loop(t));
    }

    updateTransition(dt) {
        this.transitionTimer += dt;
        if (this.transitionTimer > 1.0 && this.transitionTimer <= 2.0) this.player.pos.y -= 1000 * dt; 
        if (this.transitionTimer > 2.0) {
            if (this.isNextStage) {
                if (this.currentStage < CONFIG.MAX_STAGES) { this.currentStage++; this.currentSub = 1; } 
                else if (this.currentStage === 8) { this.currentStage = 9; this.currentSub = 1; } 
                else { this.setState('VICTORY'); return; }
            } else { this.currentSub++; }
            this.resetStage(); this.setState('PLAYING'); this.updateHUD();
        }
        this.texts.pool.forEach(t => { if(t.active) t.update(dt); });
    }

    enemyFire(e, dt) {   // 每種小怪各有專屬的攻擊樣式與頻率
        if (e.pos.y < 20) return;                   // 還沒進入畫面不開火
        const v = 70 + this.currentStage * 14, D = Math.PI / 2;
        const shot = (x, y, a, sp, r, dmg) => { const b = this.bullets.get(); b.pos = new Vec2(x, y); b.vel = new Vec2(Math.cos(a) * sp, Math.sin(a) * sp); b.color = e.color; b.isPlayer = false; b.radius = r; b.damage = dmg; };
        const aim = () => Math.atan2(this.player.pos.y - e.pos.y, this.player.pos.x - e.pos.x);
        if (e.snipe) {                              // 狙擊：瞄準線會追著玩家，線「不動」滿 2.5 秒才開槍；一直移動就打不到
            const sn = e.snipe, want = aim(); let d = want - sn.a; while (d > Math.PI) d -= Math.PI * 2; while (d < -Math.PI) d += Math.PI * 2;
            const step = Math.max(-8 * dt, Math.min(8 * dt, d)); sn.a += step; e.lockA = sn.a;
            if (Math.abs(step) / dt < 0.05) sn.still += dt; else sn.still = 0;
            e.charge = 1; e.snipeP = Math.min(1, sn.still / 2.5);
            if (sn.still >= 2.5) { e.snipe = null; e.charge = 0; e.snipeP = 0; shot(e.pos.x, e.pos.y + e.radius, sn.a, 1100, 8, 4); sfx.playSnipe && sfx.playSnipe(); }
            return;
        }
        if (e.q && e.q.length) {                    // 連發／蓄力／雙擊的後續動作
            e.q[0].t -= dt; if (e.type === 'SNIPER') e.charge = Math.max(0, e.q[0].t);
            if (e.q[0].t <= 0) e.q.shift().f();
            return;
        }
        e.shootTimer += dt; if (e.shootTimer <= e.shootInterval) return; e.shootTimer = 0;
        const x = e.pos.x, y0 = e.pos.y + e.radius, push = (t, f) => { (e.q = e.q || []).push({ t, f }); };
        switch (e.type) {
            case 'SCOUT': shot(x, y0, aim(), v * 0.8, 4, 1); break;                                                        // 單發慢彈
            case 'FIGHTER': for (let i = 0; i < 3; i++) push(i ? 0.14 : 0.01, () => { shot(e.pos.x, e.pos.y + e.radius, aim(), v * 1.1, 4, 1); sfx.playEnemyShoot(); }); return;   // 三連發
            case 'TANK': for (let i = -2; i <= 2; i++) shot(x, y0, D + i * 0.26, v * 0.8, 6, 2); break;                    // 重砲五向齊射
            case 'SWARM': { const k = e.form && e.form.kind;                                                              // 依隊形：直射／瞄準／向外放射
                if (k === 'ring') shot(x, e.pos.y, Math.atan2(e.pos.y - e.cy, e.pos.x - e.cx), v * 0.7, 3, 1);
                else if (k === 'v') shot(x, y0, aim(), v * 0.9, 3, 1); else shot(x, y0, D, v * 0.9, 3, 1); break; }
            case 'SNIPER': e.lockA = aim(); e.snipe = { a: e.lockA, still: 0 }; e.charge = 1; return;   // 開始瞄準（線不動 2.5 秒後射出高傷害極速子彈）
            case 'BOMBER': { const p = (e.pat = e.pat || 0) % 3; e.pat++;                                                 // 三向 → 五向 → 慢速大炸彈 輪替
                if (p === 0) [-0.35, 0, 0.35].forEach(o => shot(x, y0, D + o, v * 0.9, 5, 1));
                else if (p === 1) [-0.6, -0.3, 0, 0.3, 0.6].forEach(o => shot(x, y0, D + o, v * 0.85, 5, 1));
                else shot(x, y0, D, v * 0.5, 9, 2); break; }
            case 'GUARD': { const a = aim(); shot(x - 7, y0, a - 0.1, v, 4, 1); shot(x + 7, y0, a + 0.1, v, 4, 1);          // 雙擊：兩次雙發
                push(0.25, () => { const a2 = aim(); shot(e.pos.x - 7, e.pos.y + e.radius, a2 - 0.1, v, 4, 1); shot(e.pos.x + 7, e.pos.y + e.radius, a2 + 0.1, v, 4, 1); sfx.playEnemyShoot(); }); break; }
            default: return;                                                                                               // 俯衝機不開火，靠撞擊
        }
        sfx.playEnemyShoot();
    }

    moveCustom(e, dt) {   // 每種敵機各有專屬移動；蜂群、俯衝隊、護衛會以隊形一起行動
        e.tm += dt; const W = WORLD.w, H = WORLD.h, t = e.tm, cl = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
        const toward = (tx, sp) => { const d = tx - e.pos.x; e.pos.x += cl(d, -sp * dt, sp * dt); };
        switch (e.mv) {
            case 'sway':   // 偵察機：緩慢下降並大幅左右擺盪
                e.pos.y += e.speed * 0.5 * dt; e.pos.x = cl(e.bx + Math.sin(t * 1.6 + e.ph) * 110, e.radius, W - e.radius); if (e.pos.y > H + 40) e.pos.y = -40; break;   // 飛出下方 → 從上方重新飛入（不會消失，必須擊殺）
            case 'hunt':   // 戰鬥機：下降到定位後，橫向追著玩家
                if (e.pos.y < e.hy) e.pos.y += e.speed * 2 * dt; else e.pos.y = e.hy + Math.sin(t * 2) * 10;
                toward(cl(this.player.pos.x + e.off, e.radius, W - e.radius), e.speed * 3); break;
            case 'march':  // 坦克：沉重地直線推進、駐守，只有輕微橫移
                if (e.pos.y < e.hy) e.pos.y += e.speed * 1.5 * dt;
                e.pos.x = cl(e.pos.x + Math.sin(t * 0.5 + e.ph) * 22 * dt, e.radius, W - e.radius); break;
            case 'dive':   // 俯衝機：V 字編隊朝玩家直線衝刺
                e.pos.x += e.vel.x * dt; e.pos.y += e.vel.y * dt;
                if (e.pos.y > H + 60 || e.pos.x < -60 || e.pos.x > W + 60) {   // 衝出畫面 → 從上方隨機位置重新瞄準玩家俯衝（不會消失，必須擊殺）
                    const nx = 40 + Math.random() * (W - 80), a = Math.atan2(this.player.pos.y + 50, this.player.pos.x - nx), sp = e.speed || 200;
                    e.pos.x = nx; e.pos.y = -50; e.vel = new Vec2(Math.cos(a) * sp, Math.sin(a) * sp);
                } break;
            case 'formation': {   // 蜂群：整隊一起移動（橫列／V 字／旋轉圓環）
                const f = e.form, n = f.n, c = f.i - (n - 1) / 2, cy = -40 + e.speed * t, cx = e.bx + Math.sin(t * 1.1 + e.ph) * 110;
                let ox, oy;
                if (f.kind === 'line') { ox = c * 60; oy = 0; } else if (f.kind === 'v') { ox = c * 60; oy = Math.abs(c) * 36; }
                else { const a = t * 1.6 + f.i * Math.PI * 2 / n; ox = Math.cos(a) * 84; oy = Math.sin(a) * 84; }
                e.cx = cx; e.cy = cy; e.pos.x = cl(cx + ox, e.radius, W - e.radius); e.pos.y = cy + oy; if (cy > H + 90) e.tm = 0; break;   // 整隊飛出下方 → 重置，從上方重新飛入（不會消失，必須擊殺）
            }
            case 'mirror':   // 狙擊機：定位後與玩家「鏡像」移動
                if (e.pos.y < e.hy) e.pos.y += e.speed * 2.2 * dt; if (!(e.charge > 0)) toward(cl(W - this.player.pos.x, e.radius, W - e.radius), e.speed * 3.5); break;
            case 'lawn':     // 轟炸機：橫掃整個畫面，到邊緣就往下一排
                if (e.pos.y < e.hy) e.pos.y += e.speed * 1.5 * dt; e.pos.x += e.dir * e.speed * 2.2 * dt;
                if (e.pos.x > W - e.radius) { e.pos.x = W - e.radius; e.dir = -1; e.hy = Math.min(e.hy + 55, H * 0.45); }
                if (e.pos.x < e.radius) { e.pos.x = e.radius; e.dir = 1; e.hy = Math.min(e.hy + 55, H * 0.45); } break;
            case 'patrol': { // 護衛機：成對繞圈巡邏
                const a = t * 1.3 + e.ph, cy = Math.min(e.hy, -30 + e.speed * 2.5 * t);
                e.pos.x = cl(e.bx + Math.cos(a) * 100, e.radius, W - e.radius); e.pos.y = cy + Math.sin(a) * 38; break;
            }
        }
    }

    spawnEnemy(force) {
        const diff = this.currentStage + this.currentSub, t = (this.currentStage - 1) + (this.currentSub - 1) * 0.3, W = WORLD.w, st = this.currentStage;
        const pools = {
            1: this.currentSub > 1 ? ['SCOUT', 'SCOUT', 'DART'] : ['SCOUT'],
            2: ['SCOUT', 'SWARM', 'FIGHTER', 'DART'],
            3: ['SCOUT', 'SWARM', 'SNIPER', 'FIGHTER', 'DART'],
            4: ['DART', 'SNIPER', 'FIGHTER', 'BOMBER', 'SWARM']
        };
        const pool = pools[st] || ['FIGHTER', 'SNIPER', 'BOMBER', 'TANK', 'GUARD', 'SWARM', 'DART'];
        const eType = force || pool[Math.floor(Math.random() * pool.length)];
        const D = {
            SCOUT:   { speed: 50 + t * 28, hp: 1.5 + t * 1.4, r: 19, c: '#00ffcc', iv: Math.max(2.8, 5.5 - t * 0.4), mv: 'sway' },
            FIGHTER: { speed: 40 + t * 18, hp: 3 + t * 3.2, r: 23, c: '#ffaa00', iv: Math.max(1.6, 3.2 - t * 0.25), mv: 'hunt' },
            TANK:    { speed: 25 + t * 8, hp: 10 + t * 7, r: 33, c: '#ff3366', iv: Math.max(2.0, 4.2 - t * 0.3), mv: 'march' },
            DART:    { speed: 150 + t * 22, hp: 1 + t * 0.9, r: 18, c: '#ff77ff', iv: 999, mv: 'dive' },
            SWARM:   { speed: 55 + t * 14, hp: 1 + t * 0.8, r: 17, c: '#aaff44', iv: Math.max(3.5, 6.5 - t * 0.35), mv: 'formation' },
            SNIPER:  { speed: 35 + t * 6, hp: 2.5 + t * 2.2, r: 21, c: '#66ccff', iv: Math.max(2.0, 3.8 - t * 0.25), mv: 'mirror' },
            BOMBER:  { speed: 30 + t * 6, hp: 6 + t * 4.2, r: 27, c: '#ffcc66', iv: Math.max(1.4, 2.8 - t * 0.2), mv: 'lawn' },
            GUARD:   { speed: 32 + t * 6, hp: 5 + t * 3.4, r: 24, c: '#66ffaa', iv: Math.max(1.0, 2.4 - t * 0.18), mv: 'patrol' }
        }[eType];
        const make = (x, y, extra) => {
            const e = { type: eType, pos: new Vec2(x, y), vel: new Vec2(0, 0), hp: D.hp, maxHp: D.hp, radius: D.r, color: D.c, diff: diff, speed: D.speed,
                shootTimer: Math.random() * D.iv, shootInterval: D.iv, custom: true, mv: D.mv, tm: 0, dir: Math.random() < 0.5 ? -1 : 1, ph: Math.random() * 6, bx: x,
                off: (Math.random() - 0.5) * 160, hy: (eType === 'SNIPER' ? 70 : eType === 'BOMBER' ? 90 : eType === 'GUARD' ? 140 : 130) + Math.random() * 70 };
            Object.assign(e, extra || {}); this.enemies.push(e);
        };
        const x0 = Math.random() * Math.max(10, W - 300) + Math.min(150, W / 2 - 5);
        if (eType === 'SWARM') {   // 蜂群：整隊陣列移動
            const n = 4 + (st >= 3 ? 1 : 0) + (st >= 5 ? 1 : 0), kind = ['line', 'v', 'ring'][Math.floor(Math.random() * 3)], ph = Math.random() * 6;
            for (let i = 0; i < n; i++) make(x0, -40, { form: { kind, i, n }, ph });
        } else if (eType === 'DART') {   // 俯衝機：V 字編隊
            const n = st <= 2 ? 3 : 5;
            for (let i = 0; i < n; i++) { const c = i - (n - 1) / 2, x = x0 + c * 58, y = -30 - Math.abs(c) * 46, a = Math.atan2(this.player.pos.y - y, this.player.pos.x - x); make(x, y, { vel: new Vec2(Math.cos(a) * D.speed, Math.sin(a) * D.speed) }); }
        } else if (eType === 'GUARD') {   // 護衛機：成對巡邏
            const ph = Math.random() * 6; [0, Math.PI].forEach(o => make(x0, -30, { ph: ph + o }));
        } else make(Math.random() * (W - 60) + 30, -30);
    }

    checkIdle(dt) {   // 防掛機：連續 60 秒沒有移動 → 扣回這 60 秒獲得的暗物質並暫停
        const p = this.player.pos, a = this.idleAnchor;
        if (!a || Math.hypot(p.x - a.x, p.y - a.y) > 8) { this.idleAnchor = { x: p.x, y: p.y }; this.idleT = 0; this.idleGain = 0; return; }
        this.idleT += dt;
        if (this.idleT >= 60) {
            const g = Math.min(this.darkMatter, Math.round(this.idleGain || 0)); this.darkMatter -= g; this.runDM = Math.max(0, (this.runDM || 0) - g);
            if (typeof online !== 'undefined' && online.stat && g) online.stat('totalDM', -g);
            this.idleT = 0; this.idleGain = 0; this.idleAnchor = null; this.updateHUD(); this.save();
            this.dialog(`<h3 style="color:var(--neon-red)">偵測到長時間未操作</h3><p style="line-height:1.7">已扣回這 60 秒獲得的暗物質（-${g} DM）。<br><b>如不遊玩，請關閉遊戲，延長手機壽命。</b></p><button class="btn btn-start" onclick="game.closeDlg()">我知道了，繼續遊玩</button><p class="muted" style="margin:8px 0 0">按任意鍵或點一下畫面也可繼續</p>`); this.idleDlg = true; this._idleDlgAt = performance.now();
        }
    }
    update(dt) {
        this.checkIdle(dt);
        const spd = this.player.speed * ((this.keys['ShiftLeft'] || this.keys['ShiftRight']) ? 0.45 : 1);
        // 鍵盤（斜向也不會變快）與拖曳使用同一個移動速度
        const kx = ((this.keys['KeyD'] || this.keys['ArrowRight']) ? 1 : 0) - ((this.keys['KeyA'] || this.keys['ArrowLeft']) ? 1 : 0);
        const ky = ((this.keys['KeyS'] || this.keys['ArrowDown']) ? 1 : 0) - ((this.keys['KeyW'] || this.keys['ArrowUp']) ? 1 : 0);
        const kl = Math.hypot(kx, ky) || 1;
        this.player.pos.x += kx / kl * spd * dt; this.player.pos.y += ky / kl * spd * dt;
        if (!this.pointerActive) this.dragTarget = null;
        if (this.dragTarget) {
            const ex = this.dragTarget.x - this.player.pos.x, ey = this.dragTarget.y - this.player.pos.y, d = Math.hypot(ex, ey), step = spd * dt;
            if (d <= step) { this.player.pos.x = this.dragTarget.x; this.player.pos.y = this.dragTarget.y; }
            else { this.player.pos.x += ex / d * step; this.player.pos.y += ey / d * step; }
        }
        
        this.player.pos.x = Math.max(20, Math.min(WORLD.w - 20, this.player.pos.x));
        this.player.pos.y = Math.max(20, Math.min(WORLD.h - 20, this.player.pos.y));

        if (this.pkMode && window.online) online.pkUpdate(dt);   // PK：對手位置／子彈／字塊
        const fireRate = this.player.rapidFire > 0 ? Math.min(50, this.st.interval) : this.st.interval;
        if (Date.now() - this.player.lastShoot > fireRate) {
            const dmg = this.st.dmg;
            const shootBullet = (offset, angle, rs, dm) => {
                const b = this.bullets.get(); b.pos = new Vec2(this.player.pos.x + offset, this.player.pos.y - 25);
                b.vel = new Vec2(Math.sin(angle)*800, -Math.cos(angle)*800);
                b.isPlayer = true; b.damage = dmg * (dm || 1); b.pen = this.st.pen; b.crit = this.st.crit; b.turn = 0; b.target = null; styleBullet(b, b.damage); if (rs && rs !== 1) b.radius *= rs; b.pierce = !!SKINS[this.skin].pierce; b.sid = this.shipId; b.homing = this.missileTimer > 0 || (b.pierce && !this.pkMode && ((this._lanceN = (this._lanceN || 0) + 1) % 2 === 0));   // 穿甲號：每兩發有一發會自動追蹤（追蹤導彈道具期間則全部追蹤）
            };
            const shots = patternShots(SKINS[this.skin], this.covLv);   // 依戰機的火力覆蓋等級決定彈道
            shots.forEach(sh => shootBullet(sh.o, sh.a, sh.rs, sh.dm));
            if (this.player.spreadFire > 0) [[-15, -0.15], [15, 0.15], [-25, -0.3], [25, 0.3], [-35, -0.45], [35, 0.45]].forEach(([o, a]) => { if (!shots.some(sh => Math.abs(sh.a - a) < 0.02)) shootBullet(o, a); });   // 散射道具：額外加開扇形
            this.player.lastShoot = Date.now(); sfx.playShoot(this.player.spreadFire > 0 ? 2 : this.player.rapidFire > 0 ? 1 : 0);
        }
        if (SKINS[this.skin].pat === 'snipe') this.snipeUpdate(dt); else if (this.snipe) { this.snipe.c = 0; this.snipe.t = []; this.snipe.fx = []; }

        if (!this.pkMode && !this.boss && !(this.clearT > 0)) {   // PK 不出現 NPC 戰機與 Boss
            if (this.currentSub < 3) {
                if (this.enemiesSpawned < this.waveQuota) {
                    this.enemySpawnTimer -= dt;
                    const maxOnScreen = Math.min(8, 2 + Math.floor(this.currentStage * 0.6));
                    if (this.enemySpawnTimer <= 0 && this.enemies.length < maxOnScreen) {
                        this.spawnEnemy(); this.enemiesSpawned++; this.enemySpawnTimer = Math.max(0.5, 2.0 - this.currentStage * 0.15); 
                    }
                } else if (this.enemies.length === 0) { this.clearStage(false); }
            } else {
                this.boss = new Boss(this.currentStage); document.getElementById('boss-bar').style.display = 'block'; sfx.playReady();
            }
        }

        // 掉落成語字塊：分析當前需要哪些字，提高掉落機率
        if (!this.pkMode) this.idiomBlockTimer += dt;
        if (this.idiomBlockTimer > 2.0) { // 稍微加快掉落速度
            if (Math.random() < 0.35) this.spawnIdiomBlock(Math.random() * (WORLD.w-60) + 30, -50);
            this.idiomBlockTimer = 0;
        }

        if (this.boss && this.boss.stage === 9 && this.boss.hp > 0 && this.boss.pos.y > 0) {   // 最終 Boss：每 30 秒召喚一批小怪（戰機）
            this.bossSumT = (this.bossSumT || 0) + dt;
            if (this.bossSumT >= 30) {
                this.bossSumT = 0; const T = ['FIGHTER', 'SNIPER', 'BOMBER', 'GUARD', 'FIGHTER']; T.forEach(t => this.spawnEnemy(t));
                this.showFloatText('終焉召喚了援軍！', WORLD.w / 2, WORLD.h * 0.45, '#ff66ff'); sfx.playReady();
            }
        }
        if (this.boss) {
            this.boss.update(dt, this.player.pos, () => { const b = this.bullets.get(); b.damage = this.boss.dmgMul; b.radius = 6; return b; }, (x,y) => this.spawnIdiomBlock(x,y));
            document.getElementById('boss-hp-fill').style.width = (this.boss.hp / this.boss.maxHp * 100) + "%";
            if (this.boss.hp <= 0) {
                if (!this.pkMode && this.stageStart !== undefined && this.stageStartFor === this.currentStage) this.noteStageClear(this.currentStage, Math.round((this.runClock - this.stageStart) * 1000));
                this.dropDarkMatter(this.boss.pos.x, this.boss.pos.y, this.boss.dmReward); this.runKills = (this.runKills || 0) + 1; this.enemyDrop({ type: 'BOSS', pos: this.boss.pos });
                sfx.playExplosion(); this.boss = null; this.clearStage(true);
            }
        }

        this.enemies.forEach((e, i) => {
            const sdt = this.slowTimer > 0 ? dt * 0.4 : dt;
            if (e.custom) { this.moveCustom(e, sdt); if (e.gone) { this.enemies.splice(i, 1); return; } }
            else {
                e.pos.x += e.vel.x * sdt; e.pos.y += e.vel.y * sdt;
                if (e.pos.x < e.radius) { e.pos.x = e.radius; e.vel.x = Math.abs(e.vel.x); }
                if (e.pos.x > WORLD.w - e.radius) { e.pos.x = WORLD.w - e.radius; e.vel.x = -Math.abs(e.vel.x); }
                if (e.pos.y < e.radius) { e.pos.y = e.radius; e.vel.y = Math.abs(e.vel.y); }
                if (e.pos.y > WORLD.h - e.radius) { e.pos.y = WORLD.h - e.radius; e.vel.y = -Math.abs(e.vel.y); }
            }

            this.enemyFire(e, dt);

            if (Math.hypot(e.pos.x - this.player.pos.x, e.pos.y - this.player.pos.y) < e.radius + this.player.radius && this.invincibleTimer <= 0) {
                this.hurt(e.type === 'TANK' ? 25 : 15); this.invincibleTimer = 1.0; sfx.playPlayerHit(); this.updateHUD(); if(this.hp<=0) this.setState('GAMEOVER');
            }
        });

        this.bullets.pool.forEach(b => {
            if (b.active) {
                if (b.homing) this.steer(b, dt);
                const ox = b.pos.x, oy = b.pos.y;
                b.update(!b.isPlayer && this.slowTimer > 0 ? dt * 0.4 : dt);
                if (b.pos.y < -50 || b.pos.y > WORLD.h + 50 || b.pos.x < -50 || b.pos.x > WORLD.w+50) b.active = false;
                
                if (b.isPlayer) {
                    if (b.sid === 'nova' && !this.pkMode) {   // 環陣號：子彈碰到敵方子彈會抵銷，敵彈傷害越高要越多發（1～5 發，見 cancelNeed）
                        const hitB = this.bullets.pool.find(o => o.active && !o.isPlayer && !o.pk && Math.hypot(b.pos.x - o.pos.x, b.pos.y - o.pos.y) < b.radius + o.radius);
                        if (hitB) { b.active = false; hitB.hits = (hitB.hits || 0) + 1; if (hitB.hits >= cancelNeed(hitB.damage)) hitB.active = false; this.burst(b.pos.x, b.pos.y, 1); return; }   // 敵彈越強要越多發才抵銷得掉
                    }
                    if (this.pkMode && window.online && online.pk && online.pk.ghost) {   // 打到對手：子彈消失（傷害由被打的一方自己結算）
                        const g = online.pk.ghost, R = (online.pk.ghostR || 15) + 9;
                        if (segDist(ox, oy, b.pos.x, b.pos.y, g.x, g.y) < R) { b.active = false; this.burst(b.pos.x, b.pos.y, 2); return; }
                    }
                    if (this.boss && Math.hypot(b.pos.x - this.boss.pos.x, b.pos.y - this.boss.pos.y) < this.boss.radius) {
                        this.dmgEnt(this.boss, b.damage, b.pierce, true, b); b.active = false; sfx.playHit();
                    }
                    this.enemies.forEach((e, i) => {
                        if (Math.hypot(b.pos.x - e.pos.x, b.pos.y - e.pos.y) < e.radius) {
                            this.dmgEnt(e, b.damage, b.pierce, true, b); b.active = false; sfx.playHit();
                            if(e.hp<=0) { this.dropDarkMatter(e.pos.x, e.pos.y, e.maxHp * 1.5); this.runKills = (this.runKills || 0) + 1; this.enemyDrop(e); sfx.playExplosion(); this.enemies.splice(i, 1); }
                        }
                    });
                    this.idiomBlocks.forEach((m, i) => {
                        if (Math.hypot(b.pos.x - m.pos.x, b.pos.y - m.pos.y) < m.radius) {
                            m.hp -= b.damage; b.active = false; sfx.playHit();
                            if(m.hp<=0) {
                                this.blockBreak(m);
                                sfx.playExplosion(); this.idiomBlocks.splice(i, 1);
                            }
                        }
                    });
                } else {
                    if (b.pk && segDist(ox, oy, b.pos.x, b.pos.y, this.player.pos.x, this.player.pos.y) < this.player.radius && this.invincibleTimer <= 0) {   // 對手的子彈
                        this.hurt(online.pkDmg(b)); b.active = false; sfx.playPlayerHit(); this.updateHUD(); if (this.hp <= 0) this.setState('GAMEOVER');
                    } else if (!b.pk && Math.hypot(b.pos.x - this.player.pos.x, b.pos.y - this.player.pos.y) < this.player.radius && this.invincibleTimer <= 0) {
                        this.hurt(b.damage * 10); b.active = false; this.invincibleTimer = 0.5; sfx.playPlayerHit(); this.updateHUD(); if(this.hp<=0) this.setState('GAMEOVER');
                    }
                }
            }
        });

        this.idiomBlocks.forEach((m, i) => {
            if (m.vx !== undefined) {   // PK 字塊：從左右兩側橫向飄過戰場中央
                m.pos.x += m.vx * dt; m.pos.y = m.y0 + m.sg * Math.sin(this.pkTime * 1.1 + m.ph) * 28;
                if (m.pos.x < -70 || m.pos.x > WORLD.w + 70) this.idiomBlocks.splice(i, 1);
                return;
            }
            m.pos.y += 60 * dt;
            if (m.pos.y > WORLD.h + m.radius) this.idiomBlocks.splice(i, 1);
        });

        this.charItems.forEach((c, i) => {
            if (c.home) {   // PK：字元飄向打爆字塊的那一方
                const T = c.home === 'me' ? this.player.pos : (window.online && online.pk && online.pk.ghost);
                if (!T) { this.charItems.splice(i, 1); return; }
                const dx = T.x - c.pos.x, dy = T.y - c.pos.y, d = Math.hypot(dx, dy) || 1; c.v = Math.min(420, (c.v || 90) + 360 * dt);
                c.pos.x += dx / d * c.v * dt; c.pos.y += dy / d * c.v * dt;
                if (d < 28) { if (c.home === 'me') this.collectChar(c.char); this.charItems.splice(i, 1); }
                return;
            }
            c.pos.y += 120 * dt; 
            const cd = Math.hypot(c.pos.x - this.player.pos.x, c.pos.y - this.player.pos.y);
            if (this.magnetLvl > 0 && cd > 1 && cd < MAGNET_RANGE[Math.min(5, this.magnetLvl)]) { const sp = (240 + this.magnetLvl * 60) * dt; c.pos.x += (this.player.pos.x - c.pos.x) / cd * sp; c.pos.y += (this.player.pos.y - c.pos.y) / cd * sp; }
            if (cd < 40 + this.magnetLvl * 10) {
                this.collectChar(c.char); this.charItems.splice(i, 1);
            }
        });

        if (this.laserTimer > 0) {
            if (this.boss && Math.abs(this.boss.pos.x - this.player.pos.x) < this.boss.radius + 25) this.dmgEnt(this.boss, 70 * dt);
            this.enemies.forEach((e, i) => {
                if (Math.abs(e.pos.x - this.player.pos.x) < 25 && e.pos.y < this.player.pos.y) {
                    this.dmgEnt(e, 50 * dt); if(e.hp<=0) { this.dropDarkMatter(e.pos.x, e.pos.y, e.maxHp*1.5); this.runKills = (this.runKills || 0) + 1; this.enemyDrop(e); sfx.playExplosion(); this.enemies.splice(i, 1); }
                }
            });
            this.idiomBlocks.forEach((m, i) => {
                if (Math.abs(m.pos.x - this.player.pos.x) < 25 && m.pos.y < this.player.pos.y) {
                    m.hp -= 100 * dt; 
                    if(m.hp<=0) { this.blockBreak(m); sfx.playExplosion(); this.idiomBlocks.splice(i, 1); }
                }
            });
        }

        this.texts.pool.forEach(t => { if(t.active) t.update(dt); });

        if (this.invincibleTimer > 0) this.invincibleTimer -= dt;
        if (this.slowTimer > 0) this.slowTimer -= dt;
        if (this.shock) { this.shock.t += dt; if (this.shock.t > 1.2) this.shock = null; }
        this.particles = this.particles.filter(p => (p.life -= dt) > 0);
        this.particles.forEach(p => { p.x += p.vx * dt; p.y += p.vy * dt; });
        if (this.player.rapidFire > 0) this.player.rapidFire -= dt;
        if (this.player.spreadFire > 0) this.player.spreadFire -= dt;
        if (this.laserTimer > 0) this.laserTimer -= dt;
        if (this.pierceTimer > 0) this.pierceTimer -= dt;
        if (this.missileTimer > 0) this.missileTimer -= dt;
        this.updateAllies(dt);
        this.updateDmgTexts(dt);
        this.updateBuffs();
    }

    handleKey(e) {
        const st = this.gameState;
        if (this.dlgOpen) { if (e.code === 'Escape' || e.code === 'KeyO') this.closeDlg(); else if ((e.code === 'Enter' || e.code === 'NumpadEnter') && this.dlgConfirm) this.dlgConfirm(); return; }
        if (st !== 'INIT' && e.code === 'KeyO') { this.openSettings(); return; }
        if (st === 'PLAYING' && e.code === 'KeyH') { this.goHome(); return; }
        const enter = e.code === 'Enter' || e.code === 'NumpadEnter' || e.code === 'Space';
        const m = /^(Digit|Numpad)(\d)$/.exec(e.code); const num = m ? parseInt(m[2]) : 0;
        if (st === 'INIT') { if (!/^(Shift|Control|Alt|Meta)/.test(e.code)) document.getElementById('boot-btn').click(); }
        else if (st === 'LOBBY') {
            if (enter) this.startNewGame();
            else if (e.code === 'KeyS') this.setState('SHOP');
            else if (e.code === 'KeyH') this.openHangar();
            else if (e.code === 'ArrowLeft' || e.code === 'KeyA') this.changeStart(-1);
            else if (e.code === 'ArrowRight' || e.code === 'KeyD') this.changeStart(1);
            else if (e.code === 'KeyR') this.equip(this.recommend(this.startStage).ship.id);
        }
        else if (st === 'HANGAR') {
            if (e.code === 'ArrowLeft' || e.code === 'KeyA') this.hSel((this.hIdx + SHIPS.length - 1) % SHIPS.length);
            else if (e.code === 'ArrowRight' || e.code === 'KeyD') this.hSel((this.hIdx + 1) % SHIPS.length);
            else if (num >= 1 && num <= STAT_KEYS.length) this.upgrade(SHIPS[this.hIdx].id, STAT_KEYS[num - 1][0]);
            else if (enter || e.code === 'KeyE') this.hEquip();
            else if (e.code === 'Escape' || e.code === 'KeyB') this.setState('LOBBY');
        }
        else if (st === 'SHOP') { if (num >= 1) this.buyItem(num - 1); else if (e.code === 'Escape' || e.code === 'KeyB' || enter) this.setState('LOBBY'); } else if (st === 'GAMEOVER' || st === 'VICTORY') { if (enter) this.setState('LOBBY'); else if (e.code === 'KeyR') this.startNewGame(); }
        else if (st === 'PLAYING') {
            if (this.casting) return;
            if (e.code === 'KeyP' || e.code === 'Escape' || (this.paused && enter)) { this.paused = !this.paused; music.pause(this.paused); }
            else if (!this.paused) {
                if (num >= 1) this.useIdiom(num - 1);
                else if (e.code === 'Space') { const i = this.slots.findIndex(x => x.type === 'READY'); if (i >= 0) this.useIdiom(i); }
            }
        }
    }

    pickIdiom() {
        const used = this.slots.map(x => x.word);
        const pool = CONFIG.IDIOMS.filter(i => !used.includes(i.word));
        return pool[Math.floor(Math.random() * pool.length)];
    }

    burst(x, y, n) {
        for (let i = 0; i < n; i++) {
            const a = Math.random() * Math.PI * 2, v = 60 + Math.random() * 200;
            this.particles.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: 0.6 + Math.random() * 0.4, color: ['#ffea00','#ffaa00','#ff3366','#ffffff'][i % 4] });
        }
    }

    tickClear(dt) {   // 區塊清除倒數：不受大招蓄力影響；蓄力中倒數到 0 會等蓄力結束再出發
        if (!(this.clearT > 0)) return;
        this.clearT -= dt;
        if (this.clearT <= 0) { if (this.casting) { this.clearT = 0.001; return; } this.clearT = 0; this.startTransition(this.clearNext); }
    }
    clearStage(next) {   // 區塊清除：倒數 5 秒（可以趁機撿字卡）後才前往下一關
        if (this.pkMode) { this.startTransition(next); return; }
        if (this.clearT > 0 || this.gameState !== 'PLAYING') return;   // 轉場中不可重啟倒數
        this.clearT = 5; this.clearNext = next; document.getElementById('boss-bar').style.display = 'none'; sfx.playReady();
    }
    noteStageClear(st, ms) {   // 擊敗 Boss：先記在「本次出擊」的暫存清單，等結束出擊（退出／結束／陣亡／全破）時才與紀錄榜核對
        if (!(ms > 0)) return; const rc = this.runStageClears = this.runStageClears || {};
        if (!rc[st] || ms < rc[st].ms) rc[st] = { ms, ship: this.shipId };
        const s = ms / 1000, t = Math.floor(s / 60) + ':' + (s % 60).toFixed(1).padStart(4, '0');
        this.showFloatText(`第 ${st} 關擊敗 Boss　${t}`, WORLD.w / 2, WORLD.h * 0.35, '#ffea00');
    }
    randomChar(pNeed) {   // 有機率掉「目前還缺的字」，否則從全部成語隨機抽一個字
        const need = [];
        this.slots.forEach(sl => { if (sl.type === 'COLLECTING') for (const ch of sl.word) if (!sl.chars.includes(ch)) need.push(ch); });
        if (need.length && Math.random() < pNeed) return need[Math.floor(Math.random() * need.length)];
        const w = CONFIG.IDIOMS[Math.floor(Math.random() * CONFIG.IDIOMS.length)].word; return w[Math.floor(Math.random() * 4)];
    }
    enemyDrop(e, k = 1) {   // 擊落敵機：依機種機率掉落字卡（字元）；Boss 一次掉 3 個
        const P = { SCOUT: 0.45, FIGHTER: 0.55, TANK: 1, DART: 0.35, SWARM: 0.25, SNIPER: 0.6, BOMBER: 0.7, GUARD: 0.6, BOSS: 1 }, n = e.type === 'BOSS' ? 3 : 1;
        for (let i = 0; i < n; i++) if (Math.random() < (P[e.type] === undefined ? 0.5 : P[e.type]) * k) this.charItems.push({ pos: new Vec2(e.pos.x + (i - (n - 1) / 2) * 34, e.pos.y), char: this.randomChar(0.6) });
    }

    // 智能掉落：高機率掉落目前需要的字元
    blockBreak(m) {   // 字塊被打爆：一般模式字元往下掉；PK 模式字元飄向打爆的人，並通知對手
        if (this.pkMode && window.online && online.pk) { this.charItems.push({ pos: new Vec2(m.pos.x, m.pos.y), char: m.char, home: 'me' }); online.pkPop(m.id); }
        else this.charItems.push({ pos: new Vec2(m.pos.x, m.pos.y), char: m.char });
    }

    spawnIdiomBlock(x, y) {
        let neededChars = [];
        this.slots.forEach(slot => {
            if (slot.type === 'COLLECTING') {
                for (let char of slot.word) {
                    if (!slot.chars.includes(char)) neededChars.push(char);
                }
            }
        });

        let dropChar;
        if (neededChars.length > 0 && Math.random() < 0.8) {
            dropChar = neededChars[Math.floor(Math.random() * neededChars.length)];
        } else {
            const randomIdiom = CONFIG.IDIOMS[Math.floor(Math.random() * CONFIG.IDIOMS.length)];
            dropChar = randomIdiom.word[Math.floor(Math.random() * 4)];
        }

        this.idiomBlocks.push({ pos: new Vec2(x, y), radius: 25, hp: 6 + this.currentStage*2, char: dropChar, maxHp: 6 + this.currentStage*2 });
    }

    // 無序收集判定
    collectChar(char) {
        let collected = false;
        for (let slot of this.slots) {
            if (slot.type === 'COLLECTING' && slot.word.includes(char) && !slot.chars.includes(char)) {
                slot.chars.push(char);
                collected = true;
                sfx.playCollect();
                this.showFloatText(char, this.player.pos.x, this.player.pos.y - 20, '#00f2ff');

                if (slot.chars.length === 4) {
                    slot.type = 'READY';
                    sfx.playReady();
                    this.showFloatText(`${slot.word} 完成!`, this.player.pos.x, this.player.pos.y - 40, '#ffea00');
                }
                break; // 只要有一個槽位吸收了這個字就跳出
            }
        }

        if (!collected) {
            // 如果吸收的字目前不需要，轉換為暗物質
            this.dropDarkMatter(this.player.pos.x, this.player.pos.y, 10);
            this.showFloatText("轉換DM", this.player.pos.x, this.player.pos.y - 20, '#b026ff');
            sfx.playHit();
        }
        this.renderIdiomSlots();
    }

    draw() {
        const ctx = this.ctx; ctx.setTransform(WORLD.k, 0, 0, WORLD.k, 0, 0);
        ctx.fillStyle = "#050510"; ctx.fillRect(0, 0, WORLD.w, WORLD.h);
        if (this.isMenu()) { this.drawDemo(ctx); return; }
        const bg = BG[this.currentStage];
        if (bg && this.gameState !== 'LOBBY') {
            const W = WORLD.w, H = WORLD.h, h = Math.ceil(bg.height * W / bg.width);
            const off = (this.bgClock * 1000 / (this.gameState === 'TRANSITION' && this.transitionTimer > 1.0 ? 5 : 18)) % h;
            for (let y = off - h; y < H; y += h) ctx.drawImage(bg, 0, Math.floor(y), W, h + 1);
            ctx.fillStyle = 'rgba(0,0,8,0.22)'; ctx.fillRect(0, 0, W, H);
        }

        const starSpeed = this.gameState === 'TRANSITION' && this.transitionTimer > 1.0 ? 200 : 20;
        ctx.fillStyle = "rgba(255,255,255,0.5)";
        for(let i=0; i<40; i++) {
            const x = (Math.sin(i*99) + 1) / 2 * WORLD.w;
            const y = (this.bgClock * starSpeed + i * 200) % WORLD.h;
            ctx.fillRect(x, y, 2, 2);
        }

        if (this.gameState === 'PLAYING' || this.gameState === 'TRANSITION') {
            if (this.laserTimer > 0) {
                const laserWidth = 40 + Math.random() * 10;
                ctx.fillStyle = "rgba(255, 234, 0, 0.8)"; ctx.shadowBlur = 25; ctx.shadowColor = "#ffea00";
                ctx.fillRect(this.player.pos.x - laserWidth/2, 0, laserWidth, this.player.pos.y); ctx.shadowBlur = 0;
                ctx.fillStyle = "#ffffff"; ctx.fillRect(this.player.pos.x - laserWidth/4, 0, laserWidth/2, this.player.pos.y);
            }

            // 【全新：華麗星際戰機繪製】
            ctx.save();
            ctx.translate(this.player.pos.x, this.player.pos.y);
            ctx.scale(SKINS[this.skin].s, SKINS[this.skin].s);
            
            const isInv = this.invincibleTimer > 0;
            const shipImg = IMG['ship_' + SKINS[this.skin].id] || IMG.player;
            if (shipImg) {
                if (isInv) ctx.globalAlpha = 0.6 + 0.4 * Math.sin(this.bgClock * 1000 / 40);
                ctx.shadowColor = SKINS[this.skin].c; ctx.shadowBlur = 18; if (!IMG['ship_' + SKINS[this.skin].id]) ctx.filter = `hue-rotate(${SKINS[this.skin].h}deg)`; fitDraw(ctx, shipImg, shipImg.width / shipImg.height > 1.3 ? 118 : 96); ctx.restore();
            } else {
            const mainColor = isInv ? "#ffea00" : SKINS[this.skin].c;
            const hullColor = "#0f172a"; // 金屬暗灰
            
            ctx.shadowBlur = isInv ? 20 : 10;
            ctx.shadowColor = mainColor;

            // 引擎噴射火焰
            if (isInv || Math.floor(this.bgClock * 1000 / 50) % 2 === 0) {
                const flameLen = (this.gameState === 'TRANSITION' && this.transitionTimer > 1.0) ? 60 : 25 + Math.random() * 15;
                ctx.fillStyle = isInv ? "#ffffff" : "#ffaa00";
                ctx.shadowBlur = 20; ctx.shadowColor = "#ffaa00";
                
                // 左引擎
                ctx.beginPath(); ctx.moveTo(-12, 12); ctx.lineTo(-6, 12); ctx.lineTo(-9, 12 + flameLen); ctx.fill();
                // 右引擎
                ctx.beginPath(); ctx.moveTo(6, 12); ctx.lineTo(12, 12); ctx.lineTo(9, 12 + flameLen); ctx.fill();
            }

            ctx.shadowBlur = isInv ? 15 : 5;
            
            // 主機翼 (外展後掠翼)
            ctx.fillStyle = hullColor;
            ctx.strokeStyle = mainColor;
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(0, -10);
            ctx.lineTo(-30, 15); // 左翼尖
            ctx.lineTo(-30, 20);
            ctx.lineTo(-10, 10);
            ctx.lineTo(10, 10);
            ctx.lineTo(30, 20); // 右翼尖
            ctx.lineTo(30, 15);
            ctx.closePath();
            ctx.fill(); ctx.stroke();

            // 內側輔助翼
            ctx.beginPath();
            ctx.moveTo(0, -15);
            ctx.lineTo(-15, 5);

// ===== 版本更新：上線時檢查線上是不是最新版，不是就跳出「發現新版本」視窗，玩家按下「下載更新」後才清快取並重新載入 =====
// 判斷方式：線上 index.html 的 APP_VERSION 與目前執行中的不同 → 清掉舊的網頁快取與 Service Worker，用新網址重新載入。
// 載入新版後，離線資料包的版本也會對不上，會自動進入「更新資料包」畫面（必須更新完成才能進遊戲）。
// 舊版、或存過舊離線檔案的裝置也一樣：只要上線，就會被更新到最新版本。
const FORCE_UPDATE = {
    busy: false, last: 0,
    overlay(html) {
        let o = document.getElementById('upd-ov');
        if (!o) { o = document.createElement('div'); o.id = 'upd-ov'; o.style.cssText = 'position:fixed;inset:0;z-index:2147483000;background:rgba(5,5,16,.97);color:#fff;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;touch-action:none'; document.body.appendChild(o); }
        o.innerHTML = '<div style="max-width:420px;line-height:1.8">' + html + '</div>';
    },
    async latest() {   // 取得線上最新版本號：優先讀 version.json，讀不到才退回解析 index.html
        try { const r = await fetch('version.json?_=' + Date.now(), { cache: 'reload' }); if (r.ok) { const j = await r.json(); if (j && VER_RE.test(j.version)) return j.version; } } catch (e) {}
        try { const r = await fetch('index.html?_=' + Date.now(), { cache: 'reload' }); if (r.ok) { const m = /const APP_VERSION = '([^']+)'/.exec(await r.text()); if (m && VER_RE.test(m[1])) return m[1]; } } catch (e) {}
        return null;
    },
    async check(force) {
        try {
            if (this.busy || !/^https?:$/.test(location.protocol) || !navigator.onLine) return;
            const gs = game.gameState; if (!force && (gs === 'PLAYING' || gs === 'TRANSITION')) return;   // 不打斷進行中的出擊，回到大廳後再更新
            if (!force && Date.now() - this.last < 60000) return; this.last = Date.now();
            const v = await this.latest(); if (!v) return;
            if (!verNewer(v, APP_VERSION)) { try { sessionStorage.removeItem('idiomUpd'); } catch (e) {} return; }   // 線上版本不比目前新 → 不用更新
            this.prompt(v);   // 不再自動更新：跳出視窗，等玩家按下「下載更新」
        } catch (e) {}
    },
    prompt(newV) {
        if (this.prompting || this.busy) return; this.prompting = true; this.pendingV = newV;
        this.overlay(`<h2 style="color:#00f2ff;margin:0 0 8px">發現新版本</h2><p>目前版本 ${APP_VERSION} → 最新版本 ${newV}<br>請先更新後再開始遊戲。</p>
            <button class="btn btn-start" onclick="FORCE_UPDATE.run('${newV}')">下載更新 [Enter]</button>`);
    },
    async run(newV) {
        this.busy = true;
        let t = {}; try { t = JSON.parse(sessionStorage.getItem('idiomUpd') || '{}'); } catch (e) {}
        if (t.v !== newV) t = { v: newV, n: 0 };
        if (t.n >= 3) { this.fail(newV); return; }   // 連續 3 次還是舊版（網路或 CDN 快取問題）→ 顯示失敗畫面，仍不能進遊戲
        t.n++; try { sessionStorage.setItem('idiomUpd', JSON.stringify(t)); } catch (e) {}
        this.overlay(`<h2 style="color:#00f2ff;margin:0 0 8px">發現新版本</h2><p>目前版本 ${APP_VERSION} → 最新版本 ${newV}<br>正在下載更新，請稍候…</p>`);
        try { game.save(); } catch (e) {}
        try { if (navigator.serviceWorker) for (const g of await navigator.serviceWorker.getRegistrations()) await g.unregister(); } catch (e) {}
        try { for (const k of await caches.keys()) if (k.startsWith('idiom-shell-')) await caches.delete(k); } catch (e) {}
        location.replace(location.pathname + '?v=' + encodeURIComponent(newV) + '_' + t.n);   // 換新網址，繞過瀏覽器 HTTP 快取
    },
    fail(newV) {
        this.overlay(`<h2 style="color:#ff6b6b;margin:0 0 8px">更新失敗</h2><p>需要更新到版本 ${newV}，但目前仍載入到舊版。<br>請確認網路後重試；若一直失敗，請清除資料後再更新。</p>
            <button class="btn btn-start" onclick="FORCE_UPDATE.retry()">重新更新</button><button class="btn" onclick="game.wipeAll()">清除資料並更新</button>`);
    },
    retry() { try { sessionStorage.removeItem('idiomUpd'); } catch (e) {} this.busy = false; this.prompting = false; this.check(true); }
};

// ---------- Firebase ----------
let auth = null, db = null, fbOk = false;
try { firebase.initializeApp(CFG); auth = firebase.auth(); db = firebase.firestore(); try { firebase.analytics(); } catch (e) {} fbOk = true; } catch (e) { console.warn('Firebase 無法初始化', e); }

const online = window.online = {
    fbOk, user: null, profile: null, isAdmin: false, friends: [], reqIn: [], invites: [], groups: [], unsubs: [], pk: null, pending: null,
    chat: { open: false, tab: 'lobby', th: null, unsub: null, msgs: [], unread: 0, first: true, dmReady: {}, notes: [] },
    ONL_MS: 5 * 60 * 1000, onl: {}, nm: {}, onlSet: null, fTop: {}, lastPres: 0,

    // ===== 登入 / 帳號 =====
    afterBoot() { Promise.race([this.authReady || Promise.resolve(), new Promise(r => setTimeout(r, 12000))]).then(() => { if ((this.user || this.offline) && this.profile) G.setState(this.profile.tutorialDone ? 'LOBBY' : 'TUTORIAL'); else G.setState('LOGIN'); }); },
    renderLogin(reg) {
        ui(`<div class="menu-overlay" style="width:min(92vw,380px)"><h2 class="shop-title">${reg ? '註冊帳號' : '登入'}</h2>
            <div id="lg-msg" class="lg-msg">${fbOk ? '' : '無法載入 Firebase，請確認網路後重新整理頁面'}</div>
            <input class="inp" id="lg-user" placeholder="帳號（英數字或底線，3~16 字）" autocomplete="username" autocapitalize="none">
            ${reg ? '<input class="inp" id="lg-name" maxlength="12" placeholder="暱稱（最多 12 字）">' : ''}
            <input class="inp" id="lg-pass" type="password" placeholder="密碼（至少 6 碼）" autocomplete="${reg ? 'new-password' : 'current-password'}">
            <button class="btn btn-start" id="lg-go">${reg ? '註冊並登入' : '登入'}</button>
            <button class="btn" id="lg-sw">${reg ? '已有帳號？回到登入' : '沒有帳號？註冊'}</button>
            ${(!navigator.onLine || !fbOk) && this.readMirror() ? `<button class="btn" id="lg-off">離線遊玩（${esc(this.readMirror().name)} 的進度）</button>` : ''}</div>`);
        $('lg-go').onclick = () => this.submitLogin(reg); $('lg-sw').onclick = () => this.renderLogin(!reg); if ($('lg-off')) $('lg-off').onclick = () => this.startOffline();
        $('lg-pass').onkeydown = e => { if (e.key === 'Enter') this.submitLogin(reg); };
    },
    async submitLogin(reg) {
        const msg = t => { const m = $('lg-msg'); if (m) m.textContent = t; };
        if (!fbOk) return msg('無法連線到 Firebase');
        const u = $('lg-user').value.trim().toLowerCase(), p = $('lg-pass').value, name = reg ? $('lg-name').value.trim() : '';
        if (!/^[a-z0-9_]{3,16}$/.test(u)) return msg('帳號需為 3~16 字的英文、數字或底線');
        if (p.length < 6) return msg('密碼至少 6 碼');
        $('lg-go').disabled = true; msg('處理中…');
        try {
            if (reg) { this.pending = name || u; await auth.createUserWithEmailAndPassword(u + MAIL, p); }
            else await auth.signInWithEmailAndPassword(u + MAIL, p);
        } catch (e) { msg(errMsg(e)); const b = $('lg-go'); if (b) b.disabled = false; }
    },
    async onLogin(u) {
        try { const bs = await Promise.race([db.collection('banned').doc(u.uid).get(), new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), 8000))]); if (bs.exists) { this.user = u; await this.kick(bs.data()); return; } else { const k = JSON.parse(localStorage.getItem('idiomBanned') || 'null'); if (k && k.uid === u.uid) localStorage.removeItem('idiomBanned'); } } catch (e) {}
        this.offline = false; this.user = u; const username = (u.email || '').split('@')[0], ref = db.collection('users').doc(u.uid);
        let snap;
        try { snap = await Promise.race([ref.get(), new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), navigator.onLine ? 10000 : 1500))]); }
        catch (e) { const m = this.readMirror(); if (m && m.uid === u.uid) { this.user = null; this.startOffline(); return; } throw e; }
        if (!snap.exists) {
            const name = this.pending || username;
            this.profile = { username, name, nameLower: name.toLowerCase(), bestScore: 0, totalDM: 0, spentDM: 0, pkWins: 0, pkLosses: 0, tutorialDone: false, createdAt: Date.now() };
            localStorage.removeItem(SAVEKEY); G.resetProgress(); await ref.set(this.profile);
        } else {
            this.profile = snap.data();
            if (this.profile.save) localStorage.setItem(SAVEKEY, JSON.stringify(this.profile.save)); else localStorage.removeItem(SAVEKEY);
            G.resetProgress(); G.load(); G.applyUpgrades();
        }
        this.pending = null; this._adminSeen = this.profile.adminAt || 0; this._pendingAdmin = null;
        { const m = this.readMirror();   // 離線期間的進度比雲端新 → 以離線進度為準並同步上去
          if (m && m.uid === u.uid && m.dirty && m.save && (m.updatedAt || 0) > (this.profile.updatedAt || 0)) {
            Object.assign(this.profile, m.profile); localStorage.setItem(SAVEKEY, JSON.stringify(m.save)); G.resetProgress(); G.load(); G.applyUpgrades(); this.queuePush(); toast('已同步離線期間的進度');
          } }
        try { this.isAdmin = (await db.collection('admins').doc(u.uid).get()).exists; } catch (e) { this.isAdmin = false; }
        this.startListeners(); this.mountChat();
        if (G.gameState === 'LOGIN') G.setState(this.profile.tutorialDone ? 'LOBBY' : 'TUTORIAL');
    },
    async kick(b) {   // 黑名單：登出並顯示停權原因
        const reason = (b && b.reason) || '（管理員未填寫原因）';
        try { localStorage.setItem('idiomBanned', JSON.stringify({ uid: (this.user && this.user.uid) || (b && b.uid) || '', reason })); } catch (e) {}

    },

    // ===== 離線模式：裝置上保留最近一次登入的進度 =====

    writeMirror() {
        const uid = this.user ? this.user.uid : this.offlineUid; if (!uid || !this.profile) return;

        this.offline = true; this.offlineUid = m.uid; this.user = null;
        this.profile = Object.assign({ username: m.username, name: m.name, tutorialDone: true }, m.profile);

    // ===== 雲端存檔 / 統計 =====
    queuePush() { this._dirty = true; this.writeMirror(); clearTimeout(this._pt); this._pt = setTimeout(() => this.pushNow(), 1500); },
    pushNow() {
        if (!this.user || !this.profile || !db || this._pendingAdmin) return;
        let sv = null; try { sv = JSON.parse(localStorage.getItem(SAVEKEY) || 'null'); } catch (e) {}
        const doc = Object.assign({}, this.profile, { save: sv, darkMatter: G.darkMatter, updatedAt: Date.now() });
        if (this.isAdmin || this.profile.username === ADMIN_USER) doc.hideRank = true;   // 管理員不列入排行榜

    },
    stat(k, d) { if (!this.profile) return; this.profile[k] = (this.profile[k] || 0) + d; this.queuePush(); },
    topShip(p) { const u = (p && p.shipUse) || {}; let best = null, n = 0; Object.keys(u).forEach(k => { if (u[k] > n) { n = u[k]; best = k; } }); return best || (p && p.topShip) || 'star'; },
    settleStages() {   // 結束出擊時：把本次擊敗 Boss 的各關成績與紀錄榜（個人最佳）核對，破紀錄就記上
        if (!this.profile || G.pkMode) return [];
        const rc = G.runStageClears, keys = rc ? Object.keys(rc) : [];
        if (!keys.length) return this._rep && this._rep.seq === G.runSeq ? this._rep.items : [];   // 同一局重複結算時沿用結果
        const items = [], at = Date.now();
        keys.map(Number).sort((x, y) => x - y).forEach(st => {
            const k = 's' + st, c = rc[st], old = this.profile[k + 'Ms'];
            if (old === undefined || c.ms < old) {

    finishRun(victory) {
        if (!this.profile || G.pkMode) return;
        { const use = this.profile.shipUse = Object.assign({}, this.profile.shipUse), sid = G.shipId; use[sid] = (use[sid] || 0) + 1; this.profile.topShip = this.topShip(this.profile); }
        const score = Math.round((G.runDM || 0) * 10); this.profile.bestScore = Math.max(this.profile.bestScore || 0, score);
        const rep = this.settleStages();   // 不論退出、結束、陣亡或全破，都先把各關擊敗 Boss 的成績核對進紀錄榜
        const stx = rep.length ? '<span style="display:block;text-align:left;line-height:1.6;margin-top:4px">' + rep.map(r => `第 ${r.st} 關 ${fmtTime(r.ms)}　` + (r.isNew ? '<b style="color:#33ff88">新紀錄！</b>' + (r.old !== undefined ? `（原 ${fmtTime(r.old)}）` : '') : `（個人紀錄 ${fmtTime(r.best)}）`)).join('<br>') + '</span>' : '';
        let extra = '';

            const ms = Math.round(G.runClock * 1000), best = this.profile.bestClearMs;
            if (best === undefined || ms < best) {

            } else extra = `<br>全關卡破關時間 ${fmtTime(ms)}（個人紀錄 ${fmtTime(best)}）`;
        } else if (victory) extra = '<br><small>從第 1 關出發並通關才會計入「全關卡破關時間」排行</small>';

    // ===== 上線狀態：5 分鐘內有活動＝在線，5 分鐘沒活動自動變下線 =====
    touch(force) {

            this.lastPres = now;

        }
    },
    goOffline() {
        if (!this.user || !this.profile || !db) return; this.lastPres = 0;

    },
    startPresence() {
        if (!this._actBound) {
            this._actBound = true;
            ['pointerdown', 'pointermove', 'keydown', 'touchstart'].forEach(ev => window.addEventListener(ev, () => online.touch(), { passive: true }));
            window.addEventListener('pagehide', () => { try { if (online.settleStages().some(x => x.isNew)) { online.queuePush(); online.pushNow(); } } catch (e) {} online.goOffline(); });
        }
        this.onl = {}; this.onlSet = null; this._presT0 = Date.now(); this.touch(true);
        this.unsubs.push(db.collection('presence').where('lastActive', '>', Date.now() - 30 * 60000).onSnapshot(s => {
            this.onl = {}; s.docs.forEach(d => { this.onl[d.id] = d.data(); this.nm[d.id] = d.data().name; }); this.evalOnline();
        }, () => {}));
        clearInterval(this._onlTimer); this._onlTimer = setInterval(() => this.evalOnline(), 15000);
        this.unsubs.push(() => clearInterval(this._onlTimer));
    },

            cur.forEach(id => { if (!this.onlSet.has(id)) { changed = true; if (id !== me) this.lobbyNote((this.nm[id] || '玩家') + '上線囉!', 1); } });
            this.onlSet.forEach(id => { if (!cur.has(id)) { changed = true; if (id !== me) this.lobbyNote((this.nm[id] || '玩家') + '下線囉!', 2); } });

    async addFriend(name) {

    // ===== 未讀訊息：大廳、每位好友、每個群組都會背景監聽，紅點顯示總數（最多 99+）=====
    thKey(th) { return th.k === 'lobby' ? 'lobby' : th.k === 'dm' ? 'dm:' + th.peer : 'group:' + th.id; },
    saveRead() { try { localStorage.setItem('idiomRead:' + this.user.uid, JSON.stringify(this.readAt)); } catch (e) {} },
    syncWatch() {
        if (!this.user) return; this.watch = this.watch || {};
        if (!this.readAt) { try { this.readAt = JSON.parse(localStorage.getItem('idiomRead:' + this.user.uid) || '{}'); } catch (e) { this.readAt = {}; } }
        const keys = new Set();
        [{ k: 'lobby' }, ...this.friends.map(f => ({ k: 'dm', peer: f.uid })), ...this.groups.map(g => ({ k: 'group', id: g.id }))].forEach(th => {
            const key = this.thKey(th); keys.add(key); if (this.watch[key]) return;
            if (this.readAt[key] === undefined) { this.readAt[key] = Date.now(); this.saveRead(); }   // 第一次看到的對話，舊訊息視為已讀
            const w = this.watch[key] = { msgs: [], unsub: null };
            w.unsub = this.chatRef(th).orderBy('ts', 'desc').limit(60).onSnapshot(sn => { w.msgs = sn.docs.map(d => d.data()); this.recount(); }, () => {});
        });
        Object.keys(this.watch).forEach(k => { if (!keys.has(k)) { this.watch[k].unsub(); delete this.watch[k]; } });
    },
    stopWatch() { Object.values(this.watch || {}).forEach(w => { try { w.unsub(); } catch (e) {} }); this.watch = {}; this.readAt = null; this.unr = {}; },
    recount() {
        if (!this.user || !this.readAt) return; const c = this.chat, me = this.user.uid, W = this.watch || {};
        if (c.open && c.th) { const key = this.thKey(c.th), w = W[key], latest = w && w.msgs[0] ? (w.msgs[0].ts || 0) : 0; this.readAt[key] = Math.max(this.readAt[key] || 0, latest || Date.now()); this.saveRead(); }   // 正在看的對話＝已讀
        const per = { lobby: 0, dm: 0, group: 0 }, unr = {}; let total = 0;
        Object.keys(W).forEach(key => { const r = this.readAt[key] || 0, n = W[key].msgs.filter(m => m.uid !== me && (m.ts || 0) > r).length; if (n) { unr[key] = n; total += n; per[key.split(':')[0]] += n; } });
        const changed = JSON.stringify(unr) !== JSON.stringify(this.unr || {}); this.unr = unr;
        const fmt = n => n > 99 ? '99+' : String(n), b = $('chat-badge'); if (b) { b.textContent = fmt(total); b.style.display = total ? 'block' : 'none'; }
        const NM = { lobby: '大廳', dm: '好友', group: '群組' };
        document.querySelectorAll('#chat-panel .ch-tabs button').forEach(bt => { const n = per[bt.dataset.t] || 0; bt.innerHTML = NM[bt.dataset.t] + (n ? `<i class="tbd">${fmt(n)}</i>` : ''); });
        if (changed) { if (c.open && c.tab !== 'lobby') this.chatSel(); if (G.gameState === 'FRIENDS') this.refresh(); }
    },

    roomRef(code) { return db.collection('rooms').doc(code); },
    async createRoom() {
        if (this.pk) return;
        try {
            for (let i = 0; i < 8; i++) {
                const code = String(Math.floor(1000 + Math.random() * 9000)), ref = this.roomRef(code);
                const ok = await db.runTransaction(async tx => {
                    const s = await tx.get(ref);
                    if (s.exists && s.data().state !== 'ended' && Date.now() - (s.data().createdAtMs || 0) < 2 * 3600 * 1000) return false;
                    tx.set(ref, { code, host: this.user.uid, hostName: this.profile.name, guest: null, guestName: '', stage: 1, hostShip: G.shipId, guestShip: '', hostReady: false, guestReady: false, state: 'lobby', createdAtMs: Date.now() });
                    return true;
                });
                if (ok) return this.enterRoom(code, 'host');

            toast('建立房間失敗，請再試一次');
        } catch (e) { toast(errMsg(e)); }

    async joinRoom(code) {

            const r = s.data(); if (r.guest && r.guest !== this.user.uid) return toast('房間已滿');
            if (r.host === this.user.uid) return toast('你是這個房間的主控端');
            await ref.update({ guest: this.user.uid, guestName: this.profile.name, guestShip: G.shipId, guestReady: false });
            this.enterRoom(code, 'guest');
        } catch (e) { toast(errMsg(e)); }
    },

        const p = this.pk = { code, role, room: null, started: false, over: false, castQ: [], seen: new Set(), lastHp: -1, lastPush: 0 };
        p.unsub = this.roomRef(code).onSnapshot(s => {
            if (!this.pk || this.pk !== p) return;
            if (!s.exists) { if (!p.over) { toast('房間已關閉'); this.pkLeave(false); } return; }
            p.room = s.data(); const r = p.room;
            if (role === 'host' && r.guest === null && p.started) { /* 對手離開 */ }
            if (r.state === 'playing' && !p.started) this.startMatch(); else if (r.state === 'ended' && !p.over) this.endMatch(r.winner); else if (G.gameState === 'PK') this.renderPK();

        if (G.gameState !== 'PK') G.setState('PK'); else this.renderPK();

    pkReady() { const k = this.pk.role + 'Ready'; this.roomUpdate({ [k]: !this.pk.room[k] }); },

        clearInterval(this._pkTimer); const h = $('pk-hud'); if (h) h.remove();

    startMatch() {
