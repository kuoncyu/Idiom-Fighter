<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#050510">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="apple-touch-icon" href="icon-192.png">
    <title>成語戰機：星際觸控版</title>
    <style>
        *, *::before, *::after, button, input, textarea, select { font-family: 'DFKai-SB','BiauKai','標楷體','KaiTi','Kaiti TC',serif !important; }
        :root {
            --neon-blue: #00f2ff;
            --neon-pink: #ff00ff;
            --neon-gold: #ffea00;
            --neon-purple: #b026ff;
            --neon-green: #00ffcc;
            --neon-orange: #ffaa00;
            --neon-red: #ff3366;
            --bg-dark: #050510;
        }
        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-dark);
            color: white;
            font-family: 'DFKai-SB', 'BiauKai', '標楷體', 'KaiTi', 'Kaiti TC', 'STKaiti', 'AR PL UKai TW', serif;
            overflow: hidden;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
        }
        #game-container {
            position: relative;
            width: var(--app-w, 100vw);
            height: var(--app-h, 100vh);
            display: flex;
            justify-content: center;
            align-items: center;
        }
        canvas {
            background: #020205;
            display: block;
            box-shadow: 0 0 20px rgba(0, 242, 255, 0.2);
            touch-action: none;
        }
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }
        .menu-overlay {
            background: rgba(5, 5, 16, 0.95);
            border: 2px solid var(--neon-blue);
            padding: 30px;
            border-radius: 15px;
            text-align: center;
            pointer-events: auto;
            min-width: 320px;
            box-shadow: 0 0 30px rgba(0, 242, 255, 0.3);
            max-height: 80vh;
            overflow-y: auto;
        }
        * { text-shadow: none !important; }
        h1, h2 { color: var(--neon-blue); text-shadow: 0 0 10px var(--neon-blue); margin-bottom: 20px; }
        .shop-title { color: var(--neon-purple); text-shadow: 0 0 10px var(--neon-purple); margin-top: 0; }
        .btn {
            background: rgba(0, 242, 255, 0.1); border: 1px solid var(--neon-blue);
            color: var(--neon-blue); padding: 12px 20px; margin: 10px auto; cursor: pointer;
            font-size: 1.1rem; transition: all 0.3s; border-radius: 5px; display: block;
            width: 90%; text-transform: uppercase; font-weight: bold;
        }
        .btn:hover:not(:disabled) { background: var(--neon-blue); color: black; box-shadow: 0 0 15px var(--neon-blue); }
        .btn:disabled { border-color: #555; color: #555; cursor: not-allowed; background: transparent; }
        .btn-shop { border-color: var(--neon-purple); color: var(--neon-purple); }
        .btn-shop.shop-row { display: flex; align-items: center; gap: 12px; text-align: left; width: min(92vw, 520px); }
        .shop-ic { flex: none; width: 64px; height: 64px; display: flex; align-items: center; justify-content: center; border-radius: 12px; background: radial-gradient(circle at 50% 40%, rgba(255,255,255,0.14), rgba(255,255,255,0.03) 70%); border: 1px solid rgba(255,255,255,0.18); }
        .shop-ic img, .shop-ic svg { max-width: 56px; max-height: 56px; width: auto; height: auto; object-fit: contain; }
        .shop-ic svg { width: 52px; height: 52px; }
        .shop-tx { flex: 1; min-width: 0; line-height: 1.5; }
        .btn-shop:disabled .shop-ic img { filter: grayscale(0.6) opacity(0.7); }
        .btn-shop:hover:not(:disabled) { background: var(--neon-purple); color: white; box-shadow: 0 0 15px var(--neon-purple); }
        .btn-start { background: rgba(0, 242, 255, 0.2); font-size: 1.3rem; padding: 15px; margin-top: 20px; }
        
        #hud {
            position: absolute; top: 10px; left: 10px; right: 10px; display: flex;
            justify-content: space-between; pointer-events: none; font-family: 'DFKai-SB', 'BiauKai', '標楷體', 'KaiTi', 'Kaiti TC', 'STKaiti', 'AR PL UKai TW', serif;
            font-size: 1rem; color: var(--neon-blue); background: rgba(0,0,0,0.6);
            padding: 10px 15px; border-radius: 10px; border: 1px solid rgba(0,242,255,0.3); z-index: 5;
        }
        .hud-item { margin: 0 5px; }
        .hud-dm { color: var(--neon-purple); font-weight: bold; text-shadow: 0 0 5px var(--neon-purple); }
        
        #stage-info {
            position: absolute; top: 60px; left: 50%; transform: translateX(-50%);
            color: var(--neon-gold); font-weight: bold; font-size: 1.2rem; text-shadow: 0 0 5px black;
        }
        .boss-hp-bar { position: absolute; top: 90px; left: 50%; transform: translateX(-50%); width: 80%; height: 10px; background: #333; border: 1px solid white; display: none; }
        .boss-hp-fill { width: 100%; height: 100%; background: linear-gradient(to right, #f00, #ff0); transition: width 0.2s; }
        
        .idiom-slots {
            position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
            display: flex; gap: 10px; align-items: flex-end; z-index: 20; flex-wrap: nowrap; justify-content: center; width: 98%; pointer-events: none;
        }
        .slot {
            flex: 1; max-width: 120px; height: 80px; border: 2px solid #444; background: rgba(0,0,0,0.8);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            border-radius: 8px; transition: all 0.3s; pointer-events: none; position: relative;
        }
        .slot.collecting { border-color: var(--neon-blue); box-shadow: 0 0 8px rgba(0, 242, 255, 0.3); }
        .slot.ready { 
            border-color: var(--neon-gold); box-shadow: 0 0 20px var(--neon-gold); 
            cursor: pointer; pointer-events: auto; animation: pulseReady 0.8s infinite alternate;
            background: rgba(255, 234, 0, 0.15);
        }
        
        .slot-title { font-size: 1.2rem; margin-bottom: 5px; white-space: nowrap; display: flex; gap: 2px; }
        .char { display: inline-block; transition: all 0.3s; font-weight: bold; }
        .char.collected { color: var(--neon-blue); text-shadow: 0 0 8px var(--neon-blue); transform: scale(1.1); }
        .char.uncollected { color: rgba(255,255,255,0.2); }
        
        .slot-subtitle { font-size: 0.7rem; color: #aaa; text-align: center; }
        .ready .char.collected { color: var(--neon-gold); text-shadow: 0 0 10px var(--neon-gold); }
        .ready .slot-subtitle { color: var(--neon-gold); font-weight: bold; font-size: 0.8rem; text-shadow: 0 0 5px var(--neon-gold); }
        
        @keyframes pulseReady { 
            from { box-shadow: 0 0 10px var(--neon-gold); border-color: var(--neon-gold); transform: scale(1); } 
            to { box-shadow: 0 0 30px var(--neon-gold), inset 0 0 15px var(--neon-gold); border-color: #fff; transform: scale(1.05); } 
        }
        .slot { overflow: visible; }
        .slot-key { position:absolute; top:-10px; left:-6px; width:22px; height:22px; line-height:22px; text-align:center;
            font: bold 0.85rem 'DFKai-SB','BiauKai','標楷體','KaiTi','Kaiti TC',serif; background:#050510; border:1px solid var(--neon-blue); color:var(--neon-blue); border-radius:5px; }
        .slot.ready .slot-key { background:var(--neon-gold); color:#000; border-color:var(--neon-gold); box-shadow:0 0 10px var(--neon-gold); }
        #idiom-popup { display:none; position:absolute; left:50%; top:42%; transform:translate(-50%,-50%); z-index:30; width:min(86vw,460px);
            padding:22px 26px; text-align:center; background:rgba(5,5,16,.94); border:2px solid var(--neon-gold); border-radius:14px;
            box-shadow:0 0 35px rgba(255,234,0,.45); pointer-events:none; }
        .ip-word { font-size:2.4rem; font-weight:bold; letter-spacing:.2em; color:var(--neon-gold); text-shadow:0 0 12px var(--neon-gold); }
        .ip-effect { color:var(--neon-purple); margin:6px 0 12px; font-weight:bold; }
        .ip-line { text-align:left; line-height:1.7; color:#e8f7ff; font-size:1.05rem; }
        .ip-line b { color:var(--neon-blue); }
        .ip-bar { height:6px; background:#333; border-radius:3px; margin-top:16px; overflow:hidden; }
        .ip-bar i { display:block; height:100%; background:var(--neon-gold); animation: ipCount 5s linear forwards; }
        @keyframes ipCount { from { width:0; } to { width:100%; } }
        .cards { display:flex; flex-wrap:wrap; gap:12px; justify-content:center; width:100%; margin:10px 0; }
        .card { width:262px; background:rgba(10,12,30,.92); border:2px solid #334; border-radius:12px; padding:10px; text-align:left; cursor:pointer; }
        .card.sel { border-color:var(--neon-blue); box-shadow:0 0 14px var(--neon-blue); }
        .card h3 { margin:4px 0; color:#fff; font-size:1.05rem; }
        .card.eq h3::after { content:' ✔出戰中'; color:var(--neon-gold); font-size:.8rem; }
        .card img { width:100%; height:90px; object-fit:contain; }
        .card.locked img { filter:grayscale(1) brightness(.5); }
        .card .st { display:flex; align-items:center; gap:6px; margin:5px 0; font-size:.8rem; }
        .card .st span { width:34px; } .card .st b { width:46px; text-align:right; color:var(--neon-gold); font-size:.78rem; }
        .card .bar { flex:1; height:8px; border-radius:4px; } .card .bar i { display:block; height:100%; border-radius:4px; background:var(--neon-blue); }
        .card .st em.lv { font-style:normal; width:38px; text-align:center; font-size:.72rem; color:#9fe8ff; white-space:nowrap; }
        .card .st em.lv.max { color:var(--neon-gold); }
        .card .st button { font-size:.7rem; padding:2px 5px; background:rgba(0,242,255,.15); border:1px solid var(--neon-blue); color:#fff; border-radius:4px; cursor:pointer; }
        .card .st button:disabled { opacity:.35; cursor:default; }
        .hbtn { pointer-events:auto; background:rgba(0,242,255,.12); border:1px solid var(--neon-blue); color:var(--neon-blue); border-radius:8px; padding:4px 10px; margin-right:6px; cursor:pointer; font-size:.9rem; font-family:inherit; }
        .hbtn:hover { background:rgba(0,242,255,.35); }
        #buff-bar { position:absolute; top:66px; left:12px; display:flex; flex-wrap:wrap; gap:6px; max-width:48%; z-index:6; pointer-events:none; }
        .buff { position:relative; overflow:hidden; min-width:96px; padding:3px 8px 6px; border-radius:8px; background:rgba(0,0,0,.65); border:1px solid var(--c); color:var(--c); font-size:.75rem; font-weight:bold; }
        .buff i { position:absolute; left:0; bottom:0; height:3px; background:var(--c); }
        .dlg { display:none; position:absolute; inset:0; z-index:60; background:rgba(0,0,10,.72); align-items:center; justify-content:center; }
        .dlg .box { max-height:90%; overflow-y:auto; background:#0a0a1a; border:2px solid var(--neon-blue); border-radius:14px; padding:20px 26px; min-width:270px; max-width:90vw; text-align:center; box-shadow:0 0 25px rgba(0,242,255,.4); color:#fff; }
        .dlg label { display:block; margin:12px 0; font-size:.9rem; text-align:left; } .dlg input[type=range] { width:100%; }
        .lob-title { margin:0; letter-spacing:.3em; text-shadow:0 0 18px var(--neon-blue); }
        .dmline { color:var(--neon-purple); margin:4px 0 8px; }
        .tiles { display:grid; grid-template-columns:repeat(4,1fr); gap:10px; width:100%; margin:6px auto; }
        .tile { position:relative; overflow:hidden; border-radius:14px; padding:12px; min-height:110px; color:#fff; text-align:left; cursor:pointer; border:1px solid rgba(255,255,255,.18);
            background:linear-gradient(135deg,var(--a),var(--b)); transition:transform .2s, box-shadow .2s; }   /* 靜態磚：不再有漸層流動與翻面動畫 */
        .tile:hover { transform:translateY(-4px) scale(1.03); box-shadow:0 8px 22px rgba(0,0,0,.5), 0 0 16px var(--a); }
        .tile.w2 { grid-column:span 2; } .tile.h2 { grid-row:span 2; min-height:230px; }
        .tile h4 { margin:0 0 4px; font-size:1.05rem; } .tile small { display:block; opacity:.9; line-height:1.45; }
        .tile .f1, .tile .f2 { position:absolute; inset:0; padding:12px; display:flex; flex-direction:column; justify-content:center; }
        .tile.live .f1 { animation:liveA 7s infinite; } .tile.live .f2 { animation:liveB 7s infinite; }
        .tile img { position:absolute; right:6px; bottom:4px; height:78%; max-width:55%; object-fit:contain; filter:drop-shadow(0 0 8px rgba(0,0,0,.7)); }
        .tile .ico { position:absolute; right:10px; bottom:4px; font-size:2.2rem; opacity:.35; }
        .tile.pic { animation:tileIn .55s var(--d,0s) both; background-size:cover; background-position:center; }
        .stg { display:flex; align-items:center; gap:12px; margin:6px 0; font-size:1.2rem; }
        .stg button { background:rgba(0,0,0,.5); border:1px solid #fff; color:#fff; border-radius:8px; padding:2px 12px; cursor:pointer; }
        .roster { color:#8aa; font-size:.8rem; }
        .menu-overlay.lobby { background:rgba(5,5,16,.22); border:3px solid var(--neon-blue); border-radius:18px; box-shadow:0 0 22px rgba(0,242,255,.55), inset 0 0 18px rgba(0,242,255,.25); }
        .tile .stg { margin:4px 0 6px; } .tile .sm2 { margin-top:6px; align-self:flex-start; padding:3px 10px; border-radius:8px; border:1px solid #fff; background:rgba(0,0,0,.45); color:#fff; cursor:pointer; font-family:inherit; font-size:.8rem; }
        @keyframes liveA { 0%,42% { opacity:1; transform:translateY(0); } 50%,92% { opacity:0; transform:translateY(-100%); } 100% { opacity:1; transform:translateY(0); } }
        @keyframes liveB { 0%,42% { opacity:0; transform:translateY(100%); } 50%,92% { opacity:1; transform:translateY(0); } 100% { opacity:0; transform:translateY(100%); } }
        @keyframes tileIn { from { opacity:0; transform:scale(.85) translateY(14px); } to { opacity:1; transform:none; } }
        @keyframes tileShift { 0%,100% { background-position:0% 50%; } 50% { background-position:100% 50%; } }
        @media (max-width:560px) { .tiles { grid-template-columns:repeat(2,1fr); } .tile.w2 { grid-column:span 2; } }
        .splash { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; pointer-events:auto; cursor:pointer; overflow:hidden; z-index:50; background:radial-gradient(ellipse at center,rgba(13,27,61,.32) 0%,rgba(5,5,16,.7) 78%); }
        .sp-title { font-size:clamp(2.6rem,10vw,5rem); letter-spacing:.25em; margin:0; color:#fff; animation:spGlow 3s ease-in-out infinite alternate; }
        @keyframes spGlow { from { text-shadow:0 0 10px var(--neon-blue); } to { text-shadow:0 0 30px var(--neon-blue),0 0 70px var(--neon-purple); } }
        .sp-sub { color:var(--neon-blue); letter-spacing:.6em; margin:6px 0 34px; }
        .sp-hint { color:#8aa; font-size:.85rem; animation:spBlink 1.6s infinite; } @keyframes spBlink { 50% { opacity:.3; } }
        #hud { font-size:clamp(.7rem,3.3vw,1rem); padding:clamp(4px,1.6vw,10px) clamp(6px,3vw,15px); top:max(6px,env(safe-area-inset-top)); left:clamp(4px,2vw,10px); right:clamp(4px,2vw,10px); }
        .hud-item { margin:0 clamp(2px,1vw,5px); }
        .hbtn { font-size:clamp(.62rem,3vw,.9rem); padding:3px clamp(5px,2vw,10px); margin-right:clamp(2px,1vw,6px); }
        #stage-info { top:clamp(42px,12vw,60px); font-size:clamp(.8rem,4vw,1.2rem); }
        #buff-bar { top:clamp(66px,18vw,70px); left:clamp(4px,2vw,12px); gap:clamp(3px,1vw,6px); max-width:62%; }
        .buff { min-width:clamp(62px,19vw,96px); font-size:clamp(.58rem,2.7vw,.75rem); padding:2px 6px 5px; }
        .boss-hp-bar { top:clamp(92px,24vw,96px); }
        .idiom-slots { bottom:max(8px,env(safe-area-inset-bottom)); gap:clamp(3px,1.2vw,10px); }
        .slot { min-width:0; height:clamp(52px,15vw,80px); }
        .slot-title { font-size:min(1.2rem,calc((96vw - (var(--n,6) - 1) * 6px) / var(--n,6) / 4.7)); margin-bottom:2px; gap:1px; }
        .slot-subtitle { font-size:clamp(.5rem,2.4vw,.7rem); line-height:1.15; padding:0 2px; }
        .ready .slot-subtitle { font-size:clamp(.54rem,2.6vw,.8rem); }
        .slot-key { width:clamp(15px,5vw,22px); height:clamp(15px,5vw,22px); line-height:clamp(15px,5vw,22px); font-size:clamp(.58rem,3vw,.85rem); top:-8px; left:-4px; }
        @media (max-width:520px) { .slot-subtitle br { display:none; } .menu-overlay { padding:16px; } }
        @media (max-height:520px) and (orientation:landscape) { .slot { height:46px; } #stage-info { top:44px; } }
        .res-rows { margin:8px 0; } .res-rows .rrow { display:flex; justify-content:space-between; padding:6px 10px; border-bottom:1px solid #223; text-align:left; } .res-rows b { color:var(--neon-gold); }
        .idiom-slots { bottom:calc(env(safe-area-inset-bottom, 0px) + 10px); gap:4px; width:auto; max-width:100%; }
        .slot { flex:0 0 var(--sw, 80px); width:var(--sw, 80px); max-width:none; min-width:0; box-sizing:border-box; height:calc(var(--sw, 80px) * 0.95); min-height:50px; max-height:84px; padding:0 1px; }
        .slot-title { font-size:min(1.2rem, calc(var(--sw, 80px) / 4.9)); }
        .slot-subtitle { font-size:clamp(.5rem, calc(var(--sw, 80px) / 8.5), .75rem); }
        .ip-line { min-height:3.4em; } .ip-cur { color:var(--neon-gold); animation:spBlink .8s infinite; } .muted { color:#8aa; font-size:.85rem; }
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="gameCanvas"></canvas>
    <div id="ui-layer"></div>
    <div id="hud" style="display:none;">
        <div class="hud-item hud-btns"><button class="hbtn" onclick="game.goHome()" title="回首頁 [H]">⌂ 首頁</button><button class="hbtn" onclick="game.openSettings()" title="設定 [O]">⚙ 設定</button><button class="hbtn" onclick="game.toggleFullscreen()" title="全螢幕">⛶</button><button class="hbtn" id="pause-btn" onclick="game.togglePause();this.blur()" title="暫停 [P]">❚❚</button></div>
        <div class="hud-item hud-dm">暗物質: <span id="dm-val">0</span></div>
        <div class="hud-item">LVL: <span id="lvl-val">1-1</span></div>
    </div>
    <div id="stage-info"></div>
    <div id="buff-bar"></div>
    <div class="boss-hp-bar" id="boss-bar"><div class="boss-hp-fill" id="boss-hp-fill"></div></div>
    <div class="idiom-slots" id="idiom-ui" style="display:none;"></div>
</div>

<script>
"use strict";
const KAI_FONT = "'DFKai-SB','BiauKai','標楷體','KaiTi','Kaiti TC',serif";

class RetroAudio {
    constructor() { this.ctx = null; this.lastShootTime = 0; }
    init() {
        if(this.ctx) return;
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        this.ctx = new AudioContext();
        this.delayNode = this.ctx.createDelay(); this.delayNode.delayTime.value = 0.45; 
        this.feedbackNode = this.ctx.createGain(); this.feedbackNode.gain.value = 0.35; 
        this.delayNode.connect(this.feedbackNode); this.feedbackNode.connect(this.delayNode);
        this.mainGain = this.ctx.createGain(); this.mainGain.gain.value = 0.8;
        this.delayNode.connect(this.mainGain); this.mainGain.connect(this.ctx.destination);
        // 音樂專用匯流排（與音效分開調音量）
        this.bgmGain = this.ctx.createGain(); this.bgmGain.gain.value = 0.8; this.bgmGain.connect(this.ctx.destination);
        this.bgmDelay = this.ctx.createDelay(); this.bgmDelay.delayTime.value = 0.45; this.bgmFb = this.ctx.createGain(); this.bgmFb.gain.value = 0.35;
        this.bgmDelay.connect(this.bgmFb); this.bgmFb.connect(this.bgmDelay); this.bgmDelay.connect(this.bgmGain);
        this.startSpaceBGM();
    }
    playTone(freq, type, duration, vol=0.1, useEcho=false) {
        if(!this.ctx) return;
        const osc = this.ctx.createOscillator(); const gain = this.ctx.createGain();
        osc.type = type; osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
        const dst = this._bgm ? this.bgmGain : this.mainGain, dly = this._bgm ? this.bgmDelay : this.delayNode;
        osc.connect(gain); gain.connect(dst);
        if (useEcho) gain.connect(dly);
        gain.gain.setValueAtTime(0, this.ctx.currentTime);
        gain.gain.linearRampToValueAtTime(vol, this.ctx.currentTime + 0.05);
        gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + duration);
        osc.start(); osc.stop(this.ctx.currentTime + duration);
    }
    playNoise(duration, vol=0.1) {
        if(!this.ctx) return;
        const bufferSize = this.ctx.sampleRate * duration;
        const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
        const data = buffer.getChannelData(0);
        for(let i=0; i<bufferSize; i++) data[i] = Math.random() * 2 - 1;
        const noise = this.ctx.createBufferSource(); noise.buffer = buffer;
        const gain = this.ctx.createGain();
        gain.gain.setValueAtTime(vol, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + duration);
        noise.connect(gain); gain.connect(this.mainGain); noise.start();
    }

class Vec2 { constructor(x, y) { this.x = x; this.y = y; } }

class ObjectPool {
    constructor(createFn, size = 150) {
        this.pool = []; this.createFn = createFn;
        for (let i = 0; i < size; i++) this.pool.push(createFn());
    }
    get() {
        let obj = this.pool.find(o => !o.active);
        if (!obj) { obj = this.createFn(); this.pool.push(obj); }
        obj.active = true; obj.homing = false; obj.target = null; obj.pierce = false; obj.pk = false; obj.hits = 0; return obj;
    }
}

class Entity {
    constructor() { this.pos = new Vec2(0, 0); this.vel = new Vec2(0, 0); this.radius = 10; this.active = false; this.color = "#fff"; }
    update(dt) { this.pos.x += this.vel.x * dt; this.pos.y += this.vel.y * dt; }
    draw(ctx) {
        ctx.save(); ctx.shadowBlur = 10; ctx.shadowColor = this.color; ctx.fillStyle = this.color;
        ctx.beginPath(); ctx.arc(this.pos.x, this.pos.y, this.radius, 0, Math.PI * 2); ctx.fill(); ctx.restore();
    }
}

class Bullet extends Entity {
    constructor() { super(); this.isPlayer = false; this.damage = 1; this.sid = null; this.hits = 0; }
    draw(ctx) {   // 外圈白色虛化光暈（任何背景都看得見）＋ 彩色核心
        const x = this.pos.x, y = this.pos.y, r = this.radius;
        ctx.save();
        const g = ctx.createRadialGradient(x, y, r * 0.6, x, y, r * 1.45); g.addColorStop(0, 'rgba(255,255,255,0.55)'); g.addColorStop(0.5, 'rgba(255,255,255,0.18)'); g.addColorStop(1, 'rgba(255,255,255,0)');
        ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r * 1.45, 0, Math.PI * 2); ctx.fill();
        ctx.shadowBlur = 3; ctx.shadowColor = this.color; ctx.fillStyle = this.color; ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
        ctx.shadowBlur = 0; ctx.fillStyle = 'rgba(255,255,255,0.75)'; ctx.beginPath(); ctx.arc(x, y, r * 0.38, 0, Math.PI * 2); ctx.fill();
        ctx.restore();
    }
}

class FloatingText {
    constructor() { this.active = false; this.pos = new Vec2(0,0); this.text = ""; this.life = 0; this.color = "#fff"; }
    update(dt) { this.pos.y -= 50 * dt; this.life -= dt; if(this.life <= 0) this.active = false; }
    draw(ctx) {
        ctx.save(); ctx.globalAlpha = Math.max(0, this.life); ctx.fillStyle = this.color;
        ctx.font = "bold 16px "+KAI_FONT; ctx.fillText(this.text, this.pos.x, this.pos.y); ctx.restore();
    }
}

// Boss 程式碼保持一致
class Boss extends Entity {
    constructor(stage) {
        super();
        this.stage = stage;
        this.maxHp = stage === 9 ? 5000 : 150 + (stage - 1) * 350;
        this.hp = this.maxHp;
        this.radius = 45;
        this.color = stage === 9 ? "#ff00ff" : "#ff3333";
        this.pos = new Vec2(WORLD.w / 2, -100);
        this.targetY = 120;
        this.shootTimer = 0;
        this.meteorTimer = 0;
        this.pattern = stage % 4;
        this.angle = 0;
        this.dmReward = stage * 100; this.cfg = BOSS_CFG[stage] || BOSS_CFG[1]; this.volley = 0;
        const hasImg = !!(IMG['boss_' + stage] || IMG.boss);
        this.size = hasImg ? Math.min(260, WORLD.w * 0.55) : 110;
        if (hasImg) { this.radius = this.size * 0.28; this.targetY = this.size * 0.5 + 30; }
        this.type = BOSS_TYPES[stage] || 'TANK';
        const M = bossMods(stage, this.type);   // 依關卡縮放：[血量倍率, 子彈傷害倍率, 射擊間隔倍率]
        this.maxHp = Math.round(this.maxHp * M.hp); this.hp = this.maxHp; this.dmgMul = M.dmg; this.rateMul = M.rate;
    }

    move(dt, W, pp) {   // 「目標點 + 指數平滑」：不瞬移、不抖動，並限制最高速度
        this.tm = (this.tm || 0) + dt * 1000;
        const t = this.tm, m = this.cfg.mv, cx = W / 2, margin = this.size * 0.35;
        let tx = cx, ty = this.targetY, k = 3;
        if (m === 'sweep') tx = cx + Math.sin(t / 1800) * W / 3;
        else if (m === 'hover') { tx = cx + Math.sin(t / 2600) * W / 7; ty += Math.sin(t / 950) * 25; }
        else if (m === 'orbit') { tx = cx + Math.cos(t / 1500) * W / 3; ty += 40 + Math.sin(t / 1500) * 55; }
        else if (m === 'chase') { tx = pp.x; k = 1.6; }
        else if (m === 'zigzag') { const ph = (t / 1500) % 2; tx = margin + (ph < 1 ? ph : 2 - ph) * (W - margin * 2); k = 4; }
        else if (m === 'dash') { this.dashT = (this.dashT || 0) - dt; if (this.dashT <= 0) { this.dashX = margin + Math.random() * (W - margin * 2); this.dashT = 2.4; } tx = this.dashX; k = 4; }
        tx = Math.max(margin, Math.min(W - margin, tx));
        // 期望速度 = 與目標的距離 × 增益；速度只能以固定加速度改變（起步與煞車都是漸進的）
        const vmax = 650, acc = 1500 * dt, cl = (v, m) => Math.max(-m, Math.min(m, v));
        this.vx = (this.vx || 0); this.vy = (this.vy || 0);
        this.vx += cl(cl((tx - this.pos.x) * k, vmax) - this.vx, acc);
        this.vy += cl(cl((ty - this.pos.y) * k, vmax) - this.vy, acc);
        this.pos.x += this.vx * dt; this.pos.y += this.vy * dt;
    }

    update(dt, playerPos, spawnBullet, spawnMeteor) {
        this.move(dt, WORLD.w, playerPos);

        this.shootTimer += dt;
        const fireRate = this.cfg.r * this.rateMul * (this.stage === 9 && this.hp < this.maxHp / 2 ? 0.7 : 1);
        if (this.shootTimer > fireRate) { this.shoot(spawnBullet, playerPos); this.shootTimer = 0; }

        this.meteorTimer += dt;
        if (this.meteorTimer > 4.0) { spawnMeteor(this.pos.x, this.pos.y); this.meteorTimer = 0; }
    }

    shoot(spawnBullet, pp) {
        this.angle += 0.15;
        const sp = 90 + this.stage * 18, sh = this.cfg.sh, pat = sh[this.volley++ % sh.length];
        const toP = Math.atan2(pp.y - this.pos.y, pp.x - this.pos.x), D = Math.PI / 2;
        const fire = (a, v, col) => { const b = spawnBullet(); b.pos = new Vec2(this.pos.x, this.pos.y); b.vel = new Vec2(Math.cos(a) * v, Math.sin(a) * v); b.color = col; b.isPlayer = false; };
        switch (pat) {
            case 'aim':    fire(toP, sp * 1.4, '#ffcc00'); break;
            case 'aim3':   [-0.25, 0, 0.25].forEach(o => fire(toP + o, sp * 1.2, '#ff9900')); break;
            case 'burst':  for (let i = -2; i <= 2; i++) fire(D + i * 0.28, sp, '#ff6666'); break;
            case 'ring':   for (let i = 0; i < 8; i++) fire(i / 8 * Math.PI * 2 + this.angle, sp * 0.9, '#ff33aa'); break;
            case 'spiral': for (let k = 0; k < 2; k++) fire(this.angle * 2 + k * Math.PI, sp, '#00ccff'); break;
            case 'rain':   for (let i = 0; i < 5; i++) fire(D + (Math.random() - 0.5) * 0.9, sp * (0.9 + Math.random() * 0.5), '#00ff66'); break;
            case 'wall': {   // 一整排子彈，留一個缺口
                const gap = Math.floor(Math.random() * 12);
                for (let i = 0; i < 12; i++) {
                    if (Math.abs(i - gap) < 1.5) continue;
                    const b = spawnBullet(); b.pos = new Vec2(WORLD.w * (i + 0.5) / 12, this.pos.y + 30); b.vel = new Vec2(0, sp * 0.9); b.color = '#ff66ff'; b.isPlayer = false;
                }
                break;
            }
        }
    }

    draw(ctx) {
        ctx.save(); ctx.translate(this.pos.x, this.pos.y); ctx.rotate(this.angle * 0.5); 
        ctx.shadowBlur = 25; ctx.shadowColor = this.color; ctx.strokeStyle = this.color; ctx.lineWidth = 3;
        ctx.beginPath(); ctx.arc(0, 0, this.radius * 1.3, 0, Math.PI * 2); ctx.setLineDash([10, 15]); ctx.stroke(); ctx.setLineDash([]);
        ctx.fillStyle = "#0a0a1a"; ctx.lineWidth = 4; ctx.beginPath();
        const sides = 5 + (this.stage % 4);
        for(let i=0; i<=sides; i++) {
            const a = (i / sides) * Math.PI * 2;
            const x = Math.cos(a) * this.radius; const y = Math.sin(a) * this.radius;
            if(i===0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
        }
        ctx.closePath(); ctx.fill(); ctx.stroke();
        ctx.fillStyle = "#ffffff"; ctx.shadowBlur = 30; ctx.beginPath();
        for(let i=0; i<=sides; i++) {
            const a = (i / sides) * Math.PI * 2 + (Math.PI / sides);
            const x = Math.cos(a) * (this.radius * 0.4); const y = Math.sin(a) * (this.radius * 0.4);
            if(i===0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
        }
        ctx.closePath(); ctx.fill(); ctx.restore();
        ctx.save(); ctx.fillStyle = "#ffffff"; ctx.shadowBlur = 10; ctx.shadowColor = this.color;
        ctx.textAlign = "center"; ctx.font = "bold 20px "+KAI_FONT; ctx.fillText("BOSS・" + bossLabel(this.stage), this.pos.x, this.pos.y + this.radius + 30);
        ctx.restore();
    }
}

class Game {
    constructor() {
        this.canvas = document.getElementById('gameCanvas');
        this.ctx = this.canvas.getContext('2d');
        this.uiLayer = document.getElementById('ui-layer');
        this.gameState = 'INIT';
        this.lastTime = 0;
        
        this.pointerActive = false;
        this.lastPointerX = 0;
        this.lastPointerY = 0;

        this.darkMatter = 0;
        this.maxSlots = 1;   
        this.maxHp = 100;    
        this.weaponLvl = 1;  

        this.currentStage = 1; this.currentSub = 1;
        this.score = 0; this.hp = this.maxHp;
        this.boss = null;
        this.transitionTimer = 0;
        this.isNextStage = false;

        this.waveQuota = 0;
        this.enemiesSpawned = 0;
        this.enemySpawnTimer = 0;
        this.idiomBlockTimer = 0; 

        // 碰撞半徑設定為15，但視覺戰機會畫得更大更華麗
        this.player = { pos: new Vec2(0, 0), radius: 15, speed: 450, lastShoot: 0, rapidFire: 0, spreadFire: 0 };
        this.keys = {};
        this.bullets = new ObjectPool(() => new Bullet(), 400);
        this.texts = new ObjectPool(() => new FloatingText(), 20);
        
        this.enemies = []; 
        this.idiomBlocks = []; 
        this.charItems = [];   
        this.slots = [];       
        
        this.laserTimer = 0; this.invincibleTimer = 0; this.slowTimer = 0; this.paused = false; this.particles = [];
        this.pierceTimer = 0; this.missileTimer = 0; this.missileCd = 0; this.allies = []; this.allyTimer = 0; this.dmgTexts = []; this.snipe = { c: 0, t: [], fx: [] }; this.bgClock = 0; this.runClock = 0; this.pkMode = false; this.pkTime = 0; this.dlgOpen = false; this.dlgConfirm = null; this.dlgResume = false; this.volSfx = 1; this.volMusic = 0.5; this.clearT = 0; this.demo = null; this._buffHtml = '';
        this.fleet = {}; SHIPS.forEach(S => { this.fleet[S.id] = { own: S.price === 0, ...S.base }; }); this.shipId = 'star'; this.startStage = 1; this.bestStage = 1; this.st = null; this.hIdx = 0; this.shield = 0; this.shock = null; this.magnetLvl = 0; this.dmLvl = 0; this.skin = 0; this.casting = null;

        this.load(); this.loadVol(); this.applyUpgrades(); this.init();
    }

    init() {
        this.resize(); window.addEventListener('resize', () => this.resize()); window.addEventListener('orientationchange', () => setTimeout(() => this.resize(), 250)); if (window.visualViewport) window.visualViewport.addEventListener('resize', () => this.resize());
        window.addEventListener('keydown', (e) => {
            if (e.target && /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) return;
            if (this.anyInputResume(false)) { e.preventDefault(); return; }   // 暫停中：按任意鍵回到遊戲
            this.keys[e.code] = true;
            if (['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code)) e.preventDefault();
            if (!e.repeat) this.handleKey(e);
        });
        ['pointerdown', 'touchstart', 'touchend', 'mousedown', 'click'].forEach(ev => window.addEventListener(ev, () => this.anyInputResume(true), { capture: true, passive: true }));   // 暫停中：手機觸控、電腦滑鼠點一下畫面就回到遊戲
        document.addEventListener('visibilitychange', () => { if (document.hidden && this.gameState === 'PLAYING' && !this.paused) { this.paused = true; music.pause(true); } });   // 手機切到背景（不一定會觸發 blur）也先暫停，回來點一下就繼續
        window.addEventListener('blur', () => { this.keys = {}; if (this.gameState === 'PLAYING') { this.paused = true; music.pause(true); } });
        window.addEventListener('keyup', (e) => this.keys[e.code] = false);

        this.canvas.addEventListener('touchstart', (e) => {
            if (this.gameState !== 'PLAYING') return;
            this.pointerActive = true;
            this.lastPointerX = e.touches[0].clientX;
            this.lastPointerY = e.touches[0].clientY;
        }, {passive: false});
        
        this.canvas.addEventListener('touchmove', (e) => {
            if (!this.pointerActive || this.gameState !== 'PLAYING') return;
            e.preventDefault(); 
            const dx = e.touches[0].clientX - this.lastPointerX; 
            const dy = e.touches[0].clientY - this.lastPointerY;
            this.dragBy(dx / WORLD.s, dy / WORLD.s);
            this.lastPointerX = e.touches[0].clientX; 
            this.lastPointerY = e.touches[0].clientY;
        }, {passive: false});
        
        this.canvas.addEventListener('touchend', () => { this.pointerActive = false; });
        this.canvas.addEventListener('touchcancel', () => { this.pointerActive = false; });

        this.canvas.addEventListener('mousedown', (e) => {
            if (this.gameState !== 'PLAYING') return;
            this.pointerActive = true; this.lastPointerX = e.clientX; this.lastPointerY = e.clientY;
        });
        this.canvas.addEventListener('mousemove', (e) => {
            if (!this.pointerActive || this.gameState !== 'PLAYING') return;
            const dx = e.clientX - this.lastPointerX; const dy = e.clientY - this.lastPointerY;
            this.dragBy(dx / WORLD.s, dy / WORLD.s);
            this.lastPointerX = e.clientX; this.lastPointerY = e.clientY;
        });
        this.canvas.addEventListener('mouseup', () => { this.pointerActive = false; });
        this.canvas.addEventListener('mouseleave', () => { this.pointerActive = false; });

        this.setState('INIT'); requestAnimationFrame((t) => this.loop(t));
    }

    resize() { updateWorld(); this.canvas.width = Math.round(WORLD.rw * WORLD.dpr); this.canvas.height = Math.round(WORLD.rh * WORLD.dpr); this.canvas.style.width = WORLD.rw + 'px'; this.canvas.style.height = WORLD.rh + 'px'; if (this.player && this.player.pos) { this.player.pos.x = Math.min(this.player.pos.x, WORLD.w - 20); this.player.pos.y = Math.min(this.player.pos.y, WORLD.h - 20); } }

    setState(state) {

    async downloadOffline() {
        if (this._offBusy) return; this._offBusy = true;
        const btn = document.getElementById('off-go'), bar = document.getElementById('off-bar');
        if (btn) btn.disabled = true; if (bar) bar.style.display = 'block';
        const say = t => { const i = document.getElementById('off-info'); if (i) i.textContent = t; };
        const CN = 'idiom-offline', abs = u => new URL(u, location.href).href;
        try {
            if (navigator.storage && navigator.storage.persist) navigator.storage.persist();
            say('檢查版本中…');
            const man = await this.fetchManifest();
            if (man.version !== APP_VERSION) throw new Error(verNewer(man.version, APP_VERSION) ? `伺服器已有更新的版本 ${man.version}，請重新整理頁面` : `伺服器上的檔案還沒同步到版本 ${APP_VERSION}（目前是 ${man.version}），請稍後重試`);
            const want = this.offlineWant(man);                                  // { 網址: [雜湊值, 大小] }
            const cache = await caches.open(CN), old = this.packInfo() || {}, oldFiles = old.files || {};

            const todo = [];
            for (const u of urls) { if (have.has(abs(u)) && oldFiles[u] === want[u][0]) files[u] = want[u][0]; else if (!prevMiss.has(u)) todo.push(u); }
            const bytes = todo.reduce((s, u) => s + (want[u][1] || 0), 0);
            say(todo.length ? `${old.v ? `${old.v} → ${APP_VERSION}：` : ''}${todo.length} 個檔案需要下載（約 ${(bytes / 1048576).toFixed(1)} MB）…` : '所有檔案都已是最新版本');
            let done = 0;
            const get = async url => {
                try {
                    const cross = new URL(url, location.href).origin !== location.origin;
                    const r = await fetch(url, cross ? { mode: 'no-cors' } : { cache: 'reload' });
                    if (r.ok || r.type === 'opaque') { await cache.put(url, r); files[url] = want[url][0]; }

                } catch (e) { fail.add(url); }

                if (todo.length) say(`更新中… ${done}/${todo.length}`);

            for (const u of miss) if (!prevMiss.has(u)) await cache.delete(abs(u));                      // 伺服器上已刪除的檔案 → 不留舊的
            const okN = Object.keys(files).length, expected = urls.filter(u => !miss.has(u)).length, pass = okN / Math.max(1, expected) >= 0.9;

            say(okN ? `完成！版本 ${APP_VERSION}，這次更新了 ${todo.length - fail.size - [...miss].filter(u => todo.includes(u)).length} 個檔案（共 ${okN} 個），現在可以離線遊玩了` : '沒有下載到任何檔案，請確認網路');

    }
    // ===== 連網自動檢查：版本號不同 → 下載新資料包並覆蓋舊檔；版本相同 → 只補缺少的檔案 =====

    async quietCheck() {   // 版本相同時，背景補齊失敗或被瀏覽器清掉的檔案

            <button class="btn btn-start" id="off-go" style="display:none">重新下載</button>${isUpdate ? '<button class="btn" id="off-skip" style="display:none">網路中斷，先離線進入</button>' : ''}</div>`;
