        // 對手位置：用「主控端視角」的比例座標傳送；客戶端的畫面整個旋轉 180°，所以雙方都看到對方在上方、面對面
        p.unsubPos = this.roomRef(p.code).collection('pos').doc(opp).onSnapshot(s => { const d = s.exists && s.data(); if (d) p.gt = me === 'host' ? { x: d.x, y: d.y } : { x: 1 - d.x, y: 1 - d.y }; }, () => {});
        p.unsubEv = this.roomRef(p.code).collection('events').where('matchId', '==', p.matchId).onSnapshot(s => s.docChanges().forEach(ch => {
            if (ch.type !== 'added') return; const e = ch.doc.data(); if (e.by === this.user.uid || p.seen.has(ch.doc.id)) return; p.seen.add(ch.doc.id);
            if (e.type === 'pop') { this.pkRemotePop(e.id); return; }
            p.castQ.push(e); this.pkNext();
        }), () => {});
        clearInterval(this._pkTimer); this._pkTimer = setInterval(() => this.pkTick(), 160);
    },
    pkSend(idiom) { const p = this.pk; if (!p || !p.started) return; this.roomRef(p.code).collection('events').add({ matchId: p.matchId, type: 'cast', by: this.user.uid, name: this.profile.name, word: idiom.word, effect: idiom.effect, desc: idiom.desc, ts: Date.now() }).catch(() => {}); },
    pkNext() { const p = this.pk; if (p && p.castQ.length && !G.casting && G.gameState === 'PLAYING' && !p.over) { const e = p.castQ.shift(); G.startCast({ word: e.word, effect: e.effect, desc: e.desc }, e.name); } },
    pkApply(idiom) {   // 對手發動的攻擊在這裡結算（我是被攻擊方）
        const D = { BOMB_BOOST: 30, LASER_BEAM: 35, MISSILE: 25, PIERCE: 25 }[idiom.effect]; sfx.playIdiomFire(idiom.effect);
        if (!D) return; if (idiom.effect === 'PIERCE') G.shield = Math.floor(G.shield / 2);
        if (G.invincibleTimer > 1.05) { G.showFloatText('免疫', G.player.pos.x, G.player.pos.y - 50, '#7dffb0'); return; }
        G.hurt(D); sfx.playPlayerHit(); G.showFloatText('-' + D, G.player.pos.x, G.player.pos.y - 50, '#ff3366'); G.burst(G.player.pos.x, G.player.pos.y, 16);
        if (idiom.effect === 'BOMB_BOOST') G.shock = { t: 0, x: G.player.pos.x, y: G.player.pos.y };
        G.updateHUD(); if (G.hp <= 0) this.pkSelfDead();
    },
    pkTick() {
        const p = this.pk; if (!p || !p.started || p.over) return;
        const me = p.role, opp = me === 'host' ? 'guest' : 'host', r = p.room || {}, hp = Math.max(0, Math.round(G.hp));
        if ((hp !== p.lastHp && Date.now() - p.lastPush > 450) || Date.now() - p.lastPush > 3000) { p.lastHp = hp; p.lastPush = Date.now(); this.roomUpdate({ [me + 'Hp']: hp, [me + 'Max']: Math.round(G.maxHp) }); }
        { const x = G.player.pos.x / WORLD.w, y = G.player.pos.y / WORLD.h;   // 我的位置（主控端視角的比例座標）
          this.roomRef(p.code).collection('pos').doc(me).set({ x: me === 'host' ? x : 1 - x, y: me === 'host' ? y : 1 - y, ts: Date.now() }).catch(() => {}); }
        const left = Math.max(0, 180 - G.pkTime), oh = r[opp + 'Hp'] === undefined ? 100 : r[opp + 'Hp'], om = r[opp + 'Max'] || 100, h = $('pk-hud');
        if (h) h.innerHTML = `對手 ${esc(r[opp + 'Name'] || '')}　HP ${oh}　剩餘 ${Math.ceil(left)} 秒<div class="bar"><i style="width:${Math.min(100, oh / om * 100)}%"></i></div>`;
        if (left <= 0) { const oppHp = r[opp + 'Hp'] === undefined ? om : r[opp + 'Hp']; const w = hp > oppHp ? this.user.uid : hp < oppHp ? (me === 'host' ? r.guest : r.host) : 'draw'; this.pkFinish(w); }
        this.pkNext();
    },
    // ----- PK 面對面戰場 -----
    pkSnipeSim(S, g, dt) {   // 對手是暗殺號：在我的畫面模擬他的狙擊蓄力（他停留不動就蓄力），蓄滿射出一發高速子彈飛向我「當下的位置」，可以移動躲開
        const mv = g.spx === undefined ? 0 : Math.hypot(g.x - g.spx, g.y - g.spy) / Math.max(dt, 0.001); g.spx = g.x; g.spy = g.y;
        const need = S.sn || SNIPE_T0; g.sc = g.sc || 0;
        if (mv > 40) g.sc = Math.max(0, g.sc - 2 * dt / need); else g.sc = Math.min(1, g.sc + dt / need);
        if (g.sc < 1) return; g.sc = 0;
        const P = G.player.pos, dx = P.x - g.x, dy = P.y - (g.y + 25), d = Math.hypot(dx, dy) || 1, b = G.bullets.get();
        b.pos = new Vec2(g.x, g.y + 25); b.vel = new Vec2(dx / d * PK_SNIPE_SPEED, dy / d * PK_SNIPE_SPEED);
        b.isPlayer = false; b.pk = true; b.damage = S.dmg * SNIPE_K_PK; b.pen = S.pen || 0; b.crit = Math.min(1, (S.crit || 0) + SNIPE_PK_CRIT); b.pierce = false; styleBullet(b, b.damage); b.color = '#ff5ec4'; b.radius = 5;
    },
    pkUpdate(dt) {
        const p = this.pk; if (!p || !p.started || !p.ghost) return;
        const g = p.ghost, r = p.room || {}, opp = p.role === 'host' ? 'guest' : 'host', S = r[opp + 'St'], guest = p.role === 'guest';
        if (p.gt) { g.tx = p.gt.x * WORLD.w; g.ty = p.gt.y * WORLD.h; }
        const k = Math.min(1, dt * 10); g.x += (g.tx - g.x) * k; g.y += (g.ty - g.y) * k;
        if (S) {   // 對手的火力：依對手戰機數值在他的位置向下射擊
            p.ghostR = S.r || 15; g.cd -= dt * 1000; if (S.pt === 'assassin') this.pkSnipeSim(S, g, dt);
            if (g.cd <= 0) {
                g.cd = Math.max(55, S.iv);
                const shoot = (off, ang, rs, dm) => { const b = G.bullets.get(); b.pos = new Vec2(g.x + off, g.y + 25); b.vel = new Vec2(Math.sin(ang) * 800, Math.cos(ang) * 800);
                    b.isPlayer = false; b.pk = true; b.damage = S.dmg * (dm || 1) * (PK_NERF[S.pt] || 1); b.pen = S.pen || 0; b.crit = S.crit || 0; b.pierce = !!(S.pt && (SHIPS.find(x => x.id === S.pt) || {}).pierce); styleBullet(b, b.damage); if (rs && rs !== 1) b.radius *= rs; };
                const GS = S.pt && SHIPS.find(x => x.id === S.pt); if (GS) patternShots(GS, S.cv).forEach(sh => shoot(sh.o, sh.a, sh.rs, sh.dm)); else { shoot(0, 0); if (S.wl >= 3) { shoot(-15, -0.15); shoot(15, 0.15); } if (S.wl >= 6) { shoot(-25, -0.3); shoot(25, 0.3); } }
            }
        }
        // 成語字塊：以房間開戰時間當亂數種子，雙方畫面產生同樣的字塊；數量為一般關卡的 2 倍（每秒 35%，一般是每 2 秒 35%）
        const rng = x => () => { x |= 0; x = x + 0x6D2B79F5 | 0; let t = Math.imul(x ^ x >>> 15, 1 | x); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
        while (p.bk <= G.pkTime) {
            const id = p.bk++, R = rng((p.matchId % 1e9) + id * 7919); if (R() >= 0.35) continue;
            const dir = R() < 0.5 ? 1 : -1, fy = 0.3 + 0.4 * R(), sp = 50 + 30 * R(), ph = R() * 6.28, left = (dir > 0) !== guest;
            G.spawnIdiomBlock(0, 0); const m = G.idiomBlocks[G.idiomBlocks.length - 1];
            m.id = id; m.vx = left ? sp : -sp; m.pos.x = left ? -30 : WORLD.w + 30; m.y0 = (guest ? 1 - fy : fy) * WORLD.h; m.pos.y = m.y0; m.sg = guest ? -1 : 1; m.ph = ph;
        }
    },
    pkDmg(b) {   // 對手子彈打到我：爆擊、穿甲、裝甲與一般戰鬥相同
        let n = b.damage + Math.random() * 0.99; if (Math.random() < (b.crit || 0)) n *= 1.5 + Math.random() * 1.5;
        const def = b.pierce ? 0 : Math.max(0, (G.fleet[G.shipId].hp || 0) - (b.pen || 0)) * DEF_PER_LV;
        return Math.max(n * MIN_DMG_K, n - def);
    },
    pkPop(id) { const p = this.pk; if (!p || !p.started) return; this.roomRef(p.code).collection('events').add({ matchId: p.matchId, type: 'pop', by: this.user.uid, id, ts: Date.now() }).catch(() => {}); },
    pkRemotePop(id) {   // 對手打爆字塊：字元飄向對手
        const i = G.idiomBlocks.findIndex(m => m.id === id); if (i < 0) return; const m = G.idiomBlocks[i];
        G.charItems.push({ pos: new Vec2(m.pos.x, m.pos.y), char: m.char, home: 'opp' }); G.idiomBlocks.splice(i, 1); G.burst(m.pos.x, m.pos.y, 6);
    },
    drawGhost(ctx) {
        const p = this.pk, g = p && p.ghost; if (!g) return;
        const r = p.room || {}, opp = p.role === 'host' ? 'guest' : 'host', S = SHIPS.find(x => x.id === (r[opp + 'Ship'] || 'star')) || SHIPS[0], im = IMG['ship_' + S.id] || IMG.player;
        const hp = r[opp + 'Hp'] === undefined ? 100 : r[opp + 'Hp'], mx = r[opp + 'Max'] || 100;
        ctx.setTransform(WORLD.k, 0, 0, WORLD.k, 0, 0); ctx.save(); ctx.translate(g.x, g.y); ctx.scale(S.s, S.s); ctx.rotate(Math.PI);   // 轉 180°：機頭朝向我
        if (im) { ctx.shadowColor = '#ff3366'; ctx.shadowBlur = 18; if (!IMG['ship_' + S.id]) ctx.filter = `hue-rotate(${S.h}deg)`; fitDraw(ctx, im, im.width / im.height > 1.3 ? 118 : 96); }
        else { ctx.fillStyle = '#ff3366'; ctx.beginPath(); ctx.moveTo(0, -22); ctx.lineTo(18, 18); ctx.lineTo(-18, 18); ctx.closePath(); ctx.fill(); }
        ctx.restore();
        if (S.id === 'assassin' && g.sc > 0.05) { const c = g.sc, P = G.player.pos; ctx.save(); ctx.strokeStyle = c > 0.8 ? '#ffffff' : '#ff5ec4'; ctx.globalAlpha = 0.2 + 0.7 * c * (c > 0.8 ? 0.7 + 0.3 * Math.sin(G.bgClock * 40) : 1); ctx.lineWidth = 1 + 2 * c; ctx.setLineDash([8, 8]); ctx.beginPath(); ctx.moveTo(g.x, g.y + 25); ctx.lineTo(P.x, P.y); ctx.stroke(); ctx.restore(); }   // 狙擊預警線：蓄越滿越亮，快滿時快點移動
        ctx.save(); ctx.textAlign = 'center'; ctx.fillStyle = '#ff9aa8'; ctx.font = 'bold 13px ' + KAI_FONT; ctx.fillText(r[opp + 'Name'] || '', g.x, g.y - 62 * S.s - 8);
        G.drawBars(ctx, g.x, g.y - 62 * S.s, 64, hp, mx, 0, mx, '#ff5566'); ctx.restore();
    },
    pkSelfDead() { const p = this.pk; if (!p || p.over) return; G.paused = true; const r = p.room || {}; this.pkFinish(p.role === 'host' ? r.guest : r.host); },
    pkFinish(w) { const p = this.pk; if (!p || p.over || p.finishing) return; p.finishing = true; this.roomUpdate({ state: 'ended', winner: w || 'draw' }); setTimeout(() => { if (this.pk === p && !p.over) this.endMatch(w || 'draw'); }, 1500); },
    endMatch(winner) {
        const p = this.pk; if (!p || p.over) return; p.over = true; G.pkMode = false; G.paused = true; clearInterval(this._pkTimer);
        const win = winner === this.user.uid, draw = winner === 'draw' || !winner;
        if (!draw) this.stat(win ? 'pkWins' : 'pkLosses', 1);
        sfx.playIdiomFire(win ? 'HEAL' : 'BOMB_BOOST');
        G.dialog(`<h2 style="color:${draw ? '#fff' : win ? 'var(--neon-gold)' : '#ff6b6b'}">${draw ? '平手' : win ? '勝利！' : '落敗'}</h2><p>PK 對戰結束</p><button class="btn btn-start" onclick="online.pkExit()">返回大廳</button>`, () => this.pkExit());
    },
    pkExit() { G.closeDlg(); this.pkLeave(false); G.setState('LOBBY'); }
};

function msgHtml(m, me) { if (m.sys) return `<div class="msg sys s${m.sys}">${esc(m.text)}</div>`; const d = new Date(m.ts || 0); return `<div class="msg ${me ? 'me' : ''}"><b class="mn" onclick="online.showPlayer('${esc(m.uid || '')}')">${esc(m.name)}</b> ${esc(m.text)}<small>${pad(d.getHours(), 2)}:${pad(d.getMinutes(), 2)}</small></div>`; }

// ---------- 掛接到遊戲 ----------
const wrap = (name, fn) => { const o = P[name]; P[name] = function (...a) { return fn.call(this, o, ...a); }; };
const NEW = new Set(['LOGIN', 'RANK', 'FRIENDS', 'PK', 'DB', 'DB2', 'TUTORIAL', 'ADMIN', 'STATS']);
wrap('setState', function (o, state) {
    if (this.pkMode && (state === 'GAMEOVER' || state === 'VICTORY')) { online.pkSelfDead(); return; }
    if (NEW.has(state) && !['LOGIN', 'TUTORIAL', 'DB', 'DB2', 'STATS'].includes(state) && !online.user && !(state === 'ADMIN' && online.adminDb)) { toast('這個功能需要網路並登入'); return; }
    if (NEW.has(state)) { o.call(this, 'LOBBY'); this.gameState = state; online.renderState(state); return; }
    o.call(this, state); online.updateChatVis();
    if (state === 'GAMEOVER') online.finishRun(false); else if (state === 'VICTORY') online.finishRun(true);
});
wrap('renderLobby', function (o) { if (online._pendingAdmin && !['PLAYING', 'TRANSITION'].includes(this.gameState)) { const d = online._pendingAdmin; online._pendingAdmin = null; online.applyAdminDoc(d); this.renderLobby(); return; } o.call(this); const t = document.querySelector('.tiles'); if (t) t.insertAdjacentHTML('beforeend', online.extraTiles()); });
wrap('draw', function (o) { o.call(this); if (this.pkMode && this.gameState === 'PLAYING' && online.pk) online.drawGhost(this.ctx); });
wrap('save', function (o) { o.call(this); online.queuePush(); });
wrap('dropDarkMatter', function (o, ...a) { const b = this.darkMatter; o.apply(this, a); const d = this.darkMatter - b; if (d > 0) online.stat('totalDM', d); });
['buyItem', 'upgrade'].forEach(n => wrap(n, function (o, ...a) { const b = this.darkMatter; o.apply(this, a); const d = b - this.darkMatter; if (d > 0) online.stat('spentDM', d); }));
wrap('startNewGame', function (o) { o.call(this); this.runDM = 0; this.runClock = 0; this.runStart = this.currentStage; this.runStageClears = {}; this.stageStartFor = undefined; this.runSeq = (this.runSeq || 0) + 1; });
wrap('startTransition', function (o, n) { if (this.pkMode) { this.currentSub = 1; this.resetStage(); return; } o.call(this, n); });
wrap('startCast', function (o, idiom, remote) {
    o.call(this, idiom);
    if (remote) { this.casting.remote = remote; const e = document.querySelector('#idiom-popup .ip-effect'); if (e) e.innerHTML = `<span style="color:#ff6b6b">對手 ${esc(remote)} 發動！</span> ${esc(e.textContent)}`; }
    else if (this.pkMode) online.pkSend(idiom);
});
wrap('finishCast', function (o) { const c = this.casting; if (c && c.remote) { this.endCast(); online.pkApply(c.idiom); } else o.call(this); online.pkNext(); });
wrap('leave', function (o) { if (this.pkMode) { this.closeDlg(); online.pkSelfDead(); return; } o.call(this); });
const ADMIN_CODE = '06090721';
wrap('aboutDialog', function (o) { o.call(this); this.aboutOpen = true; online._code = ''; });
wrap('closeDlg', function (o) { this.aboutOpen = false; o.call(this); });
wrap('openSettings', function (o) {
    o.call(this); const box = document.querySelector('#dlg .box'); if (!box) return;
    const last = box.querySelector('.btn-start'), d = document.createElement('div');
    d.innerHTML = `${online.profile ? `<p class="muted">帳號：${esc(online.profile.name)}（${esc(online.profile.username)}）</p>${online.user ? '<button class="btn" onclick="game.closeDlg();online.logout()">登出</button>' : ''}` : ''}`;
    box.insertBefore(d, last);
});
wrap('handleKey', function (o, e) {
    const st = this.gameState;
    if (this.dlgOpen && this.aboutOpen) {   // 關於頁面：鍵盤輸入暗碼直接進管理員介面
        const m = /^(Digit|Numpad)(\d)$/.exec(e.code);
        if (m) {
            online._code = ((online._code || '') + m[2]).slice(-ADMIN_CODE.length);
            if (online._code === ADMIN_CODE) {
                online._code = ''; this.closeDlg();
                if (online.isAdmin || online.adminDb) this.setState('ADMIN'); else online.adminLogin(ADMIN_CODE);
                return;
            }
        } else if (!/^(Shift|Control|Alt)/.test(e.code)) online._code = '';
    }
    if (NEW.has(st) && !this.dlgOpen) {
        if (st === 'TUTORIAL') { if (e.code === 'ArrowRight' || e.code === 'Enter') { online.tut >= online._tutLen - 1 ? online.tutDone() : online.renderTutorial(online.tut + 1); } else if (e.code === 'ArrowLeft') online.renderTutorial(online.tut - 1); else if (e.code === 'Escape') online.tutDone(); return; }
        if (e.code === 'Escape' && st !== 'LOGIN') { if (st === 'PK' && online.pk) return; this.setState('LOBBY'); } return;
    }
    o.call(this, e);
});

window.addEventListener('online', () => { setTimeout(() => G.quietCheck(), 1500);  if (online.offline) toast('已恢復網路：點大廳的「連線登入」即可同步進度', 5000); });

// ---------- 啟動 ----------
online.authReady = new Promise(res => {
    if (!fbOk) return res();
    auth.onAuthStateChanged(async u => { try { if (u) await online.onLogin(u); else online.onLogout(); } catch (e) { console.error(e); toast(errMsg(e)); } finally { res(); } });
});
})();

</script>
