    }

    save() {
        try { localStorage.setItem('idiomShooterSave', JSON.stringify({ dm:this.darkMatter, s:this.maxSlots, m:this.magnetLvl, d:this.dmLvl, f:this.fleet, i:this.shipId, b:this.bestStage, t:this.startStage })); } catch (err) {}
    }
    load() {
        try {
            const v = JSON.parse(localStorage.getItem('idiomShooterSave') || 'null'); if (!v) return;
            this.darkMatter = v.dm || 0; this.maxSlots = v.s || 3; this.magnetLvl = v.m || 0; this.dmLvl = v.d || 0;
            this.bestStage = Math.min(9, v.b || 1); this.startStage = Math.min(v.t || 1, this.bestStage);
            if (v.f) { SHIPS.forEach(S => { if (v.f[S.id]) Object.assign(this.fleet[S.id], v.f[S.id]); }); if (this.fleet[v.i] && this.fleet[v.i].own) this.shipId = v.i; }
            else { const f = this.fleet.star; f.dmg = Math.min(v.w || 1, 8); f.hp = Math.min(v.h || 0, 8); f.spd = Math.min(v.e || 0, 8); }   // 舊版存檔轉入星藍號
            SHIPS.forEach(S => ['dmg', 'rate', 'hp', 'spd'].forEach(k => { this.fleet[S.id][k] = Math.min(this.fleet[S.id][k], S.cap[k]); }));
        } catch (err) {}
    }

    startNewGame() {
        sfx.init(); this.tryFullscreen(); this.applyUpgrades(); this.shield = 0; this.pierceTimer = 0; this.missileTimer = 0; this.allies = []; this.allyTimer = 0; this.runDM = 0; this.runKills = 0; this.runCasts = 0; this.clearT = 0; this.currentStage = Math.min(this.startStage, this.bestStage); this.currentSub = 1; this.score = 0; 
        this.hp = this.maxHp; this.slots = []; 
        this.fillEmptySlots(); // 遊戲開始時塞滿隨機成語任務
        this.resetStage(); this.setState('PLAYING');
    }

    fillEmptySlots() {
        while (this.slots.length < this.maxSlots) {
            const rand = this.pickIdiom();
            this.slots.push({ type: 'COLLECTING', word: rand.word, chars: [], effect: rand.effect, effectDesc: rand.desc });
        }
    }

    resetStage() {
        this.boss = null;
        this.enemies = []; this.idiomBlocks = []; this.charItems = [];
        this.player.pos = new Vec2(WORLD.w / 2, WORLD.h - 150);
        this.bullets.pool.forEach(b => b.active = false);
        this.pointerActive = false; 
        document.getElementById('boss-bar').style.display = 'none';
        
        if (this.currentSub < 3) {
            this.waveQuota = 3 + (this.currentStage - 1) * 3 + (this.currentSub - 1) * 2;
            this.enemiesSpawned = 0;
            this.enemySpawnTimer = 0;
        } else {
            this.waveQuota = 0;
        }
        this.idiomBlockTimer = 0;
        this.showFloatText(this.currentSub === 3 ? "WARNING: " + bossLabel(this.currentStage) : `區塊 ${this.currentStage}-${this.currentSub} 開始`, WORLD.w/2, WORLD.h/2, "#ffea00");
    }

    startTransition(isNextStage) {
        this.gameState = 'TRANSITION'; this.transitionTimer = 0; this.isNextStage = isNextStage;
        this.bullets.pool.forEach(b => b.active = false); this.enemies = []; this.idiomBlocks = []; this.charItems = [];
        sfx.playTransition();
        this.showFloatText(isNextStage ? "STAGE CLEAR" : "WAVE CLEARED", WORLD.w/2, WORLD.h/2 - 50, "#00f2ff");
    }

    renderIdiomSlots() {
        if(this.gameState !== 'PLAYING' && this.gameState !== 'TRANSITION') return;
        const container = document.getElementById('idiom-ui'); container.innerHTML = ''; container.style.setProperty('--n', this.maxSlots); { const avail = Math.min(WORLD.rw, 720) * 0.98 - (this.maxSlots - 1) * 4; container.style.setProperty('--sw', Math.max(40, Math.min(120, avail / this.maxSlots)) + 'px'); }
        for (let i = 0; i < this.maxSlots; i++) {
            const slot = this.slots[i]; const div = document.createElement('div');
            if (slot) {
                // 產生每個字元的 HTML 結構
                let charsHTML = slot.word.split('').map(c => 
                    `<span class="char ${slot.chars.includes(c) ? 'collected' : 'uncollected'}">${c}</span>`
                ).join('');

                if (slot.type === 'READY') {
                    div.className = 'slot ready'; 
                    div.innerHTML = `<div class="slot-title">${charsHTML}</div><span class="slot-key">${i + 1}</span><div class="slot-subtitle">按 ${i + 1} 發動<br>(${slot.effectDesc})</div>`;
                    div.onclick = (e) => { e.stopPropagation(); this.useIdiom(i); };
                    div.ontouchstart = (e) => { e.stopPropagation(); e.preventDefault(); this.useIdiom(i); };
                } else if (slot.type === 'COLLECTING') {
                    div.className = 'slot collecting';
                    div.innerHTML = `<div class="slot-title">${charsHTML}</div><span class="slot-key">${i + 1}</span><div class="slot-subtitle">${slot.effectDesc}</div>`;
                }
            }
            container.appendChild(div);
        }
    }

    useIdiom(index) {
        const idiom = this.slots[index];
        if (!idiom || idiom.type !== 'READY' || this.paused || this.casting) return;
        const r = this.pickIdiom();
        this.slots[index] = { type: 'COLLECTING', word: r.word, chars: [], effect: r.effect, effectDesc: r.desc };
        this.renderIdiomSlots();
        this.startCast({ word: idiom.word, effect: idiom.effect, desc: idiom.effectDesc });
    }

    startCast(idiom) {
        this.casting = { idiom, t: 5 }; sfx.playIdiomCast();
        const info = IDIOM_INFO[idiom.word] || ['', ''], useMeaning = Math.random() < 0.5, label = useMeaning ? '意思' : '造句', text = info[useMeaning ? 0 : 1] || '';
        let p = document.getElementById('idiom-popup');
        if (!p) { p = document.createElement('div'); p.id = 'idiom-popup'; document.getElementById('game-container').appendChild(p); }
        p.innerHTML = `<div class="ip-word">${idiom.word}</div><div class="ip-effect">大招效果：${idiom.desc}</div><div class="ip-line"><b>${label}</b>　<span id="ip-text"></span><span class="ip-cur">▌</span></div><div class="ip-bar"><i></i></div>`;
        p.style.display = 'block'; this.typeText(text);
    }
    typeText(text) {   // 像 AI 回覆一樣逐字浮現
        clearInterval(this._tw); const el = document.getElementById('ip-text'); if (!el) return;
        const ch = [...text]; let i = 0, step = Math.max(45, Math.min(130, 3200 / Math.max(1, ch.length)));
        this._tw = setInterval(() => { i++; el.textContent = ch.slice(0, i).join(''); if (i >= ch.length) { clearInterval(this._tw); const c = document.querySelector('#idiom-popup .ip-cur'); if (c) c.style.display = 'none'; } }, step);
    }

    endCast() { clearInterval(this._tw); this.casting = null; const p = document.getElementById('idiom-popup'); if (p) p.style.display = 'none'; }

    finishCast() {
        const idiom = this.casting.idiom; this.endCast(); this.runCasts = (this.runCasts || 0) + 1;
        sfx.playIdiomFire(idiom.effect);
        this.showFloatText(`發動！${idiom.word}！`, this.player.pos.x, this.player.pos.y - 40, '#ffea00');
        if (idiom.effect === 'BOMB_BOOST') this.triggerBomb();
        if (idiom.effect === 'INVINCIBLE') this.invincibleTimer = 10;
        
        if (idiom.effect === 'LASER_BEAM') this.triggerLaser();
        if (idiom.effect === 'SHIELD') { this.shield = Math.min(this.maxHp, this.shield + 50); this.showFloatText('護盾 +50', this.player.pos.x, this.player.pos.y - 70, '#4dd2ff'); }
        if (idiom.effect === 'ALLY') this.summonAllies();
        if (idiom.effect === 'PIERCE') this.pierceTimer = 30;
        if (idiom.effect === 'MISSILE') { this.missileTimer = 10; this.missileCd = 0; }
        if (idiom.effect === 'HEAL') { this.hp = Math.min(this.maxHp, this.hp + 30); this.updateHUD(); }
        if (idiom.effect === 'SLOW_TIME') this.slowTimer = 6;
    }

    triggerBomb() {
        this.bullets.pool.forEach(b => { if(!b.isPlayer) b.active = false; });
        if (this.boss) { const d = Math.min(300, this.boss.maxHp * 0.25); this.dmgEnt(this.boss, d); this.showFloatText(`Boss -${Math.round(d)}`, this.boss.pos.x, this.boss.pos.y + 70, '#ff3366'); }
        this.shock = { t: 0, x: this.player.pos.x, y: this.player.pos.y };
        for (let i = 0; i < 24; i++) this.burst(Math.random() * WORLD.w, Math.random() * WORLD.h, 8);
        this.enemies.forEach(e => { this.dropDarkMatter(e.pos.x, e.pos.y, e.maxHp * 2); this.runKills = (this.runKills || 0) + 1; this.enemyDrop(e, 0.5); sfx.playExplosion(); });
        this.enemies = []; this.showFloatText("全螢幕爆破!", WORLD.w/2, WORLD.h/2, "#ff00ff");
    }
    triggerLaser() { this.laserTimer = 3.0; }

    showFloatText(text, x, y, color = "#fff") { const t = this.texts.get(); t.pos = new Vec2(x, y); t.text = text; t.color = color; t.life = 1.5; }
    dropDarkMatter(x, y, amount) { amount = Math.max(1, Math.round(amount * (1 + 0.2 * this.dmLvl) * (1 + 0.25 * (this.currentStage - 1)) * DM_RATE)); this.runDM = (this.runDM || 0) + amount; this.burst(x, y, amount >= 20 ? 18 : 4); this.darkMatter += amount; this.showFloatText(`+${amount} DM`, x, y, "#b026ff"); this.updateHUD(); }

    updateHUD() {
        if(this.gameState !== 'PLAYING' && this.gameState !== 'TRANSITION') return;
        document.getElementById('dm-val').innerText = this.darkMatter;
        document.getElementById('lvl-val').innerText = this.currentStage === 9 ? "FINAL BOSS" : `${this.currentStage}-${this.currentSub}`;
    }

    loop(timestamp) {
        const dt = Math.min((timestamp - this.lastTime) / 1000, 0.1); this.lastTime = timestamp;
        if (this.gameState === 'PLAYING') { if (!this.paused) { if (this.casting) { this.casting.t -= dt; if (this.casting.t <= 0) this.finishCast(); } else { this.bgClock += dt; this.runClock += dt; if (this.pkMode) this.pkTime += dt; this.update(dt); } } } else if (this.gameState === 'TRANSITION') { this.bgClock += dt; this.runClock += dt; this.updateTransition(dt); } else if (this.gameState === 'INIT') this.updateDemo(dt);
        this.draw(); requestAnimationFrame((t) => this.loop(t));
    }

    updateTransition(dt) {
        this.transitionTimer += dt;
        if (this.transitionTimer > 1.0 && this.transitionTimer <= 2.0) this.player.pos.y -= 1000 * dt; 
        if (this.transitionTimer > 2.0) {
            if (this.isNextStage) {
                if (this.currentStage < CONFIG.MAX_STAGES) { this.currentStage++; this.currentSub = 1; } 
                else if (this.currentStage === 8) { this.currentStage = 9; this.currentSub = 1; } 
                else { this.setState('VICTORY'); return; }
            } else { this.currentSub++; }
            this.resetStage(); this.setState('PLAYING'); this.updateHUD();
        }
        this.texts.pool.forEach(t => { if(t.active) t.update(dt); });
    }

    enemyFire(e, dt) {   // 每種小怪各有專屬的攻擊樣式與頻率
        if (e.pos.y < 20) return;                   // 還沒進入畫面不開火
        const v = 70 + this.currentStage * 14, D = Math.PI / 2;
        const shot = (x, y, a, sp, r, dmg) => { const b = this.bullets.get(); b.pos = new Vec2(x, y); b.vel = new Vec2(Math.cos(a) * sp, Math.sin(a) * sp); b.color = e.color; b.isPlayer = false; b.radius = r; b.damage = dmg; };
        const aim = () => Math.atan2(this.player.pos.y - e.pos.y, this.player.pos.x - e.pos.x);
        if (e.q && e.q.length) {                    // 連發／蓄力／雙擊的後續動作
            e.q[0].t -= dt; if (e.type === 'SNIPER') e.charge = Math.max(0, e.q[0].t);
            if (e.q[0].t <= 0) e.q.shift().f();
            return;
        }
        e.shootTimer += dt; if (e.shootTimer <= e.shootInterval) return; e.shootTimer = 0;
        const x = e.pos.x, y0 = e.pos.y + e.radius, push = (t, f) => { (e.q = e.q || []).push({ t, f }); };
        switch (e.type) {
            case 'SCOUT': shot(x, y0, aim(), v * 0.8, 4, 1); break;                                                        // 單發慢彈
            case 'FIGHTER': for (let i = 0; i < 3; i++) push(i ? 0.14 : 0.01, () => { shot(e.pos.x, e.pos.y + e.radius, aim(), v * 1.1, 4, 1); sfx.playEnemyShoot(); }); return;   // 三連發
            case 'TANK': for (let i = -2; i <= 2; i++) shot(x, y0, D + i * 0.26, v * 0.8, 6, 2); break;                    // 重砲五向齊射
            case 'SWARM': { const k = e.form && e.form.kind;                                                              // 依隊形：直射／瞄準／向外放射
                if (k === 'ring') shot(x, e.pos.y, Math.atan2(e.pos.y - e.cy, e.pos.x - e.cx), v * 0.7, 3, 1);
                else if (k === 'v') shot(x, y0, aim(), v * 0.9, 3, 1); else shot(x, y0, D, v * 0.9, 3, 1); break; }
            case 'SNIPER': e.lockA = aim(); e.charge = 0.9; push(0.9, () => { shot(e.pos.x, e.pos.y + e.radius, e.lockA, v * 1.9, 4, 1.5); e.charge = 0; sfx.playEnemyShoot(); }); sfx.playIdiomCast && 0; return;   // 蓄力瞄準後高速狙擊
            case 'BOMBER': { const p = (e.pat = e.pat || 0) % 3; e.pat++;                                                 // 三向 → 五向 → 慢速大炸彈 輪替
                if (p === 0) [-0.35, 0, 0.35].forEach(o => shot(x, y0, D + o, v * 0.9, 5, 1));
                else if (p === 1) [-0.6, -0.3, 0, 0.3, 0.6].forEach(o => shot(x, y0, D + o, v * 0.85, 5, 1));
                else shot(x, y0, D, v * 0.5, 9, 2); break; }
            case 'GUARD': { const a = aim(); shot(x - 7, y0, a - 0.1, v, 4, 1); shot(x + 7, y0, a + 0.1, v, 4, 1);          // 雙擊：兩次雙發
                push(0.25, () => { const a2 = aim(); shot(e.pos.x - 7, e.pos.y + e.radius, a2 - 0.1, v, 4, 1); shot(e.pos.x + 7, e.pos.y + e.radius, a2 + 0.1, v, 4, 1); sfx.playEnemyShoot(); }); break; }
            default: return;                                                                                               // 俯衝機不開火，靠撞擊
        }
        sfx.playEnemyShoot();
    }

    moveCustom(e, dt) {   // 每種敵機各有專屬移動；蜂群、俯衝隊、護衛會以隊形一起行動
        e.tm += dt; const W = WORLD.w, H = WORLD.h, t = e.tm, cl = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
        const toward = (tx, sp) => { const d = tx - e.pos.x; e.pos.x += cl(d, -sp * dt, sp * dt); };
        switch (e.mv) {
            case 'sway':   // 偵察機：緩慢下降並大幅左右擺盪
                e.pos.y += e.speed * 0.5 * dt; e.pos.x = cl(e.bx + Math.sin(t * 1.6 + e.ph) * 110, e.radius, W - e.radius); if (e.pos.y > H + 40) e.gone = true; break;
            case 'hunt':   // 戰鬥機：下降到定位後，橫向追著玩家
                if (e.pos.y < e.hy) e.pos.y += e.speed * 2 * dt; else e.pos.y = e.hy + Math.sin(t * 2) * 10;
                toward(cl(this.player.pos.x + e.off, e.radius, W - e.radius), e.speed * 3); break;
            case 'march':  // 坦克：沉重地直線推進、駐守，只有輕微橫移
                if (e.pos.y < e.hy) e.pos.y += e.speed * 1.5 * dt;
                e.pos.x = cl(e.pos.x + Math.sin(t * 0.5 + e.ph) * 22 * dt, e.radius, W - e.radius); break;
            case 'dive':   // 俯衝機：V 字編隊朝玩家直線衝刺
                e.pos.x += e.vel.x * dt; e.pos.y += e.vel.y * dt; if (e.pos.y > H + 60 || e.pos.x < -60 || e.pos.x > W + 60) e.gone = true; break;
            case 'formation': {   // 蜂群：整隊一起移動（橫列／V 字／旋轉圓環）
                const f = e.form, n = f.n, c = f.i - (n - 1) / 2, cy = -40 + e.speed * t, cx = e.bx + Math.sin(t * 1.1 + e.ph) * 110;
                let ox, oy;
                if (f.kind === 'line') { ox = c * 60; oy = 0; } else if (f.kind === 'v') { ox = c * 60; oy = Math.abs(c) * 36; }
                else { const a = t * 1.6 + f.i * Math.PI * 2 / n; ox = Math.cos(a) * 84; oy = Math.sin(a) * 84; }
                e.cx = cx; e.cy = cy; e.pos.x = cl(cx + ox, e.radius, W - e.radius); e.pos.y = cy + oy; if (cy > H + 90) e.gone = true; break;
            }
            case 'mirror':   // 狙擊機：定位後與玩家「鏡像」移動
                if (e.pos.y < e.hy) e.pos.y += e.speed * 2.2 * dt; if (!(e.charge > 0)) toward(cl(W - this.player.pos.x, e.radius, W - e.radius), e.speed * 3.5); break;
            case 'lawn':     // 轟炸機：橫掃整個畫面，到邊緣就往下一排
                if (e.pos.y < e.hy) e.pos.y += e.speed * 1.5 * dt; e.pos.x += e.dir * e.speed * 2.2 * dt;
                if (e.pos.x > W - e.radius) { e.pos.x = W - e.radius; e.dir = -1; e.hy = Math.min(e.hy + 55, H * 0.45); }
                if (e.pos.x < e.radius) { e.pos.x = e.radius; e.dir = 1; e.hy = Math.min(e.hy + 55, H * 0.45); } break;
            case 'patrol': { // 護衛機：成對繞圈巡邏
                const a = t * 1.3 + e.ph, cy = Math.min(e.hy, -30 + e.speed * 2.5 * t);
                e.pos.x = cl(e.bx + Math.cos(a) * 100, e.radius, W - e.radius); e.pos.y = cy + Math.sin(a) * 38; break;
            }
        }
    }

    spawnEnemy() {
        const diff = this.currentStage + this.currentSub, t = (this.currentStage - 1) + (this.currentSub - 1) * 0.3, W = WORLD.w, st = this.currentStage;
        const pools = {
            1: this.currentSub > 1 ? ['SCOUT', 'SCOUT', 'DART'] : ['SCOUT'],
            2: ['SCOUT', 'SWARM', 'FIGHTER', 'DART'],
            3: ['SCOUT', 'SWARM', 'SNIPER', 'FIGHTER', 'DART'],
            4: ['DART', 'SNIPER', 'FIGHTER', 'BOMBER', 'SWARM']
        };
        const pool = pools[st] || ['FIGHTER', 'SNIPER', 'BOMBER', 'TANK', 'GUARD', 'SWARM', 'DART'];
        const eType = pool[Math.floor(Math.random() * pool.length)];
        const D = {
            SCOUT:   { speed: 50 + t * 28, hp: 1.5 + t * 1.4, r: 19, c: '#00ffcc', iv: Math.max(2.8, 5.5 - t * 0.4), mv: 'sway' },
            FIGHTER: { speed: 40 + t * 18, hp: 3 + t * 3.2, r: 23, c: '#ffaa00', iv: Math.max(1.6, 3.2 - t * 0.25), mv: 'hunt' },
            TANK:    { speed: 25 + t * 8, hp: 10 + t * 7, r: 33, c: '#ff3366', iv: Math.max(2.0, 4.2 - t * 0.3), mv: 'march' },
            DART:    { speed: 150 + t * 22, hp: 1 + t * 0.9, r: 18, c: '#ff77ff', iv: 999, mv: 'dive' },
            SWARM:   { speed: 55 + t * 14, hp: 1 + t * 0.8, r: 17, c: '#aaff44', iv: Math.max(3.5, 6.5 - t * 0.35), mv: 'formation' },
            SNIPER:  { speed: 35 + t * 6, hp: 2.5 + t * 2.2, r: 21, c: '#66ccff', iv: Math.max(2.0, 3.8 - t * 0.25), mv: 'mirror' },
            BOMBER:  { speed: 30 + t * 6, hp: 6 + t * 4.2, r: 27, c: '#ffcc66', iv: Math.max(1.4, 2.8 - t * 0.2), mv: 'lawn' },
            GUARD:   { speed: 32 + t * 6, hp: 5 + t * 3.4, r: 24, c: '#66ffaa', iv: Math.max(1.0, 2.4 - t * 0.18), mv: 'patrol' }
        }[eType];
        const make = (x, y, extra) => {
            const e = { type: eType, pos: new Vec2(x, y), vel: new Vec2(0, 0), hp: D.hp, maxHp: D.hp, radius: D.r, color: D.c, diff: diff, speed: D.speed,
                shootTimer: Math.random() * D.iv, shootInterval: D.iv, custom: true, mv: D.mv, tm: 0, dir: Math.random() < 0.5 ? -1 : 1, ph: Math.random() * 6, bx: x,
                off: (Math.random() - 0.5) * 160, hy: (eType === 'SNIPER' ? 70 : eType === 'BOMBER' ? 90 : eType === 'GUARD' ? 140 : 130) + Math.random() * 70 };
            Object.assign(e, extra || {}); this.enemies.push(e);
        };
        const x0 = Math.random() * Math.max(10, W - 300) + Math.min(150, W / 2 - 5);
        if (eType === 'SWARM') {   // 蜂群：整隊陣列移動
            const n = 4 + (st >= 3 ? 1 : 0) + (st >= 5 ? 1 : 0), kind = ['line', 'v', 'ring'][Math.floor(Math.random() * 3)], ph = Math.random() * 6;
            for (let i = 0; i < n; i++) make(x0, -40, { form: { kind, i, n }, ph });
        } else if (eType === 'DART') {   // 俯衝機：V 字編隊
            const n = st <= 2 ? 3 : 5;
            for (let i = 0; i < n; i++) { const c = i - (n - 1) / 2, x = x0 + c * 58, y = -30 - Math.abs(c) * 46, a = Math.atan2(this.player.pos.y - y, this.player.pos.x - x); make(x, y, { vel: new Vec2(Math.cos(a) * D.speed, Math.sin(a) * D.speed) }); }
        } else if (eType === 'GUARD') {   // 護衛機：成對巡邏
            const ph = Math.random() * 6; [0, Math.PI].forEach(o => make(x0, -30, { ph: ph + o }));
        } else make(Math.random() * (W - 60) + 30, -30);
    }

    update(dt) {
        const spd = this.player.speed * ((this.keys['ShiftLeft'] || this.keys['ShiftRight']) ? 0.45 : 1);
        // 鍵盤（斜向也不會變快）與拖曳使用同一個移動速度
        const kx = ((this.keys['KeyD'] || this.keys['ArrowRight']) ? 1 : 0) - ((this.keys['KeyA'] || this.keys['ArrowLeft']) ? 1 : 0);
        const ky = ((this.keys['KeyS'] || this.keys['ArrowDown']) ? 1 : 0) - ((this.keys['KeyW'] || this.keys['ArrowUp']) ? 1 : 0);
        const kl = Math.hypot(kx, ky) || 1;
        this.player.pos.x += kx / kl * spd * dt; this.player.pos.y += ky / kl * spd * dt;
        if (!this.pointerActive) this.dragTarget = null;
        if (this.dragTarget) {
            const ex = this.dragTarget.x - this.player.pos.x, ey = this.dragTarget.y - this.player.pos.y, d = Math.hypot(ex, ey), step = spd * dt;
            if (d <= step) { this.player.pos.x = this.dragTarget.x; this.player.pos.y = this.dragTarget.y; }
            else { this.player.pos.x += ex / d * step; this.player.pos.y += ey / d * step; }
        }
        
        this.player.pos.x = Math.max(20, Math.min(WORLD.w - 20, this.player.pos.x));
        this.player.pos.y = Math.max(20, Math.min(WORLD.h - 20, this.player.pos.y));

        const fireRate = this.player.rapidFire > 0 ? Math.min(50, this.st.interval) : this.st.interval;
        if (Date.now() - this.player.lastShoot > fireRate) {
            const dmg = this.st.dmg;
            const shootBullet = (offset, angle) => {
                const b = this.bullets.get(); b.pos = new Vec2(this.player.pos.x + offset, this.player.pos.y - 25);
                b.vel = new Vec2(Math.sin(angle)*800, -Math.cos(angle)*800);
                b.color = SKINS[this.skin].c; b.isPlayer = true; b.radius = 4 + (this.weaponLvl * 0.5); b.damage = dmg; b.homing = this.missileTimer > 0; b.pierce = !!SKINS[this.skin].pierce;
            };
            shootBullet(0, 0); 
            if (this.weaponLvl >= 3 || this.player.spreadFire > 0) { shootBullet(-15, -0.15); shootBullet(15, 0.15); }
            if (this.weaponLvl >= 6 || this.player.spreadFire > 0) { shootBullet(-25, -0.3); shootBullet(25, 0.3); }
            if (this.player.spreadFire > 0) { shootBullet(-35, -0.45); shootBullet(35, 0.45); }
            this.player.lastShoot = Date.now(); sfx.playShoot(this.player.spreadFire > 0 ? 2 : this.player.rapidFire > 0 ? 1 : 0);
        }

        if (this.clearT > 0) { this.clearT -= dt; if (this.clearT <= 0) { this.clearT = 0; this.startTransition(this.clearNext); } }
        if (!this.boss && !(this.clearT > 0)) {
            if (this.currentSub < 3) {
                if (this.enemiesSpawned < this.waveQuota) {
                    this.enemySpawnTimer -= dt;
                    const maxOnScreen = Math.min(8, 2 + Math.floor(this.currentStage * 0.6));
                    if (this.enemySpawnTimer <= 0 && this.enemies.length < maxOnScreen) {
                        this.spawnEnemy(); this.enemiesSpawned++; this.enemySpawnTimer = Math.max(0.5, 2.0 - this.currentStage * 0.15); 
                    }
                } else if (this.enemies.length === 0) { this.clearStage(false); }
            } else {
                this.boss = new Boss(this.currentStage); document.getElementById('boss-bar').style.display = 'block'; sfx.playReady();
            }
        }

        // 掉落成語字塊：分析當前需要哪些字，提高掉落機率
        this.idiomBlockTimer += dt;
        if (this.idiomBlockTimer > 2.0) { // 稍微加快掉落速度
            if (Math.random() < 0.35) this.spawnIdiomBlock(Math.random() * (WORLD.w-60) + 30, -50);
            this.idiomBlockTimer = 0;
        }

        if (this.boss) {
            this.boss.update(dt, this.player.pos, () => { const b = this.bullets.get(); b.damage = this.boss.dmgMul; b.radius = 6; return b; }, (x,y) => this.spawnIdiomBlock(x,y));
            document.getElementById('boss-hp-fill').style.width = (this.boss.hp / this.boss.maxHp * 100) + "%";
            if (this.boss.hp <= 0) {
                this.dropDarkMatter(this.boss.pos.x, this.boss.pos.y, this.boss.dmReward); this.runKills = (this.runKills || 0) + 1; this.enemyDrop({ type: 'BOSS', pos: this.boss.pos });
                sfx.playExplosion(); this.boss = null; this.clearStage(true);
            }
        }

        this.enemies.forEach((e, i) => {
            const sdt = this.slowTimer > 0 ? dt * 0.4 : dt;
            if (e.custom) { this.moveCustom(e, sdt); if (e.gone) { this.enemies.splice(i, 1); return; } }
            else {
                e.pos.x += e.vel.x * sdt; e.pos.y += e.vel.y * sdt;
                if (e.pos.x < e.radius) { e.pos.x = e.radius; e.vel.x = Math.abs(e.vel.x); }
                if (e.pos.x > WORLD.w - e.radius) { e.pos.x = WORLD.w - e.radius; e.vel.x = -Math.abs(e.vel.x); }
                if (e.pos.y < e.radius) { e.pos.y = e.radius; e.vel.y = Math.abs(e.vel.y); }
                if (e.pos.y > WORLD.h - e.radius) { e.pos.y = WORLD.h - e.radius; e.vel.y = -Math.abs(e.vel.y); }
            }

            this.enemyFire(e, dt);

            if (Math.hypot(e.pos.x - this.player.pos.x, e.pos.y - this.player.pos.y) < e.radius + this.player.radius && this.invincibleTimer <= 0) {
                this.hurt(e.type === 'TANK' ? 25 : 15); this.invincibleTimer = 1.0; sfx.playHit(); this.updateHUD(); if(this.hp<=0) this.setState('GAMEOVER');
            }
        });

        this.bullets.pool.forEach(b => {
            if (b.active) {
                if (b.homing) this.steer(b, dt);
                b.update(!b.isPlayer && this.slowTimer > 0 ? dt * 0.4 : dt);
                if (b.pos.y < -50 || b.pos.y > WORLD.h + 50 || b.pos.x < -50 || b.pos.x > WORLD.w+50) b.active = false;
                
                if (b.isPlayer) {
                    if (this.boss && Math.hypot(b.pos.x - this.boss.pos.x, b.pos.y - this.boss.pos.y) < this.boss.radius) {
                        this.dmgEnt(this.boss, b.damage, b.pierce); b.active = false; sfx.playHit();
                    }
                    this.enemies.forEach((e, i) => {
                        if (Math.hypot(b.pos.x - e.pos.x, b.pos.y - e.pos.y) < e.radius) {
                            this.dmgEnt(e, b.damage, b.pierce); b.active = false; sfx.playHit();
                            if(e.hp<=0) { this.dropDarkMatter(e.pos.x, e.pos.y, e.maxHp * 1.5); this.runKills = (this.runKills || 0) + 1; this.enemyDrop(e); sfx.playExplosion(); this.enemies.splice(i, 1); }
                        }
                    });
                    this.idiomBlocks.forEach((m, i) => {
                        if (Math.hypot(b.pos.x - m.pos.x, b.pos.y - m.pos.y) < m.radius) {
                            m.hp -= b.damage; b.active = false; sfx.playHit();
                            if(m.hp<=0) {
                                this.charItems.push({ pos: new Vec2(m.pos.x, m.pos.y), char: m.char });
                                sfx.playExplosion(); this.idiomBlocks.splice(i, 1);
                            }
                        }
                    });
                } else {
                    if (Math.hypot(b.pos.x - this.player.pos.x, b.pos.y - this.player.pos.y) < this.player.radius && this.invincibleTimer <= 0) {
                        this.hurt(b.damage * 10); b.active = false; this.invincibleTimer = 0.5; sfx.playHit(); this.updateHUD(); if(this.hp<=0) this.setState('GAMEOVER');
                    }
                }
            }
        });

        this.idiomBlocks.forEach((m, i) => {
            m.pos.y += 60 * dt; 
            if (m.pos.y > WORLD.h + m.radius) this.idiomBlocks.splice(i, 1);
        });

        this.charItems.forEach((c, i) => {
            c.pos.y += 120 * dt; 
            const cd = Math.hypot(c.pos.x - this.player.pos.x, c.pos.y - this.player.pos.y);
            if (this.magnetLvl > 0 && cd > 1 && cd < 100 + this.magnetLvl * 40) { c.pos.x += (this.player.pos.x - c.pos.x) / cd * 300 * dt; c.pos.y += (this.player.pos.y - c.pos.y) / cd * 300 * dt; }
            if (cd < 40 + this.magnetLvl * 10) {
                this.collectChar(c.char); this.charItems.splice(i, 1);
            }
        });

        if (this.laserTimer > 0) {
            if (this.boss && Math.abs(this.boss.pos.x - this.player.pos.x) < this.boss.radius + 25) this.dmgEnt(this.boss, 70 * dt);
            this.enemies.forEach((e, i) => {
                if (Math.abs(e.pos.x - this.player.pos.x) < 25 && e.pos.y < this.player.pos.y) {
                    this.dmgEnt(e, 50 * dt); if(e.hp<=0) { this.dropDarkMatter(e.pos.x, e.pos.y, e.maxHp*1.5); this.runKills = (this.runKills || 0) + 1; this.enemyDrop(e); sfx.playExplosion(); this.enemies.splice(i, 1); }
                }
            });
            this.idiomBlocks.forEach((m, i) => {
                if (Math.abs(m.pos.x - this.player.pos.x) < 25 && m.pos.y < this.player.pos.y) {
                    m.hp -= 100 * dt; 
                    if(m.hp<=0) { this.charItems.push({ pos: new Vec2(m.pos.x, m.pos.y), char: m.char }); sfx.playExplosion(); this.idiomBlocks.splice(i, 1); }
                }
            });
        }

        this.texts.pool.forEach(t => { if(t.active) t.update(dt); });

        if (this.invincibleTimer > 0) this.invincibleTimer -= dt;
        if (this.slowTimer > 0) this.slowTimer -= dt;
        if (this.shock) { this.shock.t += dt; if (this.shock.t > 1.2) this.shock = null; }
        this.particles = this.particles.filter(p => (p.life -= dt) > 0);
        this.particles.forEach(p => { p.x += p.vx * dt; p.y += p.vy * dt; });
        if (this.player.rapidFire > 0) this.player.rapidFire -= dt;
        if (this.player.spreadFire > 0) this.player.spreadFire -= dt;
        if (this.laserTimer > 0) this.laserTimer -= dt;
        if (this.pierceTimer > 0) this.pierceTimer -= dt;
        if (this.missileTimer > 0) this.missileTimer -= dt;
        this.updateAllies(dt);
        this.updateDmgTexts(dt);
        this.updateBuffs();
    }

    handleKey(e) {
        const st = this.gameState;
        if (this.dlgOpen) { if (e.code === 'Escape' || e.code === 'KeyO') this.closeDlg(); else if ((e.code === 'Enter' || e.code === 'NumpadEnter') && this.dlgConfirm) this.dlgConfirm(); return; }
        if (st !== 'INIT' && e.code === 'KeyO') { this.openSettings(); return; }
        if (st === 'PLAYING' && e.code === 'KeyH') { this.goHome(); return; }
        const enter = e.code === 'Enter' || e.code === 'NumpadEnter' || e.code === 'Space';
        const m = /^(Digit|Numpad)(\d)$/.exec(e.code); const num = m ? parseInt(m[2]) : 0;
        if (st === 'INIT') { if (!/^(Shift|Control|Alt|Meta)/.test(e.code)) document.getElementById('boot-btn').click(); }
        else if (st === 'LOBBY') {
            if (enter) this.startNewGame();
            else if (e.code === 'KeyS') this.setState('SHOP');
            else if (e.code === 'KeyH') this.openHangar();
            else if (e.code === 'ArrowLeft' || e.code === 'KeyA') this.changeStart(-1);
            else if (e.code === 'ArrowRight' || e.code === 'KeyD') this.changeStart(1);
            else if (e.code === 'KeyR') this.equip(this.recommend(this.startStage).ship.id);
        }
        else if (st === 'HANGAR') {
            if (e.code === 'ArrowLeft' || e.code === 'KeyA') this.hSel((this.hIdx + SHIPS.length - 1) % SHIPS.length);
            else if (e.code === 'ArrowRight' || e.code === 'KeyD') this.hSel((this.hIdx + 1) % SHIPS.length);
            else if (num >= 1 && num <= 4) this.upgrade(SHIPS[this.hIdx].id, ['dmg', 'rate', 'hp', 'spd'][num - 1]);
            else if (enter || e.code === 'KeyE') this.hEquip();
            else if (e.code === 'Escape' || e.code === 'KeyB') this.setState('LOBBY');
        }
        else if (st === 'SHOP') { if (num >= 1) this.buyItem(num - 1); else if (e.code === 'Escape' || e.code === 'KeyB' || enter) this.setState('LOBBY'); } else if (st === 'GAMEOVER' || st === 'VICTORY') { if (enter) this.setState('LOBBY'); else if (e.code === 'KeyR') this.startNewGame(); }
        else if (st === 'PLAYING') {
            if (this.casting) return;
            if (e.code === 'KeyP' || e.code === 'Escape' || (this.paused && enter)) { this.paused = !this.paused; music.pause(this.paused); }
            else if (!this.paused) {
                if (num >= 1) this.useIdiom(num - 1);
                else if (e.code === 'Space') { const i = this.slots.findIndex(x => x.type === 'READY'); if (i >= 0) this.useIdiom(i); }
            }
        }
    }

    pickIdiom() {
        const used = this.slots.map(x => x.word);
        const pool = CONFIG.IDIOMS.filter(i => !used.includes(i.word));
        return pool[Math.floor(Math.random() * pool.length)];
    }

    burst(x, y, n) {
        for (let i = 0; i < n; i++) {
            const a = Math.random() * Math.PI * 2, v = 60 + Math.random() * 200;
            this.particles.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: 0.6 + Math.random() * 0.4, color: ['#ffea00','#ffaa00','#ff3366','#ffffff'][i % 4] });
        }
    }

    clearStage(next) {   // 區塊清除：倒數 5 秒（可以趁機撿字卡）後才前往下一關
        if (this.pkMode) { this.startTransition(next); return; }
        if (this.clearT > 0) return;
        this.clearT = 5; this.clearNext = next; document.getElementById('boss-bar').style.display = 'none'; sfx.playReady();
    }
    randomChar(pNeed) {   // 有機率掉「目前還缺的字」，否則從全部成語隨機抽一個字
        const need = [];
        this.slots.forEach(sl => { if (sl.type === 'COLLECTING') for (const ch of sl.word) if (!sl.chars.includes(ch)) need.push(ch); });
        if (need.length && Math.random() < pNeed) return need[Math.floor(Math.random() * need.length)];
        const w = CONFIG.IDIOMS[Math.floor(Math.random() * CONFIG.IDIOMS.length)].word; return w[Math.floor(Math.random() * 4)];
    }
    enemyDrop(e, k = 1) {   // 擊落敵機：依機種機率掉落字卡（字元）；Boss 一次掉 3 個
        const P = { SCOUT: 0.45, FIGHTER: 0.55, TANK: 1, DART: 0.35, SWARM: 0.25, SNIPER: 0.6, BOMBER: 0.7, GUARD: 0.6, BOSS: 1 }, n = e.type === 'BOSS' ? 3 : 1;
        for (let i = 0; i < n; i++) if (Math.random() < (P[e.type] === undefined ? 0.5 : P[e.type]) * k) this.charItems.push({ pos: new Vec2(e.pos.x + (i - (n - 1) / 2) * 34, e.pos.y), char: this.randomChar(0.6) });
    }

    // 智能掉落：高機率掉落目前需要的字元
    spawnIdiomBlock(x, y) {
        let neededChars = [];
        this.slots.forEach(slot => {
            if (slot.type === 'COLLECTING') {
                for (let char of slot.word) {
                    if (!slot.chars.includes(char)) neededChars.push(char);
                }
            }
        });

        let dropChar;
        if (neededChars.length > 0 && Math.random() < 0.8) {
            dropChar = neededChars[Math.floor(Math.random() * neededChars.length)];
        } else {
            const randomIdiom = CONFIG.IDIOMS[Math.floor(Math.random() * CONFIG.IDIOMS.length)];
            dropChar = randomIdiom.word[Math.floor(Math.random() * 4)];
        }

        this.idiomBlocks.push({ pos: new Vec2(x, y), radius: 25, hp: 6 + this.currentStage*2, char: dropChar, maxHp: 6 + this.currentStage*2 });
    }

    // 無序收集判定
    collectChar(char) {
        let collected = false;
        for (let slot of this.slots) {
            if (slot.type === 'COLLECTING' && slot.word.includes(char) && !slot.chars.includes(char)) {
                slot.chars.push(char);
                collected = true;
                sfx.playCollect();
                this.showFloatText(char, this.player.pos.x, this.player.pos.y - 20, '#00f2ff');

                if (slot.chars.length === 4) {
                    slot.type = 'READY';
                    sfx.playReady();
                    this.showFloatText(`${slot.word} 完成!`, this.player.pos.x, this.player.pos.y - 40, '#ffea00');
                }
                break; // 只要有一個槽位吸收了這個字就跳出
            }
        }

        if (!collected) {
            // 如果吸收的字目前不需要，轉換為暗物質
            this.dropDarkMatter(this.player.pos.x, this.player.pos.y, 10);
            this.showFloatText("轉換DM", this.player.pos.x, this.player.pos.y - 20, '#b026ff');
            sfx.playHit();
        }
        this.renderIdiomSlots();
    }

    draw() {
        const ctx = this.ctx; ctx.setTransform(WORLD.k, 0, 0, WORLD.k, 0, 0);
        ctx.fillStyle = "#050510"; ctx.fillRect(0, 0, WORLD.w, WORLD.h);
        if (this.gameState === 'INIT') { this.drawDemo(ctx); return; }
        const bg = BG[this.currentStage];
        if (bg && this.gameState !== 'LOBBY') {
            const W = WORLD.w, H = WORLD.h, h = Math.ceil(bg.height * W / bg.width);
            const off = (this.bgClock * 1000 / (this.gameState === 'TRANSITION' && this.transitionTimer > 1.0 ? 5 : 18)) % h;
            for (let y = off - h; y < H; y += h) ctx.drawImage(bg, 0, Math.floor(y), W, h + 1);
            ctx.fillStyle = 'rgba(0,0,8,0.22)'; ctx.fillRect(0, 0, W, H);
        }

        const starSpeed = this.gameState === 'TRANSITION' && this.transitionTimer > 1.0 ? 200 : 20;
        ctx.fillStyle = "rgba(255,255,255,0.5)";
        for(let i=0; i<40; i++) {
            const x = (Math.sin(i*99) + 1) / 2 * WORLD.w;
            const y = (this.bgClock * starSpeed + i * 200) % WORLD.h;
            ctx.fillRect(x, y, 2, 2);
        }

        if (this.gameState === 'PLAYING' || this.gameState === 'TRANSITION') {
            if (this.laserTimer > 0) {
                const laserWidth = 40 + Math.random() * 10;
                ctx.fillStyle = "rgba(255, 234, 0, 0.8)"; ctx.shadowBlur = 25; ctx.shadowColor = "#ffea00";
                ctx.fillRect(this.player.pos.x - laserWidth/2, 0, laserWidth, this.player.pos.y); ctx.shadowBlur = 0;
                ctx.fillStyle = "#ffffff"; ctx.fillRect(this.player.pos.x - laserWidth/4, 0, laserWidth/2, this.player.pos.y);
            }

            // 【全新：華麗星際戰機繪製】
            ctx.save();
            ctx.translate(this.player.pos.x, this.player.pos.y);
            ctx.scale(SKINS[this.skin].s, SKINS[this.skin].s);
            
            const isInv = this.invincibleTimer > 0;
            const shipImg = IMG['ship_' + SKINS[this.skin].id] || IMG.player;
            if (shipImg) {
                if (isInv) ctx.globalAlpha = 0.6 + 0.4 * Math.sin(this.bgClock * 1000 / 40);
                ctx.shadowColor = SKINS[this.skin].c; ctx.shadowBlur = 18; if (!IMG['ship_' + SKINS[this.skin].id]) ctx.filter = `hue-rotate(${SKINS[this.skin].h}deg)`; fitDraw(ctx, shipImg, shipImg.width / shipImg.height > 1.3 ? 118 : 96); ctx.restore();
            } else {
            const mainColor = isInv ? "#ffea00" : SKINS[this.skin].c;
            const hullColor = "#0f172a"; // 金屬暗灰
            
            ctx.shadowBlur = isInv ? 20 : 10;
            ctx.shadowColor = mainColor;

            // 引擎噴射火焰
            if (isInv || Math.floor(this.bgClock * 1000 / 50) % 2 === 0) {
                const flameLen = (this.gameState === 'TRANSITION' && this.transitionTimer > 1.0) ? 60 : 25 + Math.random() * 15;
                ctx.fillStyle = isInv ? "#ffffff" : "#ffaa00";
                ctx.shadowBlur = 20; ctx.shadowColor = "#ffaa00";
                
                // 左引擎
                ctx.beginPath(); ctx.moveTo(-12, 12); ctx.lineTo(-6, 12); ctx.lineTo(-9, 12 + flameLen); ctx.fill();
                // 右引擎
                ctx.beginPath(); ctx.moveTo(6, 12); ctx.lineTo(12, 12); ctx.lineTo(9, 12 + flameLen); ctx.fill();
            }

            ctx.shadowBlur = isInv ? 15 : 5;
            
            // 主機翼 (外展後掠翼)
            ctx.fillStyle = hullColor;
            ctx.strokeStyle = mainColor;
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(0, -10);
            ctx.lineTo(-30, 15); // 左翼尖
            ctx.lineTo(-30, 20);
            ctx.lineTo(-10, 10);
            ctx.lineTo(10, 10);
            ctx.lineTo(30, 20); // 右翼尖
            ctx.lineTo(30, 15);
            ctx.closePath();
            ctx.fill(); ctx.stroke();

            // 內側輔助翼
            ctx.beginPath();
            ctx.moveTo(0, -15);
            ctx.lineTo(-15, 5);
            ctx.lineTo(15, 5);
            ctx.closePath();
            ctx.fillStyle = "#1e293b";
            ctx.fill(); ctx.stroke();

            // 戰機機身 (流線型)
            ctx.beginPath();
            ctx.moveTo(0, -32); // 機鼻
            ctx.lineTo(-8, -5);
            ctx.lineTo(-8, 15); // 機尾
            ctx.lineTo(0, 18);
            ctx.lineTo(8, 15);
            ctx.lineTo(8, -5);
            ctx.closePath();
            ctx.fillStyle = hullColor;
            ctx.fill(); ctx.stroke();

            // 發光駕駛艙
            ctx.fillStyle = isInv ? "rgba(255, 234, 0, 0.9)" : mainColor;
            ctx.shadowBlur = 15;
            ctx.beginPath();
            ctx.moveTo(0, -18);
            ctx.lineTo(-4, -5);
            ctx.lineTo(0, 2);
            ctx.lineTo(4, -5);
            ctx.closePath();
            ctx.fill();
            
            ctx.restore();

            }
            if (this.boss) {
                const bimg = IMG['boss_' + this.boss.stage] || IMG.boss;
                if (bimg) { const R = this.boss.radius * 2; ctx.save(); ctx.shadowBlur = 25; ctx.shadowColor = this.boss.color; ctx.translate(this.boss.pos.x, this.boss.pos.y); fitDraw(ctx, bimg, this.boss.size);
                    ctx.fillStyle = '#fff'; ctx.font = "bold 18px 'Microsoft JhengHei'"; ctx.textAlign = 'center'; ctx.fillText('BOSS・' + bossLabel(this.boss.stage), 0, this.boss.size * 0.5 + 18); ctx.restore(); }
                else this.boss.draw(ctx);
            }
            this.bullets.pool.forEach(b => { if(b.active) b.draw(ctx); });
            
            const time = this.bgClock * 1000;
            this.enemies.forEach(e => {
                ctx.save();
                ctx.translate(e.pos.x, e.pos.y);

            Object.assign(this.profile, m.profile); localStorage.setItem(SAVEKEY, JSON.stringify(m.save)); G.resetProgress(); G.load(); G.applyUpgrades(); this.queuePush(); toast('已同步離線期間的進度');
          } }
        try { this.isAdmin = (await db.collection('admins').doc(u.uid).get()).exists; } catch (e) { this.isAdmin = false; }
        this.startListeners(); this.mountChat();
        if (G.gameState === 'LOGIN') G.setState(this.profile.tutorialDone ? 'LOBBY' : 'TUTORIAL');
    },
    onLogout() {
        this.unsubs.forEach(f => { try { f(); } catch (e) {} }); this.unsubs = []; this.stopChat();
        this.user = null; this.profile = null; this.isAdmin = false; this.friends = []; this.reqIn = []; this.invites = []; this.groups = [];
        localStorage.removeItem(SAVEKEY); G.resetProgress();
        const f = $('chat-fab'), p = $('chat-panel'); if (f) f.style.display = 'none'; if (p) p.style.display = 'none';
        if (!['INIT', 'LOGIN'].includes(G.gameState)) G.setState('LOGIN');
    },
    logout() { this.pushNow(); if (fbOk) auth.signOut(); },

    // ===== 離線模式：裝置上保留最近一次登入的進度 =====
    readMirror() { try { return JSON.parse(localStorage.getItem(MIRROR) || 'null'); } catch (e) { return null; } },
    writeMirror() {
        const uid = this.user ? this.user.uid : this.offlineUid; if (!uid || !this.profile) return;
        const keys = ['bestScore', 'totalDM', 'spentDM', 'pkWins', 'pkLosses', 'bestClearMs', 'clearAt', 'clearKey', 'tutorialDone'], pr = {}; keys.forEach(k => { if (this.profile[k] !== undefined) pr[k] = this.profile[k]; });
        let sv = null; try { sv = JSON.parse(localStorage.getItem(SAVEKEY) || 'null'); } catch (e) {}
        try { localStorage.setItem(MIRROR, JSON.stringify({ uid, username: this.profile.username, name: this.profile.name, profile: pr, save: sv, dirty: !!(this.offline || this._dirty), updatedAt: Date.now() })); } catch (e) {}
    },
    startOffline() {
        const m = this.readMirror(); if (!m) return toast('這台裝置還沒有登入過，第一次需要網路');
        this.offline = true; this.offlineUid = m.uid; this.user = null;
        this.profile = Object.assign({ username: m.username, name: m.name, tutorialDone: true }, m.profile);
        if (m.save) localStorage.setItem(SAVEKEY, JSON.stringify(m.save)); else localStorage.removeItem(SAVEKEY);
        G.resetProgress(); G.load(); G.applyUpgrades();
        if (G.gameState === 'LOGIN') { G.setState('LOBBY'); toast('離線模式：進度先存在這台裝置，連網後點「連線登入」即可同步', 5000); }
    },
    goLogin() { this.offline = false; G.setState('LOGIN'); },

    // ===== 雲端存檔 / 統計 =====
    queuePush() { this._dirty = true; this.writeMirror(); clearTimeout(this._pt); this._pt = setTimeout(() => this.pushNow(), 1500); },
    pushNow() {
        if (!this.user || !this.profile || !db) return;
        let sv = null; try { sv = JSON.parse(localStorage.getItem(SAVEKEY) || 'null'); } catch (e) {}
        const doc = Object.assign({}, this.profile, { save: sv, darkMatter: G.darkMatter, updatedAt: Date.now() });
        db.collection('users').doc(this.user.uid).set(doc, { merge: true }).then(() => { this._dirty = false; this.writeMirror(); }).catch(() => {});
    },
    stat(k, d) { if (!this.profile) return; this.profile[k] = (this.profile[k] || 0) + d; this.queuePush(); },
    finishRun(victory) {
        if (!this.profile || G.pkMode) return;
        const score = Math.round((G.runDM || 0) * 10); this.profile.bestScore = Math.max(this.profile.bestScore || 0, score);
        let extra = '';
        if (victory && G.runStart === 1) {
            const ms = Math.round(G.runClock * 1000), best = this.profile.bestClearMs;
            if (best === undefined || ms < best) {
                this.profile.bestClearMs = ms; this.profile.clearAt = Date.now(); this.profile.clearKey = pad(ms, 9) + pad(this.profile.clearAt, 14);
                extra = `<br>全關卡破關時間 <b>${fmtTime(ms)}</b>（新紀錄！）`;
            } else extra = `<br>全關卡破關時間 ${fmtTime(ms)}（個人紀錄 ${fmtTime(best)}）`;
        } else if (victory) extra = '<br><small>從第 1 關出發並通關才會計入「全關卡破關時間」排行</small>';
        this.queuePush();
        const el = $('res-extra') || G.uiLayer.querySelector('.menu-overlay');
        if (el) el.insertAdjacentHTML('beforeend', `<p style="color:var(--neon-gold)">歷史最高分 <b>${this.profile.bestScore}</b>${extra}</p>`);
    },

    },

    // ===== 排行榜 =====
    async renderRank(tab) {

    // ===== 好友 =====
    startListeners() {
        const uid = this.user.uid, U = db.collection('users').doc(uid), on = (q, f) => this.unsubs.push(q.onSnapshot(f, () => {}));
        on(U.collection('friends'), s => { this.friends = s.docs.map(d => Object.assign({ uid: d.id }, d.data())); this.refresh(); this.chatSel(); });
        on(db.collection('friendRequests').where('to', '==', uid).where('status', '==', 'pending'), s => { this.reqIn = s.docs.map(d => Object.assign({ id: d.id }, d.data())); this.refresh(); });
        on(db.collection('friendRequests').where('from', '==', uid).where('status', '==', 'accepted'), s => s.docs.forEach(d => { const x = d.data();
            U.collection('friends').doc(x.to).set({ name: x.toName, ts: Date.now() }).then(() => d.ref.delete()).catch(() => {}); }));
        on(U.collection('invites'), s => { const old = new Set(this.invites.map(i => i.code)); this.invites = s.docs.map(d => d.data());
            this.invites.forEach(i => { if (!old.has(i.code) && old.size + 1) toast(`${i.fromName} 邀請你 PK！房間密碼 ${i.code}`, 5000); }); this.refresh(); });
        on(db.collection('groups').where('members', 'array-contains', uid), s => { this.groups = s.docs.map(d => Object.assign({ id: d.id }, d.data())); this.chatSel(); });
    },
    renderFriends() {
        const keep = ($('fr-in') || {}).value || '', me = this.user.uid;
        ui(`<div class="menu-overlay" style="width:min(94vw,520px)"><h2 class="shop-title">好友</h2>
            <div class="row"><input class="inp" id="fr-in" style="flex:1;margin:0" placeholder="輸入對方帳號加好友" value="${esc(keep)}"><button class="sm" onclick="online.addFriend(document.getElementById('fr-in').value)">送出邀請</button></div>
            ${this.invites.length ? `<h4>PK 邀請</h4>` + this.invites.map(i => `<div class="row"><span>${esc(i.fromName)} 邀請你 PK（${esc(i.code)}）</span><button class="sm" onclick="online.acceptInvite('${esc(i.code)}')">加入</button><button class="sm red" onclick="online.dropInvite('${esc(i.code)}')">拒絕</button></div>`).join('') : ''}
            ${this.reqIn.length ? `<h4>好友邀請</h4>` + this.reqIn.map(r => `<div class="row"><span>${esc(r.fromName)}</span><button class="sm" onclick="online.acceptReq('${r.id}')">接受</button><button class="sm red" onclick="online.declineReq('${r.id}')">拒絕</button></div>`).join('') : ''}
            <h4>好友列表（${this.friends.length}）</h4><div class="lst">${this.friends.length ? this.friends.map(f => `<div class="row"><span>${esc(f.name)}</span><button class="sm" onclick="online.openChat('dm','${f.uid}')">聊天</button><button class="sm" onclick="online.invite('${f.uid}')">邀請 PK</button><button class="sm red" onclick="online.removeFriend('${f.uid}')">刪除</button></div>`).join('') : '<p class="muted">還沒有好友，輸入對方帳號試試</p>'}</div>${BACK}</div>`);
        const inp = $('fr-in'); if (inp) inp.onkeydown = e => { if (e.key === 'Enter') this.addFriend(inp.value); };
    },
    async addFriend(name) {
        name = (name || '').trim().toLowerCase(); if (!name) return;
        try {
            const q = await db.collection('users').where('username', '==', name).limit(1).get();
            if (q.empty) return toast('找不到這個帳號');
            const t = q.docs[0], me = this.user.uid;
            if (t.id === me) return toast('不能加自己為好友');
            if (this.friends.some(f => f.uid === t.id)) return toast('已經是好友了');
            await db.collection('friendRequests').doc(me + '_' + t.id).set({ from: me, to: t.id, fromName: this.profile.name, toName: t.data().name, status: 'pending', ts: Date.now() });
            toast('已送出好友邀請');
        } catch (e) { toast(errMsg(e)); }
    },
    async acceptReq(id) {
        const r = this.reqIn.find(x => x.id === id); if (!r) return;
        try { await db.collection('friendRequests').doc(id).update({ status: 'accepted' });
            await db.collection('users').doc(this.user.uid).collection('friends').doc(r.from).set({ name: r.fromName, ts: Date.now() }); toast('已成為好友'); } catch (e) { toast(errMsg(e)); }
    },
    declineReq(id) { db.collection('friendRequests').doc(id).delete().catch(e => toast(errMsg(e))); },
    removeFriend(uid) { db.collection('users').doc(this.user.uid).collection('friends').doc(uid).delete().catch(e => toast(errMsg(e))); },
    dropInvite(code) { db.collection('users').doc(this.user.uid).collection('invites').doc(code).delete().catch(() => {}); },
    acceptInvite(code) { this.dropInvite(code); G.setState('PK'); this.joinRoom(code); },
    async invite(uid) {
        try {
            if (!this.pk) { G.setState('PK'); await this.createRoom(); }
            if (!this.pk || this.pk.role !== 'host') return toast('只有主控端可以邀請好友');
            await db.collection('users').doc(uid).collection('invites').doc(this.pk.code).set({ code: this.pk.code, fromUid: this.user.uid, fromName: this.profile.name, ts: Date.now() });
            toast('已送出 PK 邀請');
        } catch (e) { toast(errMsg(e)); }
    },

    // ===== 聊天 =====
    mountChat() {
        if ($('chat-fab')) return;
        $('game-container').insertAdjacentHTML('beforeend', `<button id="chat-fab" title="聊天">💬<i id="chat-badge"></i></button>
            <div id="chat-panel"><div class="ch-head"><span>聊天</span><button id="ch-min" title="收折">—</button></div>
            <div class="ch-tabs"><button data-t="lobby">大廳</button><button data-t="dm">好友</button><button data-t="group">群組</button></div>
            <div id="ch-sel"></div><div id="ch-msgs"></div><div class="ch-in"><input id="ch-input" maxlength="200" placeholder="輸入訊息…"><button id="ch-send">送出</button></div></div>`);
        $('chat-fab').onclick = () => this.toggleChat(); $('ch-min').onclick = () => this.toggleChat(false);
        document.querySelectorAll('#chat-panel .ch-tabs button').forEach(b => { b.onclick = () => this.openChat(b.dataset.t); });
        $('ch-send').onclick = () => this.sendChat(); $('ch-input').onkeydown = e => { if (e.key === 'Enter') this.sendChat(); };
        this.updateChatVis();
    },
    updateChatVis() { const f = $('chat-fab'); if (!f) return; const show = this.user && !['INIT', 'LOGIN', 'PLAYING', 'TRANSITION'].includes(G.gameState); f.style.display = show ? 'block' : 'none'; if (!show) { $('chat-panel').style.display = 'none'; } else if (this.chat.open) $('chat-panel').style.display = 'flex'; },
    toggleChat(v) {
        const c = this.chat; c.open = v === undefined ? !c.open : v; $('chat-panel').style.display = c.open ? 'flex' : 'none';
        if (c.open) { c.unread = 0; $('chat-badge').style.display = 'none'; if (!c.th) this.openChat(c.tab); }
    },
    stopChat() { const c = this.chat; if (c.unsub) { c.unsub(); c.unsub = null; } c.th = null; c.msgs = []; c.open = false; },
    openChat(tab, peer) {
        const c = this.chat; c.tab = tab; c.open = true; c.unread = 0; $('chat-badge').style.display = 'none'; $('chat-panel').style.display = 'flex';
        document.querySelectorAll('#chat-panel .ch-tabs button').forEach(b => b.classList.toggle('on', b.dataset.t === tab));
        this.chatSel(peer);
    },
    dmId(peer) { return [this.user.uid, peer].sort().join('_'); },
    chatSel(peer) {
        const c = this.chat, sel = $('ch-sel'); if (!sel || !this.user) return;
        if (c.tab === 'lobby') { sel.innerHTML = '<span class="muted">所有玩家都看得到（管理員可查看所有聊天內容）</span>'; this.subChat({ k: 'lobby' }); }
        else if (c.tab === 'dm') {
            if (!this.friends.length) { sel.innerHTML = '<span class="muted">加好友後才能私訊</span>'; this.subChat(null); return; }
            const cur = peer || (c.th && c.th.k === 'dm' ? c.th.peer : this.friends[0].uid);
            sel.innerHTML = `<select id="ch-friend">${this.friends.map(f => `<option value="${f.uid}" ${f.uid === cur ? 'selected' : ''}>${esc(f.name)}</option>`).join('')}</select>`;
            $('ch-friend').onchange = e => this.chatSel(e.target.value); this.subChat({ k: 'dm', peer: cur });
        } else {
            const cur = (c.th && c.th.k === 'group' && this.groups.some(g => g.id === c.th.id)) ? c.th.id : (this.groups[0] && this.groups[0].id);
            sel.innerHTML = `${this.groups.length ? `<select id="ch-group">${this.groups.map(g => `<option value="${g.id}" ${g.id === cur ? 'selected' : ''}>${esc(g.name)}</option>`).join('')}</select>` : '<span class="muted">還沒有群組</span>'}<button class="sm" id="ch-new">＋建立群組</button>`;
            if ($('ch-group')) $('ch-group').onchange = e => this.subChat({ k: 'group', id: e.target.value });
            $('ch-new').onclick = () => this.groupForm(); this.subChat(cur ? { k: 'group', id: cur } : null);
        }
    },
    groupForm() {
        if (!this.friends.length) return toast('先加好友才能建立群組');
        $('ch-msgs').innerHTML = `<input class="inp" id="gp-name" maxlength="12" placeholder="群組名稱">${this.friends.map(f => `<label style="display:block"><input type="checkbox" class="gp-f" value="${f.uid}" data-n="${esc(f.name)}"> ${esc(f.name)}</label>`).join('')}<button class="sm" id="gp-ok">建立</button>`;
        $('gp-ok').onclick = async () => {
            const name = $('gp-name').value.trim(), sel = [...document.querySelectorAll('.gp-f:checked')];
            if (!name || !sel.length) return toast('請輸入名稱並勾選好友');
            const names = { [this.user.uid]: this.profile.name }; sel.forEach(x => { names[x.value] = x.dataset.n; });
            try { const r = await db.collection('groups').add({ name, owner: this.user.uid, members: [this.user.uid, ...sel.map(x => x.value)], memberNames: names, ts: Date.now() }); this.chat.th = { k: 'group', id: r.id }; this.chat.key = ''; $('ch-msgs').innerHTML = ''; toast('群組已建立'); this.chatSel(); }
            catch (e) { toast(errMsg(e)); }
        };
    },
    chatRef(th) {
        if (th.k === 'lobby') return db.collection('lobbyChat');
        if (th.k === 'dm') return db.collection('dms').doc(this.dmId(th.peer)).collection('messages');
        return db.collection('groups').doc(th.id).collection('messages');
    },
    subChat(th) {
        const c = this.chat, key = th ? JSON.stringify(th) : ''; if (key === c.key && c.unsub) return;
        if (c.unsub) { c.unsub(); c.unsub = null; } c.key = key; c.th = th; c.msgs = []; c.first = true; this.renderMsgs();
        if (!th) return;
        c.unsub = this.chatRef(th).orderBy('ts', 'desc').limit(60).onSnapshot(s => {
            const list = s.docs.map(d => d.data()).reverse();
            if (!c.first && !c.open && list.length > c.msgs.length) { c.unread += list.length - c.msgs.length; const b = $('chat-badge'); b.textContent = c.unread; b.style.display = 'block'; }
            c.first = false; c.msgs = list; this.renderMsgs();
        }, e => { $('ch-msgs').textContent = errMsg(e); });
    },
    renderMsgs() {
        const box = $('ch-msgs'); if (!box || $('gp-name')) return;
        box.innerHTML = this.chat.msgs.length ? this.chat.msgs.map(m => msgHtml(m, this.user && m.uid === this.user.uid)).join('') : '<p class="muted">還沒有訊息</p>'; box.scrollTop = box.scrollHeight;
    },
    async sendChat() {
        const inp = $('ch-input'), text = inp.value.trim(), th = this.chat.th; if (!text || !th) return;
        inp.value = '';
        try {
            if (th.k === 'dm') { const id = this.dmId(th.peer), f = this.friends.find(x => x.uid === th.peer);
                if (!this.chat.dmReady[id]) { await db.collection('dms').doc(id).set({ members: [this.user.uid, th.peer], names: { [this.user.uid]: this.profile.name, [th.peer]: f ? f.name : '' }, ts: Date.now() }, { merge: true }); this.chat.dmReady[id] = true; } }
            await this.chatRef(th).add({ uid: this.user.uid, name: this.profile.name, text: text.slice(0, 200), ts: Date.now() });
        } catch (e) { toast(errMsg(e)); }
    },

    // ===== 管理員登入：用獨立的 Firebase 連線驗證，不影響目前的玩家登入 =====
    async adminLogin() {
        const msg = t => { const m = $('ad-msg'); if (m) m.textContent = t; };
        const pw = ($('ad-pass') || {}).value || ''; if (!pw) return msg('請輸入管理員密碼');
        if (!fbOk || !navigator.onLine) return msg('需要網路連線');
        msg('驗證中…');
        try {
            if (!this.adminApp) { try { this.adminApp = firebase.app('admin'); } catch (e) { this.adminApp = firebase.initializeApp(CFG, 'admin'); } }
            const aAuth = this.adminApp.auth();
            try { await aAuth.setPersistence(firebase.auth.Auth.Persistence.NONE); } catch (e) {}
            await aAuth.signInWithEmailAndPassword(ADMIN_USER + MAIL, pw);
            this.adminDb = this.adminApp.firestore(); const f = $('ad-pass'); if (f) f.value = '';
            G.closeDlg(); G.setState('ADMIN');
        } catch (e) { this.adminDb = null; msg(({ 'auth/user-not-found': '管理員帳號尚未建立（請看設定說明）', 'auth/wrong-password': '管理員密碼錯誤', 'auth/invalid-credential': '管理員密碼錯誤', 'auth/invalid-login-credentials': '管理員密碼錯誤' }[e && e.code]) || errMsg(e)); }
    },
    adminLogout() { try { if (this._adUnsub) { this._adUnsub(); this._adUnsub = null; } this.adminApp && this.adminApp.auth().signOut(); } catch (e) {} this.adminDb = null; G.setState('LOBBY'); },

    roomRef(code) { return db.collection('rooms').doc(code); },
    async createRoom() {
        if (this.pk) return;
        try {
            for (let i = 0; i < 8; i++) {
                const code = String(Math.floor(1000 + Math.random() * 9000)), ref = this.roomRef(code);
                const ok = await db.runTransaction(async tx => {
                    const s = await tx.get(ref);
                    if (s.exists && s.data().state !== 'ended' && Date.now() - (s.data().createdAtMs || 0) < 2 * 3600 * 1000) return false;
                    tx.set(ref, { code, host: this.user.uid, hostName: this.profile.name, guest: null, guestName: '', stage: 1, hostShip: G.shipId, guestShip: '', hostReady: false, guestReady: false, state: 'lobby', createdAtMs: Date.now() });
                    return true;
                });
                if (ok) return this.enterRoom(code, 'host');
            }
            toast('建立房間失敗，請再試一次');
        } catch (e) { toast(errMsg(e)); }
    },
    async joinRoom(code) {
        code = (code || '').trim(); if (!/^\d{4}$/.test(code)) return toast('請輸入 4 位數房間密碼'); if (this.pk) return;
        try {
            const ref = this.roomRef(code), s = await ref.get();
            if (!s.exists || s.data().state !== 'lobby') return toast('找不到這個房間，或已經開始');
            const r = s.data(); if (r.guest && r.guest !== this.user.uid) return toast('房間已滿');
            if (r.host === this.user.uid) return toast('你是這個房間的主控端');
            await ref.update({ guest: this.user.uid, guestName: this.profile.name, guestShip: G.shipId, guestReady: false });
            this.enterRoom(code, 'guest');
        } catch (e) { toast(errMsg(e)); }
    },
    enterRoom(code, role) {
        const p = this.pk = { code, role, room: null, started: false, over: false, castQ: [], seen: new Set(), lastHp: -1, lastPush: 0 };
        p.unsub = this.roomRef(code).onSnapshot(s => {
            if (!this.pk || this.pk !== p) return;
            if (!s.exists) { if (!p.over) { toast('房間已關閉'); this.pkLeave(false); } return; }
            p.room = s.data(); const r = p.room;
            if (role === 'host' && r.guest === null && p.started) { /* 對手離開 */ }
            if (r.state === 'playing' && !p.started) this.startMatch(); else if (r.state === 'ended' && !p.over) this.endMatch(r.winner); else if (G.gameState === 'PK') this.renderPK();
        }, e => toast(errMsg(e)));
        if (G.gameState !== 'PK') G.setState('PK'); else this.renderPK();
    },
    roomUpdate(patch) { if (this.pk) return this.roomRef(this.pk.code).update(patch).catch(e => toast(errMsg(e))); },
    pkStage(d) { const r = this.pk.room; this.roomUpdate({ stage: Math.max(1, Math.min(9, (r.stage || 1) + d)) }); },
    pkShip(id) { G.shipId = id; G.applyUpgrades(); G.save(); this.roomUpdate({ [this.pk.role + 'Ship']: id }); },
    pkReady() { const k = this.pk.role + 'Ready'; this.roomUpdate({ [k]: !this.pk.room[k] }); },
    pkStart() { const r = this.pk.room; if (r.guest && r.hostReady && r.guestReady) this.roomUpdate({ state: 'playing', startAt: Date.now() }); },
    pkLeave(userAction) {
        const p = this.pk; if (!p) return; this.pk = null;
        try { p.unsub && p.unsub(); p.unsubEv && p.unsubEv(); } catch (e) {}
        clearInterval(this._pkTimer); const h = $('pk-hud'); if (h) h.remove();
        if (p.role === 'host') this.roomRef(p.code).delete().catch(() => {}); else if (!p.over) this.roomRef(p.code).update({ guest: null, guestName: '', guestReady: false }).catch(() => {});
        G.pkMode = false; if (userAction && G.gameState === 'PK') this.renderPK();
    },
    startMatch() {
        const p = this.pk, r = p.room; p.started = true; p.matchId = r.startAt;
        $('game-container').insertAdjacentHTML('beforeend', '<div id="pk-hud"></div>');
        const keep = { s: G.startStage, b: G.bestStage }; G.bestStage = 9; G.startStage = r.stage || 1; G.pkMode = true; G.pkTime = 0;
        const myShip = r[p.role + 'Ship']; if (myShip && G.fleet[myShip] && G.fleet[myShip].own) G.shipId = myShip;
        G.startNewGame(); G.startStage = keep.s; G.bestStage = keep.b;
        p.unsubEv = this.roomRef(p.code).collection('events').where('matchId', '==', p.matchId).onSnapshot(s => s.docChanges().forEach(ch => {
            if (ch.type !== 'added') return; const e = ch.doc.data(); if (e.by === this.user.uid || p.seen.has(ch.doc.id)) return; p.seen.add(ch.doc.id);
            p.castQ.push(e); this.pkNext();
        }), () => {});
        clearInterval(this._pkTimer); this._pkTimer = setInterval(() => this.pkTick(), 250);
    },
    pkSend(idiom) { const p = this.pk; if (!p || !p.started) return; this.roomRef(p.code).collection('events').add({ matchId: p.matchId, by: this.user.uid, name: this.profile.name, word: idiom.word, effect: idiom.effect, desc: idiom.desc, ts: Date.now() }).catch(() => {}); },
    pkNext() { const p = this.pk; if (p && p.castQ.length && !G.casting && G.gameState === 'PLAYING' && !p.over) { const e = p.castQ.shift(); G.startCast({ word: e.word, effect: e.effect, desc: e.desc }, e.name); } },
    pkApply(idiom) {   // 對手發動的攻擊在這裡結算（我是被攻擊方）
        const D = { BOMB_BOOST: 30, LASER_BEAM: 35, MISSILE: 25, PIERCE: 25 }[idiom.effect]; sfx.playIdiomFire(idiom.effect);
        if (!D) return; if (idiom.effect === 'PIERCE') G.shield = Math.floor(G.shield / 2);
        if (G.invincibleTimer > 1.05) { G.showFloatText('免疫', G.player.pos.x, G.player.pos.y - 50, '#7dffb0'); return; }
        G.hurt(D); G.showFloatText('-' + D, G.player.pos.x, G.player.pos.y - 50, '#ff3366'); G.burst(G.player.pos.x, G.player.pos.y, 16);
        if (idiom.effect === 'BOMB_BOOST') G.shock = { t: 0, x: G.player.pos.x, y: G.player.pos.y };
        G.updateHUD(); if (G.hp <= 0) this.pkSelfDead();
    },
    pkTick() {
        const p = this.pk; if (!p || !p.started || p.over) return;
        const me = p.role, opp = me === 'host' ? 'guest' : 'host', r = p.room || {}, hp = Math.max(0, Math.round(G.hp));
        if (hp !== p.lastHp || Date.now() - p.lastPush > 3000) { p.lastHp = hp; p.lastPush = Date.now(); this.roomUpdate({ [me + 'Hp']: hp, [me + 'Max']: Math.round(G.maxHp) }); }
        const left = Math.max(0, 180 - G.pkTime), oh = r[opp + 'Hp'] === undefined ? 100 : r[opp + 'Hp'], om = r[opp + 'Max'] || 100, h = $('pk-hud');
        if (h) h.innerHTML = `對手 ${esc(r[opp + 'Name'] || '')}　HP ${oh}　剩餘 ${Math.ceil(left)} 秒<div class="bar"><i style="width:${Math.min(100, oh / om * 100)}%"></i></div>`;
        if (left <= 0) { const oppHp = r[opp + 'Hp'] === undefined ? om : r[opp + 'Hp']; const w = hp > oppHp ? this.user.uid : hp < oppHp ? (me === 'host' ? r.guest : r.host) : 'draw'; this.pkFinish(w); }
        this.pkNext();
    },
    pkSelfDead() { const p = this.pk; if (!p || p.over) return; G.paused = true; const r = p.room || {}; this.pkFinish(p.role === 'host' ? r.guest : r.host); },
    pkFinish(w) { const p = this.pk; if (!p || p.over || p.finishing) return; p.finishing = true; this.roomUpdate({ state: 'ended', winner: w || 'draw' }); setTimeout(() => { if (this.pk === p && !p.over) this.endMatch(w || 'draw'); }, 1500); },
    endMatch(winner) {
        const p = this.pk; if (!p || p.over) return; p.over = true; G.pkMode = false; G.paused = true; clearInterval(this._pkTimer);
        const win = winner === this.user.uid, draw = winner === 'draw' || !winner;
        if (!draw) this.stat(win ? 'pkWins' : 'pkLosses', 1);
        sfx.playIdiomFire(win ? 'HEAL' : 'BOMB_BOOST');
        G.dialog(`<h2 style="color:${draw ? '#fff' : win ? 'var(--neon-gold)' : '#ff6b6b'}">${draw ? '平手' : win ? '勝利！' : '落敗'}</h2><p>PK 對戰結束</p><button class="btn btn-start" onclick="online.pkExit()">返回大廳</button>`, () => this.pkExit());
    },
    pkExit() { G.closeDlg(); this.pkLeave(false); G.setState('LOBBY'); }
};

function msgHtml(m, me) { const d = new Date(m.ts || 0); return `<div class="msg ${me ? 'me' : ''}"><b>${esc(m.name)}</b> ${esc(m.text)}<small>${pad(d.getHours(), 2)}:${pad(d.getMinutes(), 2)}</small></div>`; }

// ---------- 掛接到遊戲 ----------
const wrap = (name, fn) => { const o = P[name]; P[name] = function (...a) { return fn.call(this, o, ...a); }; };
const NEW = new Set(['LOGIN', 'RANK', 'FRIENDS', 'PK', 'DB', 'TUTORIAL', 'ADMIN']);
wrap('setState', function (o, state) {
    if (this.pkMode && (state === 'GAMEOVER' || state === 'VICTORY')) { online.pkSelfDead(); return; }
    if (NEW.has(state) && !['LOGIN', 'TUTORIAL', 'DB'].includes(state) && !online.user && !(state === 'ADMIN' && online.adminDb)) { toast('這個功能需要網路並登入'); return; }
    if (NEW.has(state)) { o.call(this, 'LOBBY'); this.gameState = state; online.renderState(state); return; }
    o.call(this, state); online.updateChatVis();
    if (state === 'GAMEOVER') online.finishRun(false); else if (state === 'VICTORY') online.finishRun(true);
});
wrap('renderLobby', function (o) { o.call(this); const t = document.querySelector('.tiles'); if (t) t.insertAdjacentHTML('beforeend', online.extraTiles()); });
wrap('save', function (o) { o.call(this); online.queuePush(); });
wrap('dropDarkMatter', function (o, ...a) { const b = this.darkMatter; o.apply(this, a); const d = this.darkMatter - b; if (d > 0) online.stat('totalDM', d); });
['buyItem', 'upgrade'].forEach(n => wrap(n, function (o, ...a) { const b = this.darkMatter; o.apply(this, a); const d = b - this.darkMatter; if (d > 0) online.stat('spentDM', d); }));
wrap('startNewGame', function (o) { o.call(this); this.runDM = 0; this.runClock = 0; this.runStart = this.currentStage; });
wrap('startTransition', function (o, n) { if (this.pkMode) { this.currentSub = 1; this.resetStage(); return; } o.call(this, n); });
wrap('startCast', function (o, idiom, remote) {
    o.call(this, idiom);
    if (remote) { this.casting.remote = remote; const e = document.querySelector('#idiom-popup .ip-effect'); if (e) e.innerHTML = `<span style="color:#ff6b6b">對手 ${esc(remote)} 發動！</span> ${esc(e.textContent)}`; }
    else if (this.pkMode) online.pkSend(idiom);
});
wrap('finishCast', function (o) { const c = this.casting; if (c && c.remote) { this.endCast(); online.pkApply(c.idiom); } else o.call(this); online.pkNext(); });
wrap('leave', function (o) { if (this.pkMode) { this.closeDlg(); online.pkSelfDead(); return; } o.call(this); });
wrap('openSettings', function (o) {
    o.call(this); const box = document.querySelector('#dlg .box'); if (!box) return;
    const last = box.querySelector('.btn-start'), d = document.createElement('div');
    d.innerHTML = `${online.profile ? `<p class="muted">帳號：${esc(online.profile.name)}（${esc(online.profile.username)}）</p>${online.user ? '<button class="btn" onclick="game.closeDlg();online.logout()">登出</button>' : ''}` : ''}
        <div style="margin-top:8px;border-top:1px solid #334;padding-top:8px;text-align:left"><label>管理員登入<input class="inp" id="ad-pass" type="password" placeholder="輸入管理員密碼" autocomplete="off"></label>
        <button class="btn" onclick="online.adminLogin()">登入管理員</button>${online.adminDb ? '<button class="btn btn-start" onclick="game.closeDlg();game.setState(\'ADMIN\')">進入管理員介面</button>' : ''}<div id="ad-msg" class="lg-msg"></div></div>`;
    box.insertBefore(d, last);
    const pw = d.querySelector('#ad-pass'); if (pw) pw.onkeydown = e => { if (e.key === 'Enter') online.adminLogin(); };
});
wrap('handleKey', function (o, e) {
    const st = this.gameState;
    if (NEW.has(st) && !this.dlgOpen) {
        if (st === 'TUTORIAL') { if (e.code === 'ArrowRight' || e.code === 'Enter') { online.tut >= online._tutLen - 1 ? online.tutDone() : online.renderTutorial(online.tut + 1); } else if (e.code === 'ArrowLeft') online.renderTutorial(online.tut - 1); else if (e.code === 'Escape') online.tutDone(); return; }
        if (e.code === 'Escape' && st !== 'LOGIN') { if (st === 'PK' && online.pk) return; this.setState('LOBBY'); } return;
    }
    o.call(this, e);
});

window.addEventListener('online', () => { if (online.offline) toast('已恢復網路：點大廳的「連線登入」即可同步進度', 5000); });

// ---------- 啟動 ----------
online.authReady = new Promise(res => {
    if (!fbOk) return res();
    auth.onAuthStateChanged(async u => { try { if (u) await online.onLogin(u); else online.onLogout(); } catch (e) { console.error(e); toast(errMsg(e)); } finally { res(); } });
});
})();

</script>
